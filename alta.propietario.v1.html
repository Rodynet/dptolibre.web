<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DptoLibre Admin - Contrato Vinculado V3</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para procesar JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --brand-blue: #0055DD;
            --brand-dark: #0D1B4B;
            --brand-cyan: #00D1FF;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f1f5f9;
            color: #1e293b;
            margin: 0;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Animaciones de Entrada */
        .animate-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Estilos de la Puerta (Animación 3D) */
        .door-perspective {
            perspective: 1000px;
        }
        .door-leaf {
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: var(--origin);
        }
        .door-open-left { transform: rotateY(-110deg); opacity: 0.3; }
        .door-open-right { transform: rotateY(110deg); opacity: 0.3; }

        /* Animación de la Llave */
        .key-float {
            animation: floatKey 2s ease-in-out infinite;
        }
        @keyframes floatKey {
            0%, 100% { transform: translateY(0) rotate(-10deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        .success-bg {
            background: linear-gradient(135deg, #0D1B4B 0%, #0055DD 100%);
        }

        .share-pop {
            animation: sharePop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 1.8s;
            opacity: 0;
            transform: scale(0.8);
        }
        @keyframes sharePop { to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- COMPONENTE ICONO ---
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // --- COMPONENTE PUERTA ANIMADA ---
        const DoorAnimation = ({ isOpen }) => (
            <div className="door-perspective flex gap-1 h-48 w-40 mx-auto relative mb-8">
                <div 
                    className={`door-leaf w-1/2 h-full bg-indigo-500 rounded-l-2xl border-r border-indigo-400/30 ${isOpen ? 'door-open-left' : ''}`}
                    style={{"--origin": "left"}}
                ></div>
                <div 
                    className={`door-leaf w-1/2 h-full bg-indigo-500/40 rounded-r-2xl border-l border-white/10 ${isOpen ? 'door-open-right' : ''}`}
                    style={{"--origin": "right"}}
                ></div>
                {isOpen && (
                    <div className="absolute inset-0 flex items-center justify-center animate-in fade-in duration-1000 delay-500">
                        <Icon name="sparkles" size={48} className="text-amber-300" />
                    </div>
                )}
            </div>
        );

        function DptoLibreAdminWeb() {
            const [view, setView] = useState('linked'); // linked, bank, payment, sign, achievement, dashboard
            const [isProcessing, setIsProcessing] = useState(false);
            const [isDoorOpen, setIsDoorOpen] = useState(false);

            const handleTransition = (nextView) => {
                setIsProcessing(true);
                setTimeout(() => {
                    setIsProcessing(false);
                    setView(nextView);
                    if (nextView === 'achievement') {
                        setTimeout(() => setIsDoorOpen(true), 600);
                    }
                }, 1500);
            };

            // --- COMPONENTES DE LAYOUT ---
            const Sidebar = () => (
                <aside className="w-72 bg-slate-900 text-white flex flex-col h-full border-r border-slate-800 p-8 fixed left-0 top-0">
                    <div className="flex items-center gap-3 mb-12">
                        <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black text-xl">B</div>
                        <div>
                            <h1 className="font-black tracking-tighter text-xl leading-none italic">BLINDATO</h1>
                            <p className="text-[10px] text-indigo-400 font-bold uppercase tracking-widest mt-1">Admin Console</p>
                        </div>
                    </div>
                    <nav className="flex-1 space-y-2">
                        {['Dashboard', 'Propiedades', 'Inquilinos', 'Tesorería', 'Tickets'].map(item => (
                            <div key={item} className={`p-4 rounded-xl font-bold flex items-center gap-3 cursor-pointer transition-all ${view === 'dashboard' && item === 'Tesorería' ? 'bg-indigo-600 text-white' : 'text-slate-500 hover:text-white'}`}>
                                <Icon name={item === 'Dashboard' ? 'layout-dashboard' : item === 'Tesorería' ? 'wallet' : 'building'} size={20}/>
                                <span>{item}</span>
                            </div>
                        ))}
                    </nav>
                </aside>
            );

            const Header = () => (
                <header className="h-20 bg-white border-b border-slate-100 flex justify-between items-center px-10 fixed top-0 right-0 left-72 z-40 shadow-sm">
                    <div className="flex items-center gap-4 text-slate-400 font-bold text-[10px] uppercase tracking-widest">
                        <span>Gestión de Cierre</span>
                        <Icon name="chevron-right" size={14} />
                        <span className="text-slate-900">Operación #BL-99201</span>
                    </div>
                    <div className="flex items-center gap-6">
                        <Icon name="search" className="text-slate-300" />
                        <Icon name="bell" className="text-slate-300" />
                        <div className="w-10 h-10 rounded-full bg-slate-100 border border-slate-200"></div>
                    </div>
                </header>
            );

            // --- VISTAS DEL FLUJO ---

            const ContractLinked = () => (
                <div className="max-w-2xl mx-auto py-12 animate-in">
                    <div className="bg-white rounded-[3rem] p-12 shadow-2xl border border-slate-50 text-center">
                        <div className="relative mb-8 inline-block">
                            <div className="w-24 h-24 bg-indigo-50 rounded-[2rem] flex items-center justify-center text-indigo-600 mx-auto shadow-inner"><Icon name="file-text" size={48} /></div>
                            <div className="absolute -top-2 -right-2 bg-emerald-500 text-white p-2 rounded-full border-4 border-white shadow-lg"><Icon name="check" size={16} strokeWidth={4} /></div>
                        </div>
                        <h2 className="text-3xl font-black text-slate-900 tracking-tighter mb-4 uppercase italic">Contrato Detectado</h2>
                        <p className="text-slate-400 font-medium mb-10 px-12 leading-relaxed">Legajo de Inmobiliaria Raíces vinculado exitosamente a tu pasaporte.</p>
                        <div className="bg-slate-900 rounded-[2.5rem] p-8 text-white text-left relative overflow-hidden shadow-2xl">
                            <Icon name="building" size={100} className="absolute right-[-20px] bottom-[-20px] opacity-10" />
                            <h4 className="text-2xl font-bold mb-6 leading-none">Caseros 1230, 4B</h4>
                            <div className="grid grid-cols-2 gap-8 border-t border-white/10 pt-6">
                                <div><p className="text-[10px] font-bold opacity-50 uppercase tracking-widest">Alquiler</p><p className="text-xl font-black text-emerald-400">$450.000</p></div>
                                <div><p className="text-[10px] font-bold opacity-50 uppercase tracking-widest">Expensas</p><p className="text-xl font-black text-indigo-300">$65.000</p></div>
                            </div>
                        </div>
                        <button onClick={() => setView('bank')} className="mt-12 w-full max-w-sm bg-indigo-600 text-white py-5 rounded-[2rem] font-black text-sm uppercase tracking-widest shadow-xl shadow-indigo-100 hover:bg-indigo-700 active:scale-95 transition-all">CONFIGURAR CUENTA DE PAGO</button>
                    </div>
                </div>
            );

            const BankSetup = () => (
                <div className="max-w-2xl mx-auto py-12 animate-in">
                    <div className="bg-white rounded-[3rem] shadow-2xl p-16 border border-slate-50">
                        <header className="text-center mb-12">
                            <h2 className="text-3xl font-black text-slate-900 tracking-tighter uppercase mb-2">Cuenta de Pago</h2>
                            <p className="text-slate-400 font-medium">Vinculá tu Alias o CBU para automatizar la tesorería.</p>
                        </header>
                        <div className="space-y-8">
                            <div className="space-y-3 text-left">
                                <label className="text-[10px] font-black uppercase text-slate-400 tracking-[0.2em] ml-2">Alias / CBU</label>
                                <input type="text" placeholder="ej: marcos.galperin.banco" className="w-full bg-slate-50 border-2 border-slate-100 p-6 rounded-3xl text-xl font-bold focus:border-indigo-600 outline-none transition-all shadow-inner" />
                            </div>
                            <div className="bg-emerald-50 p-8 rounded-[2rem] border border-emerald-100 flex gap-6">
                                <div className="w-14 h-14 bg-emerald-500 rounded-2xl flex items-center justify-center text-white shrink-0"><Icon name="shield-check" size={32} /></div>
                                <div><h4 className="font-black text-emerald-900 text-sm uppercase">Sincronización COELSA</h4><p className="text-xs text-emerald-700 font-medium leading-relaxed">Validamos la titularidad de tu cuenta en tiempo real para habilitar transferencias automáticas.</p></div>
                            </div>
                            <button onClick={() => handleTransition('payment')} className="w-full bg-slate-900 text-white py-5 rounded-[2rem] font-black text-sm uppercase tracking-widest shadow-xl">VALIDAR Y CONTINUAR</button>
                        </div>
                    </div>
                </div>
            );

            const PaymentLiquidation = () => (
                <div className="max-w-3xl mx-auto py-12 animate-in">
                    <div className="bg-slate-900 text-white rounded-[4rem] shadow-2xl overflow-hidden flex flex-col">
                        <div className="p-16 flex-1">
                            <header className="mb-12"><h2 className="text-4xl font-black uppercase tracking-tighter leading-none italic">Gastos de Ingreso</h2><p className="text-indigo-400 text-sm font-bold uppercase tracking-widest mt-1">Liquidación Blindato V3</p></header>
                            <div className="space-y-2">
                                {[
                                    { l: 'Mes de Adelanto', v: 450000 },
                                    { l: 'Garantía de Caución DptoLibre', v: 45000, h: true },
                                    { l: 'Módulo Verificación Infoexperto', v: 5000 },
                                    { l: 'Honorarios Gestión Inmobiliaria', v: 22500 },
                                    { l: 'Sello Legal Digital', v: 1200 }
                                ].map((item, i) => (
                                    <div key={i} className="flex justify-between items-center py-5 border-b border-white/5">
                                        <span className={`text-sm font-bold uppercase tracking-widest ${item.h ? 'text-[#00D1FF]' : 'text-white/40'}`}>{item.l}</span>
                                        <span className="text-xl font-black">${item.v.toLocaleString('es-AR')}</span>
                                    </div>
                                ))}
                                <div className="pt-10 flex justify-between items-end">
                                    <div><p className="text-[10px] font-black uppercase text-emerald-400 tracking-widest mb-1">Total a Liquidar</p><h3 className="text-6xl font-black text-white">$523.700</h3></div>
                                    <div className="text-right pb-2 opacity-40"><p className="text-[10px] font-bold uppercase">Vía Galicia</p></div>
                                </div>
                            </div>
                        </div>
                        <div className="bg-white p-12 text-slate-900 flex items-center justify-between">
                            <div className="flex gap-4 items-center"><Icon name="info" className="text-indigo-600" /><p className="text-xs font-bold text-slate-500 italic max-w-sm">Al confirmar se orquestará el débito total para habilitar la firma inmediata.</p></div>
                            <button onClick={() => setView('sign')} className="bg-indigo-600 text-white px-12 py-5 rounded-[2rem] font-black text-sm uppercase tracking-widest shadow-2xl active:scale-95 transition-all">CONFIRMAR Y PAGAR</button>
                        </div>
                    </div>
                </div>
            );

            const ContractSignature = () => (
                <div className="max-w-4xl mx-auto py-12 animate-in h-[700px] flex flex-col">
                    <div className="bg-white rounded-[3rem] shadow-2xl border border-slate-100 flex-1 flex flex-col overflow-hidden">
                        <header className="p-8 bg-slate-50 border-b flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 bg-white rounded-2xl flex items-center justify-center text-indigo-600 shadow-sm"><Icon name="file-text" /></div>
                                <div><h2 className="text-2xl font-black text-slate-900 tracking-tighter">Contrato de Locación</h2><p className="text-[10px] font-black text-slate-400 uppercase mt-1">ID: CTR-99021882-X</p></div>
                            </div>
                            <div className="flex gap-2"><button className="p-3 bg-white border border-slate-200 rounded-xl"><Icon name="download" /></button></div>
                        </header>
                        <div className="flex-1 p-12 overflow-y-auto bg-white text-slate-600 leading-relaxed text-lg italic">
                            <p className="text-center font-black text-slate-900 uppercase border-b-2 border-slate-100 pb-8 mb-8 text-2xl">Alquiler de Unidad Funcional</p>
                            <p className="mb-6">Entre el Sr Roberto Daer (LOCADOR) y el Sr Marcos Galperin (LOCATARIO) acuerdan...</p>
                            <p className="mb-6"><strong>PRIMERA:</strong> El locador entrega en locación al locatario la unidad ubicada en Caseros 1230, 4B...</p>
                            <div className="h-64 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-100 flex items-center justify-center text-slate-300">Deslizá para leer el resto del documento...</div>
                        </div>
                        <footer className="p-8 bg-slate-50 border-t flex items-center justify-between">
                            <div className="flex items-center gap-3"><input type="checkbox" className="w-6 h-6 rounded-lg accent-indigo-600" id="terms" /><label htmlFor="terms" className="text-xs font-bold text-slate-500 uppercase">Acepto los términos y blindaje legal</label></div>
                            <button onClick={() => setView('achievement')} className="bg-[#0D1B4B] text-white px-10 py-5 rounded-[2rem] font-black text-xs uppercase tracking-widest shadow-xl flex items-center gap-3">
                                <Icon name="pen-tool" size={18} /> FIRMAR CON INFOEXPERTO-ID
                            </button>
                        </footer>
                    </div>
                </div>
            );

            // --- 5. PANTALLA: LOGRO Y PUERTA (CELEBRACIÓN V3) ---
            const AchievementCelebration = () => {
                const [showShare, setShowShare] = useState(false);
                useEffect(() => {
                    setTimeout(() => setIsDoorOpen(true), 600);
                    setTimeout(() => setShowShare(true), 2000);
                }, []);

                return (
                    <div className="fixed inset-0 bg-slate-900 z-[100] flex flex-col items-center justify-center p-12 overflow-hidden text-white text-center animate-in">
                        <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-indigo-500/20 to-transparent"></div>
                        
                        <div className="relative mb-12 key-float">
                            <div className="w-40 h-40 bg-amber-400 rounded-full flex items-center justify-center shadow-[0_0_80px_rgba(251,191,36,0.6)] border-4 border-white/20">
                                <Icon name="key" size={80} className="text-slate-900" />
                            </div>
                            <div className="absolute -top-4 -right-4 animate-bounce"><Icon name="sparkles" size={40} className="text-white" /></div>
                        </div>

                        <DoorAnimation isOpen={isDoorOpen} />

                        <div className="relative z-10 space-y-4">
                            <h1 className="text-6xl font-black tracking-tighter uppercase mb-2 italic">¡LO LOGRASTE!</h1>
                            <p className="text-indigo-300 text-xl font-medium opacity-80">Contrato blindado y propiedad abierta.</p>
                        </div>

                        {showShare && (
                            <div className="share-pop w-full max-w-lg mt-12 bg-white/10 backdrop-blur-xl border border-white/20 p-8 rounded-[3rem] shadow-2xl relative z-40">
                                <p className="text-sm font-black uppercase tracking-widest text-emerald-400 mb-8 italic">Contá la noticia en tus redes</p>
                                <div className="flex justify-center gap-8 mb-8">
                                    <button onClick={() => alert('Compartiendo...')} className="flex flex-col items-center gap-2 group">
                                        <div className="w-16 h-16 bg-gradient-to-tr from-purple-500 to-pink-500 rounded-2xl flex items-center justify-center shadow-lg group-active:scale-90 transition-transform"><Icon name="instagram" size={32} /></div>
                                        <span className="text-[10px] font-black uppercase">Story</span>
                                    </button>
                                    <button onClick={() => alert('Compartiendo...')} className="flex flex-col items-center gap-2 group">
                                        <div className="w-16 h-16 bg-[#25D366] rounded-2xl flex items-center justify-center shadow-lg group-active:scale-90 transition-transform"><Icon name="message-circle" size={32} /></div>
                                        <span className="text-[10px] font-black uppercase">WhatsApp</span>
                                    </button>
                                    <button onClick={() => alert('Compartiendo...')} className="flex flex-col items-center gap-2 group">
                                        <div className="w-16 h-16 bg-black rounded-2xl flex items-center justify-center shadow-lg group-active:scale-90 transition-transform border border-white/10"><Icon name="twitter" size={32} /></div>
                                        <span className="text-[10px] font-black uppercase">Post X</span>
                                    </button>
                                </div>
                                <button onClick={() => setView('dashboard')} className="text-[#00D1FF] font-black text-xs uppercase tracking-[0.3em] py-4 hover:opacity-70 transition-opacity">IR A MI DASHBOARD ADMIN</button>
                            </div>
                        )}
                    </div>
                );
            };

            const AdminDashboard = () => (
                <div className="p-12 space-y-10 animate-in fade-in">
                    <header className="flex justify-between items-end">
                        <div>
                            <h1 className="text-4xl font-black text-slate-800 tracking-tighter uppercase leading-none">Tesorería</h1>
                            <p className="text-slate-400 font-medium mt-2">Visión de los tres bolsillos operativos del gestor.</p>
                        </div>
                        <div className="flex gap-4">
                            <button className="bg-indigo-600 text-white px-8 py-4 rounded-2xl font-black text-[11px] uppercase tracking-widest shadow-xl shadow-indigo-100">Liquidar masivo</button>
                        </div>
                    </header>

                    <div className="grid grid-cols-3 gap-8">
                        <div className="bg-white p-10 rounded-[3rem] border border-slate-100 shadow-sm relative overflow-hidden flex flex-col justify-between">
                            <div><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 leading-none">1. Recaudación Bruta</p><h3 className="text-3xl font-black text-slate-900 mt-2">$12.540.800</h3></div>
                            <div className="mt-6 flex items-center gap-2 text-emerald-500 font-black text-[11px]"><Icon name="trending-up" size={16} /> +$12.4k INTERESES HOY</div>
                        </div>
                        <div className="bg-slate-900 p-10 rounded-[3rem] text-white shadow-2xl relative overflow-hidden flex flex-col justify-between">
                           <Icon name="zap" className="absolute right-[-10px] top-[-10px] text-white/5" size={100} />
                           <div><p className="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-1 leading-none">2. Mis Ganancias (Honorarios)</p><h3 className="text-3xl font-black mt-2 text-[#00D1FF]">$840.500</h3></div>
                           <button className="mt-6 bg-white text-slate-900 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg">Invertir Saldo</button>
                        </div>
                        <div className="bg-white p-10 rounded-[3rem] border border-slate-100 shadow-sm flex flex-col justify-between">
                           <div><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 leading-none">3. Saldo de Dueños</p><h3 className="text-3xl font-black text-slate-800 mt-2">$7.820.000</h3></div>
                           <div className="mt-6 flex items-center gap-2 text-amber-500 font-black text-[11px]"><Icon name="clock" size={16} /> 14 DUEÑOS POR LIQUIDAR</div>
                        </div>
                    </div>

                    <section className="bg-white rounded-[3rem] border border-slate-100 shadow-sm overflow-hidden animate-in">
                        <div className="p-8 flex items-center justify-between bg-slate-50 border-b border-slate-100">
                             <div className="flex items-center gap-4"><div className="w-12 h-12 bg-white rounded-2xl flex items-center justify-center text-indigo-600 shadow-sm"><Icon name="building-2" /></div><div><h4 className="font-black text-slate-800">Caseros 1230, 4B</h4><p className="text-[10px] text-slate-400 font-bold uppercase">Estado: Blindado</p></div></div>
                             <div className="text-right"><p className="text-[10px] font-black text-slate-400 uppercase mb-1">Próximo Cobro</p><p className="text-2xl font-black text-slate-800">$450.000</p></div>
                        </div>
                        <div className="p-6 grid grid-cols-3 divide-x divide-slate-100 text-center">
                            <div className="p-2 flex flex-col gap-1 cursor-pointer hover:bg-slate-50 rounded-xl transition-colors"><Icon name="file-text" size={20} className="mx-auto text-slate-400"/><span className="text-[9px] font-black uppercase text-slate-500">Contrato PDF</span></div>
                            <div className="p-2 flex flex-col gap-1 cursor-pointer hover:bg-slate-50 rounded-xl transition-colors"><Icon name="shield-check" size={20} className="mx-auto text-emerald-500"/><span className="text-[9px] font-black uppercase text-slate-500">Garantía Activa</span></div>
                            <div className="p-2 flex flex-col gap-1 cursor-pointer hover:bg-slate-50 rounded-xl transition-colors"><Icon name="settings" size={20} className="mx-auto text-slate-400"/><span className="text-[9px] font-black uppercase text-slate-500">Configurar</span></div>
                        </div>
                    </section>
                </div>
            );

            return (
                <div className="flex h-screen w-full font-sans text-slate-900 bg-slate-50 overflow-hidden">
                    {view !== 'achievement' && <Sidebar />}
                    
                    <div className={`flex-1 flex flex-col ${view !== 'achievement' ? 'pl-72' : ''}`}>
                        {view !== 'achievement' && <Header />}
                        
                        <main className={`flex-1 overflow-y-auto no-scrollbar ${view !== 'achievement' ? 'pt-20' : ''}`}>
                            {view === 'linked' && <ContractLinked />}
                            {view === 'bank' && <BankSetup />}
                            {view === 'payment' && <PaymentLiquidation />}
                            {view === 'sign' && <ContractSignature />}
                            {view === 'achievement' && <AchievementCelebration />}
                            {view === 'dashboard' && <AdminDashboard />}
                        </main>
                    </div>

                    {isProcessing && (
                        <div className="fixed inset-0 bg-white/90 backdrop-blur-md z-[500] flex flex-col items-center justify-center animate-in fade-in">
                            <div className="w-16 h-16 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-4 shadow-[0_0_15px_rgba(79,70,229,0.2)]"></div>
                            <p className="text-xs font-black text-indigo-600 uppercase tracking-[0.3em] animate-pulse italic">Validando...</p>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DptoLibreAdminWeb />);
    </script>
</body>
</html>
