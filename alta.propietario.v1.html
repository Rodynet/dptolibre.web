<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blindato Admin - Alta Usuario AI V2.1</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --brand-blue: #0055DD;
            --brand-dark: #0A142F;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
            color: #1e293b;
        }

        .animate-bubble { 
            animation: bubbleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
        }
        @keyframes bubbleIn { 
            from { opacity: 0; transform: translateY(15px) scale(0.95); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }

        .bot-bubble {
            @apply bg-white border border-slate-100 p-5 rounded-tr-[2rem] rounded-br-[2rem] rounded-bl-[2rem] shadow-sm max-w-[85%] text-sm font-medium leading-relaxed;
        }

        .user-bubble {
            @apply bg-[#0055DD] text-white p-5 rounded-tl-[2rem] rounded-bl-[2rem] rounded-br-[2rem] shadow-lg max-w-[80%] text-sm font-bold ml-auto;
        }

        .input-chat {
            @apply w-full bg-white border-2 border-slate-100 px-6 py-4 rounded-2xl text-base font-bold focus:ring-4 focus:ring-blue-50 focus:border-[#0055DD] outline-none transition-all;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .sidebar { background-color: #0A142F; }

        .typing-dot {
            width: 4px; height: 4px; background: #94a3b8; border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

        .role-card {
            @apply p-4 bg-white border-2 border-slate-50 rounded-2xl text-left font-bold text-slate-700 flex items-center gap-3 hover:border-[#0055DD] hover:bg-blue-50 transition-all active:scale-95 cursor-pointer;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { 
                if (window.lucide) window.lucide.createIcons(); 
            }, [name, size, className]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        function BlindatoAdminApp() {
            // Pasos: 0:Nombre, 1:Apellido, 2:Email, 3:Teléfono, 4:Perfil, 5:Resumen, 6:Éxito
            const [step, setStep] = useState(0);
            const [isMassive, setIsMassive] = useState(false);
            const [isTyping, setIsTyping] = useState(false);
            const [userData, setUserData] = useState({ name: '', lastName: '', email: '', phone: '', role: '' });
            const scrollRef = useRef(null);

            // Función para avanzar el paso
            const handleNextStep = () => {
                // Validación de campos vacíos
                if (step === 0 && !userData.name.trim()) return;
                if (step === 1 && !userData.lastName.trim()) return;
                if (step === 2 && !userData.email.trim()) return;
                if (step === 3 && !userData.phone.trim()) return;

                // Avanzamos el paso INMEDIATAMENTE para que aparezca la burbuja del usuario
                const nextStep = step + 1;
                setStep(nextStep);

                // Mostramos al bot "escribiendo" antes de que aparezca la siguiente pregunta
                if (nextStep < 6) {
                    setIsTyping(true);
                    setTimeout(() => {
                        setIsTyping(false);
                    }, 1000);
                }
            };

            const selectRole = (roleName) => {
                setUserData({ ...userData, role: roleName });
                handleNextStep();
            };

            const editData = () => {
                setStep(0); // Reinicia pero mantiene los datos para editar
            };

            // Auto-scroll al final del chat
            useEffect(() => {
                if (scrollRef.current) {
                    scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
                }
            }, [step, isTyping]);

            const Sidebar = () => (
                <aside className="w-24 sidebar text-white flex flex-col items-center py-8 gap-10 border-r border-slate-800 h-screen fixed left-0 top-0 z-50 shadow-2xl">
                    <div className="w-12 h-12 bg-indigo-500 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-lg">B</div>
                    <nav className="flex flex-col gap-8 text-slate-500">
                        <div className="p-3 hover:text-white transition-colors cursor-pointer"><Icon name="layout-grid" size={24} /></div>
                        <div className="p-3 bg-indigo-500/10 text-indigo-400 rounded-xl"><Icon name="user-plus" size={24} /></div>
                        <div className="p-3 hover:text-white transition-colors cursor-pointer"><Icon name="building" size={24} /></div>
                        <div className="p-3 hover:text-white transition-colors cursor-pointer"><Icon name="file-text" size={24} /></div>
                        <div className="p-3 hover:text-white transition-colors cursor-pointer"><Icon name="wallet" size={24} /></div>
                    </nav>
                </aside>
            );

            return (
                <div className="flex min-h-screen w-full relative overflow-hidden bg-[#F8FAFC]">
                    <Sidebar />
                    
                    <main className="flex-1 flex flex-col ml-24 h-screen max-w-4xl mx-auto relative border-x border-slate-100 bg-white shadow-sm">
                        
                        <header className="p-6 border-b border-slate-50 flex justify-between items-center bg-white sticky top-0 z-40">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-[#0055DD] shadow-inner">
                                    <Icon name="sparkles" size={20} />
                                </div>
                                <div>
                                    <h2 className="text-sm font-black uppercase tracking-widest text-slate-800 leading-none italic">Secretaría Digital</h2>
                                    <p className="text-[10px] text-emerald-500 font-bold uppercase mt-1">Conectado • Asistente AI</p>
                                </div>
                            </div>
                            <button 
                                onClick={() => { setIsMassive(!isMassive); setStep(0); }}
                                className="bg-slate-50 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-400 border border-slate-100 hover:text-indigo-600 transition-all"
                            >
                                {isMassive ? "Vía Chat" : "Carga Masiva"}
                            </button>
                        </header>

                        <div ref={scrollRef} className="flex-1 overflow-y-auto p-8 space-y-8 no-scrollbar pb-48">
                            
                            {/* Bot: Inicio */}
                            <div className="bot-bubble animate-bubble">
                                <p>¡Hola! Soy tu asistente de Blindato. Vamos a invitar a un usuario nuevo. Es muy rápido.</p>
                                <p className="mt-2 text-indigo-500 font-bold italic">¿Cuál es su nombre?</p>
                            </div>

                            {isMassive && (
                                <div className="bot-bubble animate-bubble bg-indigo-50 border-indigo-100">
                                    <h4 className="font-black uppercase text-[10px] mb-4 text-indigo-600 tracking-widest text-center">Importación Masiva</h4>
                                    <label className="w-full border-2 border-dashed border-indigo-200 rounded-3xl p-12 flex flex-col items-center justify-center cursor-pointer bg-white hover:bg-indigo-50 transition-all group">
                                        <input type="file" className="hidden" />
                                        <Icon name="upload-cloud" size={48} className="text-indigo-300 group-hover:scale-110 transition-transform mb-4" />
                                        <p className="text-[10px] font-black uppercase text-slate-400">Suelta tu archivo .xlsx o .csv aquí</p>
                                    </label>
                                </div>
                            )}

                            {/* CHAT DINÁMICO */}
                            {!isMassive && (
                                <React.Fragment>
                                    {/* RESPUESTAS Y PREGUNTAS */}
                                    {step >= 1 && <div className="user-bubble animate-bubble">{userData.name}</div>}
                                    {step === 1 && !isTyping && <div className="bot-bubble animate-bubble italic">¿Y su apellido?</div>}

                                    {step >= 2 && <div className="user-bubble animate-bubble">{userData.lastName}</div>}
                                    {step === 2 && !isTyping && <div className="bot-bubble animate-bubble">Perfecto. ¿Cuál es su correo electrónico?</div>}

                                    {step >= 3 && <div className="user-bubble animate-bubble">{userData.email}</div>}
                                    {step === 3 && !isTyping && <div className="bot-bubble animate-bubble">¿A qué teléfono o WhatsApp enviamos la invitación?</div>}

                                    {step >= 4 && <div className="user-bubble animate-bubble">{userData.phone}</div>}
                                    {step === 4 && !isTyping && (
                                        <div className="bot-bubble animate-bubble">
                                            <p>Excelente. Por último, selecciona el perfil para <strong>{userData.name}</strong>:</p>
                                            <div className="mt-6 flex flex-col gap-3">
                                                {[
                                                    { id: 'Inquilino', icon: 'user', desc: 'Solicitante' },
                                                    { id: 'Propietario', icon: 'shield', desc: 'Dueño' },
                                                    { id: 'Administrador', icon: 'building-2', desc: 'Gestor' }
                                                ].map(roleItem => (
                                                    <div 
                                                        key={roleItem.id} 
                                                        onClick={() => selectRole(roleItem.id)}
                                                        className="role-card group"
                                                    >
                                                        <div className="w-10 h-10 bg-slate-50 rounded-xl flex items-center justify-center text-slate-400 group-hover:bg-[#0055DD] group-hover:text-white transition-all">
                                                            <Icon name={roleItem.icon} size={18}/>
                                                        </div>
                                                        <div className="flex-1">
                                                            <p className="text-xs font-black uppercase tracking-widest">{roleItem.id}</p>
                                                            <p className="text-[9px] text-slate-400 font-bold uppercase">{roleItem.desc}</p>
                                                        </div>
                                                        <Icon name="chevron-right" size={16} className="text-slate-200 group-hover:text-slate-400" />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* RESUMEN FINAL */}
                                    {step >= 5 && userData.role && <div className="user-bubble animate-bubble uppercase tracking-widest">{userData.role}</div>}
                                    {step === 5 && !isTyping && (
                                        <div className="bot-bubble animate-bubble bg-slate-50 border-slate-200">
                                            <div className="flex items-center gap-2 mb-4 text-[#0055DD]">
                                                <Icon name="file-text" size={16} />
                                                <h4 className="font-black uppercase text-[10px] tracking-widest">Resumen de la Invitación</h4>
                                            </div>
                                            <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm space-y-3 mb-6">
                                                <div className="flex justify-between items-center"><span className="text-[10px] text-slate-400 uppercase font-black">Nombre</span><span className="text-sm font-bold text-slate-700">{userData.name} {userData.lastName}</span></div>
                                                <div className="flex justify-between items-center"><span className="text-[10px] text-slate-400 uppercase font-black">Email</span><span className="text-sm font-bold text-slate-700">{userData.email}</span></div>
                                                <div className="flex justify-between items-center"><span className="text-[10px] text-slate-400 uppercase font-black">WhatsApp</span><span className="text-sm font-bold text-slate-700">{userData.phone}</span></div>
                                                <div className="flex justify-between items-center border-t border-slate-50 pt-3"><span className="text-[10px] text-slate-400 uppercase font-black">Perfil</span><span className="text-xs font-black text-indigo-600 uppercase tracking-widest">{userData.role}</span></div>
                                            </div>
                                            <div className="flex gap-3">
                                                <button onClick={handleNextStep} className="flex-1 bg-indigo-600 text-white py-4 rounded-xl font-black text-xs uppercase tracking-widest shadow-xl shadow-indigo-100 active:scale-95 transition-all">Confirmar y Enviar</button>
                                                <button onClick={editData} className="px-6 py-4 bg-white text-slate-400 border border-slate-200 rounded-xl font-black text-xs uppercase hover:text-red-500 active:scale-95 transition-all">Editar</button>
                                            </div>
                                        </div>
                                    )}

                                    {/* ÉXITO */}
                                    {step >= 6 && (
                                        <div className="space-y-6">
                                            <div className="bot-bubble animate-bubble bg-emerald-50 border-emerald-100">
                                                <div className="flex items-center gap-3 text-emerald-600 mb-2">
                                                    <Icon name="check-circle" size={24} strokeWidth={3} />
                                                    <h4 className="font-black uppercase tracking-tighter text-lg">Invitación Enviada</h4>
                                                </div>
                                                <p className="text-emerald-700 font-medium leading-relaxed">
                                                    Listo. El usuario recibirá un link para validar su identidad y completar su perfil desde la App.
                                                </p>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 animate-bubble" style={{animationDelay: '0.4s'}}>
                                                <button onClick={() => { setStep(0); setUserData({ name: '', lastName: '', email: '', phone: '', role: '' }); }} className="flex flex-col items-center gap-3 p-6 bg-white border-2 border-slate-50 rounded-[2rem] hover:border-indigo-600 transition-all shadow-sm group">
                                                    <div className="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center group-hover:scale-110 transition-transform"><Icon name="user-plus" /></div>
                                                    <span className="text-[9px] font-black uppercase text-slate-500 text-center">Nuevo Usuario</span>
                                                </button>
                                                <button className="flex flex-col items-center gap-3 p-6 bg-white border-2 border-slate-50 rounded-[2rem] hover:border-[#0055DD] transition-all shadow-sm group">
                                                    <div className="w-12 h-12 bg-blue-50 text-[#0055DD] rounded-2xl flex items-center justify-center group-hover:scale-110 transition-transform"><Icon name="building-2" /></div>
                                                    <span className="text-[9px] font-black uppercase text-slate-500 text-center">Nueva Propiedad</span>
                                                </button>
                                                <button className="flex flex-col items-center gap-3 p-6 bg-white border-2 border-slate-50 rounded-[2rem] hover:border-emerald-600 transition-all shadow-sm group">
                                                    <div className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center group-hover:scale-110 transition-transform"><Icon name="file-text" /></div>
                                                    <span className="text-[9px] font-black uppercase text-slate-500 text-center">Nuevo Contrato</span>
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </React.Fragment>
                            )}

                            {isTyping && (
                                <div className="bot-bubble flex items-center gap-1.5 py-4 w-max">
                                    <div className="typing-dot"></div>
                                    <div className="typing-dot"></div>
                                    <div className="typing-dot"></div>
                                </div>
                            )}
                        </div>

                        {/* BARRA DE INPUT */}
                        {!isMassive && step < 4 && (
                            <footer className="p-10 border-t border-slate-50 bg-white/80 backdrop-blur-md sticky bottom-0 z-40">
                                <div className="flex gap-4 max-w-2xl mx-auto">
                                    <input 
                                        type={step === 2 ? "email" : "text"}
                                        placeholder={
                                            step === 0 ? "Escribe su Nombre..." :
                                            step === 1 ? "Su Apellido..." :
                                            step === 2 ? "Correo Electrónico..." :
                                            step === 3 ? "Teléfono o WhatsApp..." : "Escribe aquí..."
                                        }
                                        value={
                                            step === 0 ? userData.name :
                                            step === 1 ? userData.lastName :
                                            step === 2 ? userData.email :
                                            step === 3 ? userData.phone : ""
                                        }
                                        onChange={(e) => {
                                            const v = e.target.value;
                                            if(step === 0) setUserData({...userData, name: v});
                                            else if(step === 1) setUserData({...userData, lastName: v});
                                            else if(step === 2) setUserData({...userData, email: v});
                                            else if(step === 3) setUserData({...userData, phone: v});
                                        }}
                                        className="input-chat shadow-inner"
                                        onKeyDown={(e) => e.key === 'Enter' && handleNextStep()}
                                        autoFocus
                                    />
                                    <button 
                                        onClick={handleNextStep}
                                        className="bg-indigo-600 text-white w-16 h-16 rounded-[1.5rem] flex items-center justify-center shadow-xl shadow-indigo-100 hover:bg-indigo-700 active:scale-95 transition-all shrink-0"
                                    >
                                        <Icon name="send" />
                                    </button>
                                </div>
                            </footer>
                        )}

                        {isMassive && step < 6 && (
                             <footer className="p-10 border-t border-slate-50 bg-white flex justify-center">
                                <button onClick={() => setStep(6)} className="bg-indigo-600 text-white px-10 py-5 rounded-[2.5rem] font-black text-xs uppercase tracking-widest shadow-xl shadow-indigo-100 active:scale-95 transition-all">Iniciar Procesamiento Masivo</button>
                             </footer>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BlindatoAdminApp />);
    </script>
</body>
</html>
