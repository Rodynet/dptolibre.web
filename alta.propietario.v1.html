<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DptoLibre - Vinculación V1</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --brand-blue: #0055DD;
            --brand-dark: #0D1B4B;
            --brand-cyan: #00D1FF;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #cbd5e1;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        .mobile-shell {
            width: 100%;
            height: 100vh;
            max-width: 414px;
            margin: 0 auto;
            background: #F0F2F6;
            position: relative;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.2);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .passport-gradient {
            background: linear-gradient(135deg, #0D1B4B 0%, #0055DD 100%);
        }

        /* Animación Puerta Abriéndose */
        .door-container {
            perspective: 1000px;
            display: flex;
            gap: 2px;
        }
        .door-left {
            transform-origin: left;
            animation: openLeft 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            animation-delay: 0.8s;
        }
        .door-right {
            transform-origin: right;
            animation: openRight 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            animation-delay: 0.8s;
        }
        @keyframes openLeft {
            to { transform: rotateY(-110deg); opacity: 0; }
        }
        @keyframes openRight {
            to { transform: rotateY(110deg); opacity: 0; }
        }

        /* Animación Llave */
        .key-float {
            animation: floatKey 2s ease-in-out infinite;
        }
        @keyframes floatKey {
            0%, 100% { transform: translateY(0) rotate(-10deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        .share-pop {
            animation: sharePop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 2.2s;
            opacity: 0;
            transform: scale(0.8);
        }
        @keyframes sharePop { to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name, size, className]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const AnimatedLogo = () => (
            <div className="door-container relative w-32 h-40">
                <svg className="door-left w-1/2 h-full" viewBox="0 0 16 40" fill="none">
                    <path d="M16 6.4L0 0V33.6L16 40V6.4Z" fill="#00D1FF" />
                </svg>
                <svg className="door-right w-1/2 h-full" viewBox="16 0 16 40" fill="none">
                    <path d="M16 0L32 6.4V33.6L16 40V6.4V0Z" fill="#00D1FF" fillOpacity="0.4" />
                </svg>
            </div>
        );

        function DptoLibreApp() {
            // VIEWS: bridge, contract_linked, link_bank, move_in_payment, signature, achievement, home_active
            const [view, setView] = useState('bridge'); 
            const [isScanning, setIsScanning] = useState(false);

            const handleTransition = (nextView, delay = 1800) => {
                setIsScanning(true);
                setTimeout(() => {
                    setIsScanning(false);
                    setView(nextView);
                }, delay);
            };

            // --- 0. PUENTE DE SELECCIÓN (QUÉ QUIERES VINCULAR) ---
            const BridgeView = () => (
                <div className="mobile-shell bg-white flex flex-col p-10 justify-center animate-in">
                    <header className="mb-10 text-center">
                        <div className="w-16 h-16 bg-blue-50 text-[#0055DD] rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-inner">
                            <Icon name="link-2" size={32} />
                        </div>
                        <h2 className="text-3xl font-black text-[#0D1B4B] uppercase tracking-tighter leading-none">Vinculación</h2>
                        <p className="text-slate-400 text-sm mt-3 font-medium px-4 italic">¿Qué deseas cargar o vincular hoy?</p>
                    </header>

                    <div className="space-y-4">
                        <button onClick={() => handleTransition('contract_linked')} className="w-full p-6 border-2 border-indigo-100 rounded-[2.5rem] bg-indigo-50/30 flex items-center gap-5 hover:border-[#0055DD] transition-all group active:scale-95">
                            <div className="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-lg"><Icon name="file-text" /></div>
                            <div className="flex-1 text-left">
                                <h4 className="font-black text-[#0D1B4B] uppercase text-xs tracking-widest">Un Contrato</h4>
                                <p className="text-[10px] text-slate-500 font-medium">Vincular inquilino y dueño.</p>
                            </div>
                            <Icon name="chevron-right" className="text-slate-300" />
                        </button>

                        <button className="w-full p-6 border-2 border-slate-100 rounded-[2.5rem] bg-white flex items-center gap-5 hover:border-[#0055DD] transition-all group active:scale-95">
                            <div className="w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-400 group-hover:bg-[#0055DD] group-hover:text-white transition-all"><Icon name="building-2" /></div>
                            <div className="flex-1 text-left">
                                <h4 className="font-black text-slate-800 uppercase text-xs tracking-widest">Una Propiedad</h4>
                                <p className="text-[10px] text-slate-500 font-medium">Alta geolocalizada de activo.</p>
                            </div>
                            <Icon name="chevron-right" className="text-slate-200" />
                        </button>

                        <button className="w-full p-6 border-2 border-slate-100 rounded-[2.5rem] bg-white flex items-center gap-5 hover:border-[#0055DD] transition-all group active:scale-95">
                            <div className="w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-400 group-hover:bg-[#0055DD] group-hover:text-white transition-all"><Icon name="user" /></div>
                            <div className="flex-1 text-left">
                                <h4 className="font-black text-slate-800 uppercase text-xs tracking-widest">Un Inquilino</h4>
                                <p className="text-[10px] text-slate-500 font-medium">Validar pasaporte digital.</p>
                            </div>
                            <Icon name="chevron-right" className="text-slate-200" />
                        </button>
                    </div>
                </div>
            );

            // --- 1. CONTRATO DETECTADO ---
            const ContractLinkedView = () => (
                <div className="mobile-shell bg-white flex flex-col p-10 justify-center text-center animate-in">
                    <div className="relative mb-8">
                        <div className="w-24 h-24 bg-emerald-50 rounded-[2.5rem] flex items-center justify-center mx-auto text-emerald-600 shadow-inner">
                            <Icon name="file-search" size={48} />
                        </div>
                        <div className="absolute top-0 right-[35%] bg-emerald-500 text-white p-2 rounded-full border-4 border-white shadow-lg"><Icon name="check" size={16} strokeWidth={4}/></div>
                    </div>
                    <h2 className="text-2xl font-black text-[#0D1B4B] uppercase tracking-tighter leading-tight">¡Contrato Detectado!</h2>
                    <p className="text-slate-400 text-sm mt-4 leading-relaxed italic">
                        Vinculado a <strong>Inmobiliaria Raíces</strong>.
                    </p>
                    
                    <div className="bg-[#0D1B4B] rounded-[2rem] p-6 mt-10 text-white text-left shadow-2xl relative overflow-hidden">
                         <Icon name="building-2" size={100} className="absolute right-[-20px] bottom-[-20px] opacity-10" />
                         <p className="text-[10px] font-black uppercase text-indigo-400 mb-1">Activo</p>
                         <h4 className="text-lg font-bold mb-4 leading-none">Caseros 1230, 4B</h4>
                         <div className="grid grid-cols-2 gap-4">
                             <div><p className="text-[8px] font-bold opacity-50 uppercase tracking-widest">Alquiler</p><p className="text-sm font-black text-emerald-400">$450.000</p></div>
                             <div><p className="text-[8px] font-bold opacity-50 uppercase tracking-widest">Expensas</p><p className="text-sm font-black text-indigo-300">$65.000</p></div>
                         </div>
                    </div>

                    <button onClick={() => setView('link_bank')} className="mt-12 w-full bg-[#0055DD] text-white py-5 rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl active:scale-95 transition-all">
                        Configurar Pago
                    </button>
                </div>
            );

            // --- 2. VINCULACIÓN BANCARIA ---
            const LinkBankView = () => (
                <div className="mobile-shell bg-white flex flex-col p-10 animate-in">
                    <header className="mb-10 text-center pt-10">
                        <h2 className="text-2xl font-black text-[#0D1B4B] uppercase tracking-tighter leading-none">Cuenta de Pago</h2>
                        <p className="text-slate-400 text-sm mt-2 font-medium leading-relaxed italic">¿Desde dónde pagarás cada mes?</p>
                    </header>
                    <div className="space-y-6 flex-1">
                        <div className="space-y-2">
                             <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">CBU o Alias de tu cuenta</label>
                             <input type="text" placeholder="ej: marcos.galperin.banco" className="w-full bg-slate-50 border-2 border-slate-100 p-5 rounded-2xl text-sm font-bold focus:border-[#0055DD] outline-none transition-all shadow-inner" />
                        </div>
                        <div className="bg-emerald-50 p-6 rounded-3xl border border-emerald-100 flex gap-4">
                             <Icon name="shield-check" className="text-emerald-600 shrink-0" size={24} />
                             <p className="text-[10px] text-emerald-700 font-bold leading-relaxed"><strong>Seguridad Blindato:</strong> Validamos la titularidad de tu cuenta bancaria para transacciones 100% digitales y seguras.</p>
                        </div>
                    </div>
                    <button onClick={() => handleTransition('move_in_payment')} className="w-full bg-[#0D1B4B] text-white py-5 rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl active:scale-95 transition-all">Validar Cuenta</button>
                </div>
            );

            // --- 3. GASTOS DE INGRESO ---
            const MoveInPaymentView = () => (
                <div className="mobile-shell bg-slate-900 text-white flex flex-col p-10 animate-in overflow-y-auto no-scrollbar">
                    <header className="mb-8">
                        <h2 className="text-2xl font-black uppercase tracking-tighter leading-none">Gastos de Ingreso</h2>
                        <p className="text-indigo-400 text-[10px] font-black uppercase mt-1 tracking-widest">Liquidación de activación</p>
                    </header>
                    <div className="flex-1 space-y-4">
                        {[
                            { l: 'Mes de Adelanto', v: 450000 },
                            { l: 'Garantía de Caución DptoLibre', v: 45000 },
                            { l: 'Honorarios Inmobiliaria', v: 22500 },
                            { l: 'Sello Digital Infoexperto', v: 1200 }
                        ].map((item, i) => (
                            <div key={i} className="flex justify-between items-center py-4 border-b border-white/10">
                                <span className={`text-xs font-bold uppercase tracking-wider ${item.l.includes('Caución') ? 'text-[#00D1FF]' : 'text-white/50'}`}>{item.l}</span>
                                <span className="text-sm font-black">${item.v.toLocaleString()}</span>
                            </div>
                        ))}
                        <div className="pt-8 flex justify-between items-center text-emerald-400">
                             <span className="text-xs font-black uppercase tracking-widest">Total a Liquidar</span>
                             <span className="text-3xl font-black">$518.700</span>
                        </div>
                    </div>
                    <button onClick={() => setView('signature')} className="mt-8 w-full bg-[#00D1FF] text-[#0D1B4B] py-5 rounded-2xl font-black text-xs uppercase tracking-widest shadow-2xl active:scale-95 transition-all">Pagar e Ir a Firmar</button>
                </div>
            );

            // --- 4. FIRMA DIGITAL ---
            const SignatureView = () => (
                <div className="mobile-shell bg-white flex flex-col animate-in">
                    <header className="p-8 border-b border-slate-100 flex justify-between items-center">
                        <div>
                            <h2 className="text-xl font-black text-[#0D1B4B] uppercase tracking-tighter">Firma de Contrato</h2>
                            <p className="text-[8px] font-black text-slate-400 uppercase mt-1 tracking-widest">LEGAJO: BL-9921882</p>
                        </div>
                        <Icon name="lock" size={24} className="text-slate-200"/>
                    </header>
                    <main className="flex-1 overflow-y-auto p-8 space-y-6 bg-slate-50 no-scrollbar">
                        <div className="bg-white p-8 rounded-3xl shadow-sm text-[9px] text-slate-500 font-mono space-y-4 leading-relaxed border border-slate-100 text-justify">
                             <p className="font-black text-[#0D1B4B] text-center uppercase border-b pb-4 mb-4 text-[10px]">Contrato de Locación Digital</p>
                             <p>Entre las partes acuerdan el alquiler de la unidad funcional sita en Caseros 1230 bajo las siguientes condiciones...</p>
                             <div className="h-32 flex items-center justify-center border-2 border-dashed border-slate-200 rounded-2xl italic text-[10px] text-slate-300">Deslizá para leer el documento</div>
                             <p>Se firma digitalmente bajo leyes de arbitraje para blindaje absoluto.</p>
                        </div>
                    </main>
                    <footer className="p-8 bg-white border-t border-slate-100">
                         <button onClick={() => setView('achievement')} className="w-full bg-[#0D1B4B] text-white py-5 rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl flex items-center justify-center gap-3 active:scale-95 transition-all">
                            <Icon name="pen-tool" size={16} /> FIRMAR CON INFOEXPERTO-ID
                         </button>
                    </footer>
                </div>
            );

            // --- 5. LOGRO (ANIMACIÓN LLAVE Y COMPARTIR) ---
            const AchievementView = () => {
                return (
                    <div className="mobile-shell passport-gradient flex flex-col items-center justify-center p-8 text-center text-white overflow-hidden">
                        <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white/10 to-transparent opacity-30"></div>
                        
                        <div className="key-float mb-6 relative z-20">
                            <div className="w-20 h-20 bg-amber-400 rounded-full flex items-center justify-center shadow-[0_0_50px_rgba(251,191,36,0.5)]">
                                <Icon name="key" size={40} className="text-[#0D1B4B]" strokeWidth={2.5} />
                            </div>
                        </div>

                        <div className="relative mb-8 z-20 flex flex-col items-center">
                            <AnimatedLogo />
                            <div className="mt-6">
                                <h1 className="text-3xl font-black tracking-tighter uppercase leading-none mb-2 italic">¡Hogar Conseguido!</h1>
                                <p className="text-[#00D1FF] font-black uppercase text-[10px] tracking-[0.2em]">Activado en DptoLibre</p>
                            </div>
                        </div>

                        <div className="share-pop w-full space-y-6 z-30">
                            <div className="bg-white/10 backdrop-blur-xl border border-white/20 p-6 rounded-[2rem] shadow-2xl">
                                <p className="text-xs font-bold mb-6 opacity-90 italic">¡Avisale a todos que ya alquilaste!</p>
                                <div className="flex justify-center gap-6">
                                    <button className="flex flex-col items-center gap-2 group">
                                        <div className="w-12 h-12 bg-gradient-to-tr from-purple-500 to-pink-500 rounded-xl flex items-center justify-center shadow-lg group-active:scale-90 transition-transform"><Icon name="instagram" size={24} /></div>
                                        <span className="text-[8px] font-black uppercase">Story</span>
                                    </button>
                                    <button className="flex flex-col items-center gap-2 group">
                                        <div className="w-12 h-12 bg-[#25D366] rounded-xl flex items-center justify-center shadow-lg group-active:scale-90 transition-transform"><Icon name="message-circle" size={24} /></div>
                                        <span className="text-[8px] font-black uppercase">WhatsApp</span>
                                    </button>
                                </div>
                            </div>
                            <button onClick={() => setView('home_active')} className="w-full text-white/40 font-black text-[10px] uppercase tracking-[0.2em] py-2 flex items-center justify-center gap-2">IR AL INICIO <Icon name="arrow-right" size={12} /></button>
                        </div>
                    </div>
                );
            };

            // --- 6. HOME ACTIVA FINAL ---
            const HomeActiveView = () => (
                <div className="mobile-shell bg-[#F0F2F6] flex flex-col animate-in overflow-y-auto no-scrollbar pb-32">
                    <header className="p-8 bg-white border-b flex justify-between items-center sticky top-0 z-20 shadow-sm">
                        <Logo />
                        <div className="w-10 h-10 rounded-full border-2 border-emerald-500 overflow-hidden bg-slate-100 shadow-sm"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Marcos" /></div>
                    </header>
                    <main className="p-6 space-y-6">
                        <div className="passport-gradient p-8 rounded-[2.5rem] text-white shadow-2xl relative overflow-hidden flex flex-col gap-10">
                            <Icon name="shield-check" size={150} className="absolute right-[-40px] top-[-40px] opacity-10" />
                            <div className="flex justify-between items-start z-10">
                                <span className="bg-emerald-500 text-[#0D1B4B] px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest">Alquiler Blindado</span>
                                <button className="bg-white/10 p-2 rounded-xl backdrop-blur-md border border-white/10"><Icon name="share-2" size={18}/></button>
                            </div>
                            <div className="z-10">
                                <h3 className="text-3xl font-black tracking-tighter leading-none mb-1">Caseros 1230, 4B</h3>
                                <p className="text-xs text-[#00D1FF] font-bold uppercase">Vencimiento: 05 de Mayo</p>
                            </div>
                            <div className="mt-4 flex items-center justify-between border-t border-white/10 pt-6 z-10">
                                <div><p className="text-[8px] font-bold opacity-50 uppercase tracking-widest">Rendimiento mensual</p><p className="text-xl font-black text-white">+$1.240 <span className="text-[10px] text-[#00D1FF] font-bold uppercase tracking-tighter">FCI</span></p></div>
                                <button className="bg-white text-slate-900 px-6 py-3 rounded-xl font-black text-[10px] uppercase shadow-lg active:scale-95">Gestionar</button>
                            </div>
                        </div>
                    </main>

                    <nav className="absolute bottom-0 w-full bg-white/90 backdrop-blur-md border-t p-6 pb-10 flex justify-around items-center z-[50]">
                        <Icon name="home" className="text-[#0055DD]" strokeWidth={3}/>
                        <Icon name="search" className="text-slate-300" />
                        <Icon name="wallet" className="text-slate-300" />
                        <Icon name="user" className="text-slate-300" />
                    </nav>
                </div>
            );

            return (
                <div className="h-screen w-full flex flex-col items-center justify-center p-4">
                    <div className="mobile-shell">
                        <div className="absolute top-0 left-1/2 -translate-x-1/2 w-40 h-7 bg-[#0D1B4B] rounded-b-3xl z-[150] flex items-center justify-center gap-2 shadow-lg">
                            <div className="w-1.5 h-1.5 rounded-full bg-white/20"></div>
                            <div className="w-10 h-1 bg-white/20 rounded-full"></div>
                        </div>

                        {view === 'bridge' && <BridgeView />}
                        {view === 'contract_linked' && <ContractLinkedView />}
                        {view === 'link_bank' && <LinkBankView />}
                        {view === 'move_in_payment' && <MoveInPaymentView />}
                        {view === 'signature' && <SignatureView />}
                        {view === 'achievement' && <AchievementView />}
                        {view === 'home_active' && <HomeActiveView />}

                        {isScanning && (
                            <div className="absolute inset-0 bg-white/90 backdrop-blur-md z-[200] flex flex-col items-center justify-center animate-in">
                                <div className="w-16 h-16 border-4 border-[#0055DD] border-t-transparent rounded-full animate-spin mb-4 shadow-[0_0_15px_rgba(0,85,221,0.2)]"></div>
                                <p className="text-xs font-black text-[#0055DD] uppercase tracking-widest animate-pulse">Sincronizando...</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DptoLibreApp />);
    </script>
</body>
</html>
