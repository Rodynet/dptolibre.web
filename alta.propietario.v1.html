<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blindato Admin - Alta de Propietario V1</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --brand-blue: #0055DD;
            --brand-dark: #0A142F;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
            color: #1e293b;
        }

        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .btn-method-select {
            @apply flex flex-col items-center justify-center p-12 border-2 border-slate-100 rounded-[3rem] bg-white transition-all cursor-pointer;
        }
        .btn-method-select:hover {
            @apply border-[#0055DD] shadow-2xl shadow-blue-100 -translate-y-1;
        }
        .btn-method-select.active {
            @apply border-[#0055DD] bg-blue-50 ring-2 ring-[#0055DD];
        }

        .input-pill {
            @apply w-full bg-slate-50 border-2 border-transparent px-6 py-4 rounded-2xl text-sm font-bold focus:ring-0 focus:border-[#0055DD] focus:bg-white outline-none transition-all;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Estilo para simular barra lateral de Admin */
        .sidebar {
            background-color: #0A142F;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { window.lucide && window.lucide.createIcons(); }, [name, size, className]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        function OwnerOnboardingWeb() {
            // ESTADOS: welcome, method_select, individual_form, bulk_upload, success
            const [step, setStep] = useState('welcome');
            const [isScanning, setIsScanning] = useState(false);

            const handleFinish = () => {
                setIsScanning(true);
                setTimeout(() => {
                    setIsScanning(false);
                    setStep('success');
                }, 1500);
            };

            // --- BARRA LATERAL (CONSOLA) ---
            const Sidebar = () => (
                <aside className="w-24 sidebar text-white flex flex-col items-center py-8 gap-10 border-r border-slate-800 h-screen fixed left-0 top-0">
                    <div className="w-12 h-12 bg-indigo-500 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-lg">B</div>
                    <nav className="flex flex-col gap-6 text-slate-500">
                        <div className="p-3 hover:text-indigo-400 cursor-pointer transition-colors"><Icon name="layout-grid" size={24} /></div>
                        <div className="p-3 bg-indigo-500/10 text-indigo-400 rounded-xl"><Icon name="users" size={24} /></div>
                        <div className="p-3 hover:text-indigo-400 cursor-pointer transition-colors"><Icon name="building" size={24} /></div>
                        <div className="p-3 hover:text-indigo-400 cursor-pointer transition-colors"><Icon name="wallet" size={24} /></div>
                    </nav>
                </aside>
            );

            // --- VISTA 1: BIENVENIDA ---
            const WelcomeView = () => (
                <div className="flex-1 flex items-center justify-center p-12 animate-in text-center ml-24">
                    <div className="max-w-2xl w-full bg-white p-16 rounded-[4rem] shadow-xl border border-slate-50">
                        <div className="w-24 h-24 bg-blue-50 rounded-[2.5rem] flex items-center justify-center mx-auto mb-8 text-[#0055DD] shadow-inner">
                            <Icon name="user-plus" size={48} />
                        </div>
                        <h1 className="text-4xl font-black text-slate-900 tracking-tight leading-none mb-4 italic">Gestión de Dueños</h1>
                        <p className="text-slate-400 font-medium mb-12 px-10 leading-relaxed text-lg italic">
                            Registra un nuevo propietario o importa tu cartera completa para activar sus liquidaciones automáticas.
                        </p>
                        <button onClick={() => setStep('method_select')} className="bg-[#0055DD] text-white px-12 py-5 rounded-[2rem] font-black text-xs uppercase tracking-[0.2em] shadow-2xl shadow-blue-200 active:scale-95 transition-all">
                            Nueva Alta de Dueño
                        </button>
                    </div>
                </div>
            );

            // --- VISTA 2: SELECCIÓN DE MÉTODO ---
            const MethodSelectView = () => (
                <div className="flex-1 flex items-center justify-center p-12 animate-in ml-24">
                    <div className="max-w-5xl w-full">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl font-black text-slate-900 tracking-tighter uppercase italic">Selecciona el método de carga</h2>
                            <p className="text-slate-400 font-medium mt-3">Elección con carga mínima de datos.</p>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-10 max-w-4xl mx-auto">
                            <div onClick={() => setStep('individual_form')} className="btn-method-select group">
                                <div className="w-24 h-24 bg-blue-50 rounded-[2rem] flex items-center justify-center mb-8 text-[#0055DD] shadow-sm group-hover:scale-110 transition-transform"><Icon name="user" size={48} /></div>
                                <span className="text-sm font-black uppercase tracking-widest text-slate-800">Alta Individual</span>
                                <p className="text-[11px] mt-2 uppercase font-bold opacity-40">Similar a un contacto</p>
                            </div>
                            <div onClick={() => setStep('bulk_upload')} className="btn-method-select group">
                                <div className="w-24 h-24 bg-slate-50 rounded-[2rem] flex items-center justify-center mb-8 text-slate-400 shadow-sm group-hover:scale-110 transition-transform"><Icon name="layers" size={48} /></div>
                                <span className="text-sm font-black uppercase tracking-widest text-slate-800">Alta Masiva</span>
                                <p className="text-[11px] mt-2 uppercase font-bold opacity-40">Importar CRM / Excel</p>
                            </div>
                        </div>
                        <div className="mt-16 text-center">
                            <button onClick={() => setStep('welcome')} className="text-slate-400 font-black text-[10px] uppercase tracking-widest flex items-center justify-center gap-2 mx-auto hover:text-slate-900 transition-colors">
                                <Icon name="arrow-left" size={14} /> Volver
                            </button>
                        </div>
                    </div>
                </div>
            );

            // --- VISTA 3: FORMULARIO INDIVIDUAL (6 CAMPOS OBLIGATORIOS) ---
            const IndividualFormView = () => (
                <div className="flex-1 flex items-center justify-center p-12 animate-in ml-24">
                    <div className="max-w-4xl w-full bg-white rounded-[4rem] shadow-2xl border border-slate-100 overflow-hidden">
                        <div className="p-16">
                            <header className="text-center mb-12">
                                <h3 className="text-3xl font-black text-slate-800 tracking-tighter uppercase italic">Ficha del Propietario</h3>
                                <p className="text-slate-400 text-sm mt-3 font-medium italic">Todos los campos son requeridos para la validación fiscal.</p>
                            </header>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-8 mb-16">
                                {/* Columna 1 */}
                                <div className="space-y-8">
                                    <div className="space-y-3">
                                        <label className="text-[10px] font-black uppercase text-slate-400 ml-2 tracking-widest">Nombre</label>
                                        <input type="text" placeholder="ej: Roberto Carlos" className="input-pill" />
                                    </div>
                                    <div className="space-y-3">
                                        <label className="text-[10px] font-black uppercase text-slate-400 ml-2 tracking-widest">DNI / Pasaporte</label>
                                        <input type="number" placeholder="Sin puntos ni espacios" className="input-pill" />
                                    </div>
                                    <div className="space-y-3">
                                        <label className="text-[10px] font-black uppercase text-slate-400 ml-2 tracking-widest">Correo Electrónico</label>
                                        <input type="email" placeholder="ej: roberto@empresa.com" className="input-pill" />
                                    </div>
                                </div>
                                {/* Columna 2 */}
                                <div className="space-y-8">
                                    <div className="space-y-3">
                                        <label className="text-[10px] font-black uppercase text-slate-400 ml-2 tracking-widest">Apellido</label>
                                        <input type="text" placeholder="ej: Gomez" className="input-pill" />
                                    </div>
                                    <div className="space-y-3">
                                        <label className="text-[10px] font-black uppercase text-slate-400 ml-2 tracking-widest">CUIT / CUIL</label>
                                        <div className="relative">
                                            <input type="text" placeholder="20-xxxxxxxx-9" className="input-pill pr-24" />
                                            <button className="absolute right-4 top-4 text-indigo-600 font-black text-[9px] uppercase border-2 border-indigo-50 px-3 py-1 rounded-xl bg-white hover:bg-indigo-50 transition-colors">Validar</button>
                                        </div>
                                    </div>
                                    <div className="space-y-3">
                                        <label className="text-[10px] font-black uppercase text-slate-400 ml-2 tracking-widest">Celular (WhatsApp)</label>
                                        <div className="relative">
                                            <input type="tel" placeholder="+54 9 351 000-0000" className="input-pill" />
                                            <div className="absolute right-5 top-5 text-emerald-500"><Icon name="message-circle" size={18} /></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="flex flex-col gap-6 items-center">
                                <button onClick={handleFinish} className="w-full max-w-md bg-[#0D1B4B] text-white py-5 rounded-[2.5rem] font-black text-xs uppercase tracking-[0.3em] shadow-2xl active:scale-95 transition-all">
                                    Finalizar y Dar de Alta
                                </button>
                                <button onClick={() => setStep('method_select')} className="text-slate-300 font-black text-[10px] uppercase tracking-widest border-b border-transparent hover:border-slate-300">Cambiar a Carga Masiva</button>
                            </div>
                        </div>
                    </div>
                </div>
            );

            // --- VISTA 4: CARGA MASIVA ---
            const BulkUploadView = () => (
                <div className="flex-1 flex items-center justify-center p-12 animate-in ml-24">
                    <div className="max-w-3xl w-full bg-white rounded-[4rem] shadow-2xl p-16 text-center border border-slate-100">
                        <header className="mb-12">
                            <h3 className="text-3xl font-black text-slate-900 tracking-tighter uppercase italic">Importación de Cartera</h3>
                            <p className="text-slate-400 text-sm mt-3 font-medium">Procesa cientos de propietarios desde un solo archivo.</p>
                        </header>
                        
                        <label className="border-4 border-dashed border-slate-100 rounded-[3rem] p-20 flex flex-col items-center justify-center cursor-pointer hover:border-[#0055DD] hover:bg-blue-50 transition-all group mb-10">
                            <input type="file" className="hidden" />
                            <Icon name="upload-cloud" size={72} className="text-slate-200 group-hover:text-[#0055DD] mb-8 transition-all group-hover:scale-110" />
                            <span className="text-sm font-black uppercase text-slate-400 tracking-widest group-hover:text-slate-800">Arrastra tu archivo .CSV o .XLSX aquí</span>
                        </label>

                        <div className="bg-indigo-50/50 p-6 rounded-3xl border border-indigo-100 mb-12 flex items-center gap-4 text-left">
                            <Icon name="info" className="text-indigo-600 shrink-0" size={24} />
                            <p className="text-xs text-indigo-700 font-bold leading-relaxed">
                                El sistema vinculará automáticamente los CUITs con Infoexperto. Descarga la <span className="underline cursor-pointer">plantilla estándar de Blindato</span> para asegurar el 100% de éxito.
                            </p>
                        </div>

                        <div className="flex flex-col gap-6 items-center">
                            <button onClick={handleFinish} className="w-full max-w-sm bg-[#0055DD] text-white py-5 rounded-3xl font-black text-xs uppercase tracking-widest shadow-xl shadow-blue-100 active:scale-95 transition-all">
                                Procesar Cartera
                            </button>
                            <button onClick={() => setStep('method_select')} className="text-slate-300 font-black text-[10px] uppercase tracking-widest">Volver</button>
                        </div>
                    </div>
                </div>
            );

            // --- VISTA 5: ÉXITO ---
            const SuccessView = () => (
                <div className="flex-1 flex items-center justify-center p-12 animate-in ml-24">
                    <div className="max-w-xl w-full bg-slate-900 rounded-[4rem] p-16 text-center text-white shadow-2xl relative overflow-hidden">
                        <Icon name="shield-check" size={200} className="absolute right-[-40px] bottom-[-40px] opacity-5 text-indigo-500" />
                        <div className="w-24 h-24 bg-emerald-500 rounded-[2.5rem] flex items-center justify-center mx-auto mb-8 shadow-2xl animate-pop">
                            <Icon name="check" size={48} strokeWidth={4} className="text-slate-900" />
                        </div>
                        <h2 className="text-4xl font-black tracking-tighter uppercase mb-4 italic">Alta Exitosa</h2>
                        <p className="text-slate-400 font-medium mb-12 leading-relaxed">
                            El propietario ha sido registrado y validado fiscalmente. Ya puedes vincular sus activos inmobiliarios.
                        </p>
                        <div className="flex flex-col gap-4">
                            <button className="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl shadow-indigo-500/20 active:scale-95 transition-all">
                                Vincular Primera Propiedad
                            </button>
                            <button onClick={() => setStep('welcome')} className="w-full bg-white/10 text-white py-4 rounded-2xl font-black text-[10px] uppercase tracking-[0.2em] border border-white/20 hover:bg-white/20 transition-all">
                                Volver al Panel
                            </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="flex min-h-screen w-full relative overflow-hidden">
                    <Sidebar />
                    
                    {step === 'welcome' && <WelcomeView />}
                    {step === 'method_select' && <MethodSelectView />}
                    {step === 'individual_form' && <IndividualFormView />}
                    {step === 'bulk_upload' && <BulkUploadView />}
                    {step === 'success' && <SuccessView />}

                    {/* OVERLAY DE PROCESAMIENTO */}
                    {isScanning && (
                        <div className="fixed inset-0 bg-white/90 backdrop-blur-md z-[500] flex flex-col items-center justify-center animate-in">
                            <div className="w-16 h-16 border-4 border-[#0055DD] border-t-transparent rounded-full animate-spin mb-6"></div>
                            <p className="text-xs font-black text-[#0055DD] uppercase tracking-[0.4em] animate-pulse italic">Auditoría Fiscal en curso...</p>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OwnerOnboardingWeb />);
    </script>
</body>
</html>
