<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blindato Admin - Alta de Propietario V1</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --brand-blue: #0055DD;
            --brand-dark: #0A142F;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
            color: #1e293b;
        }

        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .btn-method-select {
            @apply flex flex-col items-center justify-center p-10 border-2 border-slate-100 rounded-[2.5rem] bg-white transition-all cursor-pointer;
        }
        .btn-method-select:hover {
            @apply border-[#0055DD] shadow-2xl shadow-blue-100 -translate-y-1;
        }
        .btn-method-select.active {
            @apply border-[#0055DD] bg-blue-50 ring-2 ring-[#0055DD];
        }

        .input-pill {
            @apply w-full bg-slate-50 border-2 border-transparent px-6 py-4 rounded-2xl text-sm font-bold focus:ring-0 focus:border-[#0055DD] focus:bg-white outline-none transition-all;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { window.lucide && window.lucide.createIcons(); }, [name, size, className]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        function OwnerOnboarding() {
            // ESTADOS: welcome, method_select, individual_form, bulk_upload, success
            const [step, setStep] = useState('welcome');
            const [isScanning, setIsScanning] = useState(false);

            const handleFinish = () => {
                setIsScanning(true);
                setTimeout(() => {
                    setIsScanning(false);
                    setStep('success');
                }, 1500);
            };

            // --- VISTA 1: BIENVENIDA ---
            const WelcomeView = () => (
                <div className="min-h-screen flex items-center justify-center p-6 animate-in text-center">
                    <div className="max-w-xl w-full">
                        <div className="w-24 h-24 bg-blue-50 rounded-[2.5rem] flex items-center justify-center mx-auto mb-8 text-[#0055DD] shadow-inner">
                            <Icon name="user-plus" size={48} />
                        </div>
                        <h1 className="text-4xl font-black text-slate-900 tracking-tight leading-none mb-4 italic">Vincular Propietario</h1>
                        <p className="text-slate-400 font-medium mb-12 px-10 leading-relaxed text-lg italic">
                            Registra al dueño de tus activos para automatizar sus cobros y liquidaciones mensuales.
                        </p>
                        <button onClick={() => setStep('method_select')} className="bg-[#0055DD] text-white px-12 py-5 rounded-[2rem] font-black text-xs uppercase tracking-[0.2em] shadow-2xl shadow-blue-200 active:scale-95 transition-all">
                            Comenzar Alta
                        </button>
                    </div>
                </div>
            );

            // --- VISTA 2: SELECCIÓN DE MÉTODO ---
            const MethodSelectView = () => (
                <div className="min-h-screen flex items-center justify-center p-6 animate-in">
                    <div className="max-w-4xl w-full">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl font-black text-slate-900 tracking-tighter">¿Cómo prefieres cargar los datos?</h2>
                            <p className="text-slate-400 font-medium mt-3">Selecciona el método más ágil para tu gestión.</p>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-10 max-w-3xl mx-auto">
                            <div onClick={() => setStep('individual_form')} className="btn-method-select">
                                <div className="w-20 h-20 bg-blue-50 rounded-3xl flex items-center justify-center mb-6 text-[#0055DD] shadow-sm"><Icon name="user" size={40} /></div>
                                <span className="text-sm font-black uppercase tracking-widest text-slate-800">Carga Individual</span>
                                <p className="text-[10px] mt-2 uppercase font-bold opacity-40">Nuevo Contacto</p>
                            </div>
                            <div onClick={() => setStep('bulk_upload')} className="btn-method-select">
                                <div className="w-20 h-20 bg-slate-50 rounded-3xl flex items-center justify-center mb-6 text-slate-400 shadow-sm"><Icon name="layers" size={40} /></div>
                                <span className="text-sm font-black uppercase tracking-widest text-slate-800">Carga Masiva</span>
                                <p className="text-[10px] mt-2 uppercase font-bold opacity-40">Importar Cartera</p>
                            </div>
                        </div>
                        <div className="mt-16 text-center">
                            <button onClick={() => setStep('welcome')} className="text-slate-400 font-black text-[10px] uppercase tracking-widest flex items-center justify-center gap-2 mx-auto hover:text-slate-900 transition-colors">
                                <Icon name="arrow-left" size={14} /> Volver
                            </button>
                        </div>
                    </div>
                </div>
            );

            // --- VISTA 3: FORMULARIO INDIVIDUAL ---
            const IndividualFormView = () => (
                <div className="min-h-screen flex items-center justify-center p-6 animate-in">
                    <div className="max-w-4xl w-full bg-white rounded-[3rem] shadow-2xl border border-slate-100 overflow-hidden">
                        <div className="p-16">
                            <header className="text-center mb-12">
                                <h3 className="text-3xl font-black text-slate-900 tracking-tighter italic">Datos del Propietario</h3>
                                <p className="text-slate-400 text-sm mt-3 font-medium italic">Información obligatoria para el blindaje legal.</p>
                            </header>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
                                <div className="space-y-6">
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase text-slate-300 ml-2 tracking-widest">Nombre</label>
                                        <input type="text" placeholder="ej: Roberto" className="input-pill" />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase text-slate-300 ml-2 tracking-widest">DNI</label>
                                        <input type="number" placeholder="Sin puntos" className="input-pill" />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase text-slate-300 ml-2 tracking-widest">Correo Electrónico</label>
                                        <input type="email" placeholder="ej: r.daer@gmail.com" className="input-pill" />
                                    </div>
                                </div>
                                <div className="space-y-6">
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase text-slate-300 ml-2 tracking-widest">Apellido</label>
                                        <input type="text" placeholder="ej: Daer" className="input-pill" />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase text-slate-300 ml-2 tracking-widest">CUIT / CUIL</label>
                                        <div className="relative">
                                            <input type="text" placeholder="20-xxxxxxxx-9" className="input-pill pr-16" />
                                            <button className="absolute right-4 top-4 text-indigo-600 font-black text-[9px] uppercase border border-indigo-100 px-2 py-1 rounded-lg bg-white">Validar</button>
                                        </div>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase text-slate-300 ml-2 tracking-widest">Celular (WhatsApp)</label>
                                        <input type="tel" placeholder="+54 9 351..." className="input-pill" />
                                    </div>
                                </div>
                            </div>

                            <div className="flex flex-col gap-6 items-center">
                                <button onClick={handleFinish} className="w-full max-w-sm bg-[#0055DD] text-white py-5 rounded-[2rem] font-black text-xs uppercase tracking-[0.2em] shadow-xl shadow-blue-100 active:scale-95 transition-all">
                                    Finalizar y Vincular
                                </button>
                                <button onClick={() => setStep('method_select')} className="text-slate-300 font-black text-[10px] uppercase tracking-widest">Cambiar método</button>
                            </div>
                        </div>
                    </div>
                </div>
            );

            // --- VISTA 4: CARGA MASIVA ---
            const BulkUploadView = () => (
                <div className="min-h-screen flex items-center justify-center p-6 animate-in">
                    <div className="max-w-2xl w-full bg-white rounded-[3rem] shadow-2xl p-16 text-center border border-slate-100">
                        <header className="mb-12">
                            <h3 className="text-3xl font-black text-slate-900 tracking-tighter italic">Importar Cartera</h3>
                            <p className="text-slate-400 text-sm mt-3 font-medium">Sube tu base de datos para procesar múltiples altas.</p>
                        </header>
                        
                        <label className="border-2 border-dashed border-slate-100 rounded-[3rem] p-16 flex flex-col items-center justify-center cursor-pointer hover:border-[#0055DD] hover:bg-blue-50 transition-all group mb-10">
                            <input type="file" className="hidden" />
                            <Icon name="upload-cloud" size={56} className="text-slate-200 group-hover:text-[#0055DD] mb-6 transition-colors" />
                            <span className="text-xs font-black uppercase text-slate-400 tracking-widest group-hover:text-slate-800">Suelta tu archivo .csv o .xlsx aquí</span>
                        </label>

                        <div className="bg-amber-50 p-6 rounded-3xl border border-amber-100 mb-12">
                            <p className="text-[10px] text-amber-700 font-bold leading-relaxed italic">
                                Asegúrate de descargar nuestra <span className="underline cursor-pointer">plantilla estándar</span> para evitar errores de vinculación impositiva.
                            </p>
                        </div>

                        <div className="flex flex-col gap-6 items-center">
                            <button onClick={handleFinish} className="w-full bg-[#0D1B4B] text-white py-5 rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl active:scale-95 transition-all">
                                Procesar Archivo
                            </button>
                            <button onClick={() => setStep('method_select')} className="text-slate-300 font-black text-[10px] uppercase tracking-widest">Volver</button>
                        </div>
                    </div>
                </div>
            );

            // --- VISTA 5: ÉXITO ---
            const SuccessView = () => (
                <div className="min-h-screen flex items-center justify-center p-6 animate-in bg-slate-900 text-white flex-col gap-10">
                    <div className="w-32 h-32 bg-emerald-500 rounded-[3rem] flex items-center justify-center shadow-[0_0_50px_rgba(16,185,129,0.3)] animate-pulse">
                        <Icon name="check" size={64} strokeWidth={4} />
                    </div>
                    <div className="text-center">
                        <h2 className="text-4xl font-black tracking-tighter uppercase mb-4 italic">Dueño Vinculado</h2>
                        <p className="text-slate-400 font-medium max-w-sm mx-auto italic">El perfil ha sido procesado por la Secretaría Digital. Ahora puedes asignarle propiedades y contratos.</p>
                    </div>
                    <div className="flex flex-col gap-4 w-full max-w-xs">
                        <button className="bg-indigo-600 text-white py-4 rounded-xl font-black text-[10px] uppercase tracking-[0.2em] shadow-xl">Ver Ficha del Dueño</button>
                        <button onClick={() => setStep('welcome')} className="bg-white/10 text-white py-4 rounded-xl font-black text-[10px] uppercase tracking-[0.3em] border border-white/10">Ir al Inicio</button>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen w-full relative overflow-hidden">
                    {step === 'welcome' && <WelcomeView />}
                    {step === 'method_select' && <MethodSelectView />}
                    {step === 'individual_form' && <IndividualFormView />}
                    {step === 'bulk_upload' && <BulkUploadView />}
                    {step === 'success' && <SuccessView />}

                    {isScanning && (
                        <div className="fixed inset-0 bg-white/90 backdrop-blur-md z-[500] flex flex-col items-center justify-center animate-in">
                            <div className="w-16 h-16 border-4 border-[#0055DD] border-t-transparent rounded-full animate-spin mb-4"></div>
                            <p className="text-xs font-black text-[#0055DD] uppercase tracking-widest animate-pulse italic">Auditando identidad fiscal...</p>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OwnerOnboarding />);
    </script>
</body>
</html>
