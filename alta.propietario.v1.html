<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blindato Admin - Alta Usuario Conversacional V2</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --brand-blue: #0055DD;
            --brand-dark: #0A142F;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
            color: #1e293b;
        }

        .animate-chat { animation: chatIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes chatIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .bot-bubble {
            @apply bg-white border border-slate-100 p-5 rounded-tr-[2rem] rounded-br-[2rem] rounded-bl-[2rem] shadow-sm max-w-[85%] text-sm font-medium leading-relaxed;
        }

        .user-bubble {
            @apply bg-[#0055DD] text-white p-5 rounded-tl-[2rem] rounded-bl-[2rem] rounded-br-[2rem] shadow-lg max-w-[80%] text-sm font-bold ml-auto;
        }

        .input-chat {
            @apply w-full bg-white border-2 border-slate-100 px-6 py-4 rounded-2xl text-base font-bold focus:ring-4 focus:ring-blue-50 focus:border-[#0055DD] outline-none transition-all;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .sidebar { background-color: #0A142F; }

        .typing-dot {
            width: 4px; height: 4px; background: #94a3b8; border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

        .btn-role {
            @apply p-4 bg-white border-2 border-slate-50 rounded-2xl text-left font-bold text-slate-700 flex items-center gap-3 hover:border-[#0055DD] hover:bg-blue-50 transition-all active:scale-95;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { window.lucide && window.lucide.createIcons(); }, [name, size, className]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        function App() {
            // Pasos: 0:Bienvenida, 1:Nombre, 2:Apellido, 3:Email, 4:Telefono, 5:Rol, 6:Resumen, 7:Exito
            const [step, setStep] = useState(0);
            const [isMassive, setIsMassive] = useState(false);
            const [userData, setUserData] = useState({ name: '', lastName: '', email: '', phone: '', role: '' });
            const [isTyping, setIsTyping] = useState(false);
            const scrollRef = useRef(null);

            const handleNext = () => {
                if (step === 0 && !userData.name) return;
                if (step === 1 && !userData.lastName) return;
                if (step === 2 && !userData.email) return;
                if (step === 3 && !userData.phone) return;

                setIsTyping(true);
                setTimeout(() => {
                    setIsTyping(false);
                    setStep(s => s + 1);
                }, 800);
            };

            const resetProcess = () => {
                setUserData({ name: '', lastName: '', email: '', phone: '', role: '' });
                setStep(0);
            };

            useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [step, isTyping]);

            // --- BARRA LATERAL ---
            const Sidebar = () => (
                <aside className="w-24 sidebar text-white flex flex-col items-center py-8 gap-10 border-r border-slate-800 h-screen fixed left-0 top-0 z-50">
                    <div className="w-12 h-12 bg-indigo-500 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-lg">B</div>
                    <nav className="flex flex-col gap-8 text-slate-500">
                        <div className="p-3 hover:text-white cursor-pointer transition-colors"><Icon name="layout-grid" size={24} /></div>
                        <div className="p-3 bg-indigo-500/10 text-indigo-400 rounded-xl"><Icon name="user-plus" size={24} /></div>
                        <div className="p-3 hover:text-white cursor-pointer transition-colors"><Icon name="building" size={24} /></div>
                        <div className="p-3 hover:text-white cursor-pointer transition-colors"><Icon name="file-text" size={24} /></div>
                        <div className="p-3 hover:text-white cursor-pointer transition-colors"><Icon name="wallet" size={24} /></div>
                    </nav>
                </aside>
            );

            return (
                <div className="flex min-h-screen w-full relative overflow-hidden bg-[#F8FAFC]">
                    <Sidebar />
                    
                    <main className="flex-1 flex flex-col ml-24 h-screen max-w-4xl mx-auto relative border-x border-slate-100 bg-white shadow-sm">
                        
                        {/* HEADER CONSOLA */}
                        <header className="p-6 border-b border-slate-50 flex justify-between items-center bg-white sticky top-0 z-40">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-[#0055DD] shadow-inner">
                                    <Icon name="sparkles" size={20} />
                                </div>
                                <div>
                                    <h2 className="text-sm font-black uppercase tracking-widest text-slate-800 leading-none">Secretaría Digital</h2>
                                    <p className="text-[10px] text-emerald-500 font-bold uppercase mt-1">AI Assistant • Alta de Usuario</p>
                                </div>
                            </div>
                            <button 
                                onClick={() => { setIsMassive(!isMassive); setStep(0); }}
                                className="bg-slate-50 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-400 border border-slate-100 hover:text-indigo-600 transition-all"
                            >
                                {isMassive ? "Vía Chat" : "Carga Masiva"}
                            </button>
                        </header>

                        {/* AREA DE CHAT (SCROLLABLE) */}
                        <div ref={scrollRef} className="flex-1 overflow-y-auto p-8 space-y-8 no-scrollbar pb-48">
                            
                            {/* BIENVENIDA */}
                            <div className="bot-bubble animate-chat">
                                <p>¡Hola! Vamos a dar de alta a una persona en Blindato. Solo necesito sus datos básicos para enviarle la invitación.</p>
                                <p className="mt-2 text-indigo-500 font-bold italic text-xs uppercase tracking-tighter">¿Cuál es su nombre?</p>
                            </div>

                            {isMassive && (
                                <div className="bot-bubble animate-chat bg-indigo-50 border-indigo-100">
                                    <h4 className="font-black uppercase text-[10px] mb-3 text-indigo-600">Importación Masiva</h4>
                                    <label className="w-full border-2 border-dashed border-indigo-200 rounded-2xl p-12 flex flex-col items-center justify-center cursor-pointer bg-white hover:bg-indigo-50 transition-all group">
                                        <input type="file" className="hidden" />
                                        <Icon name="upload-cloud" size={40} className="text-indigo-300 group-hover:scale-110 transition-transform mb-4" />
                                        <span className="text-[10px] font-black uppercase text-slate-400">Suelta tu Excel o CSV aquí</span>
                                    </label>
                                </div>
                            )}

                            {!isMassive && (
                                <React.Fragment>
                                    {/* RESPUESTAS Y PREGUNTAS EN CASCADA */}
                                    {step >= 1 && <div className="user-bubble animate-chat">{userData.name}</div>}
                                    {step === 1 && !isTyping && <div className="bot-bubble animate-chat">¿Y su apellido?</div>}

                                    {step >= 2 && <div className="user-bubble animate-chat">{userData.lastName}</div>}
                                    {step === 2 && !isTyping && <div className="bot-bubble animate-chat">Perfecto. ¿A qué email enviamos la invitación?</div>}

                                    {step >= 3 && <div className="user-bubble animate-chat">{userData.email}</div>}
                                    {step === 3 && !isTyping && <div className="bot-bubble animate-chat">¿A qué teléfono o WhatsApp podemos contactarlo?</div>}

                                    {step >= 4 && <div className="user-bubble animate-chat">{userData.phone}</div>}
                                    {step === 4 && !isTyping && <div className="bot-bubble animate-chat">Genial. Por último, ¿Qué rol ocupará en Blindato?</div>}

                                    {/* SELECCIÓN DE PERFIL DENTRO DEL CHAT */}
                                    {step >= 5 && <div className="user-bubble animate-chat uppercase tracking-widest">{userData.role}</div>}
                                    {step === 5 && !isTyping && (
                                        <div className="flex flex-col gap-3 animate-chat max-w-[85%]">
                                            {[
                                                {id: 'Inquilino', icon: 'user'},
                                                {id: 'Propietario', icon: 'shield'},
                                                {id: 'Administrador', icon: 'building-2'}
                                            ].map(r => (
                                                <button 
                                                    key={r.id}
                                                    onClick={() => { setUserData({...userData, role: r.id}); handleNext(); }}
                                                    className="btn-role"
                                                >
                                                    <div className="w-10 h-10 bg-slate-50 rounded-xl flex items-center justify-center text-slate-400 group-hover:text-[#0055DD] transition-colors">
                                                        <Icon name={r.icon} size={18}/>
                                                    </div>
                                                    <span className="uppercase text-xs tracking-tighter">{r.id}</span>
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    {/* RESUMEN Y CONFIRMACIÓN */}
                                    {step === 6 && !isTyping && (
                                        <div className="bot-bubble animate-chat bg-slate-50 border-slate-200">
                                            <p className="mb-4 font-bold text-slate-800 uppercase text-[10px] tracking-widest">Resumen de la Invitación</p>
                                            <div className="space-y-3 bg-white p-6 rounded-2xl border border-slate-100 shadow-sm mb-6">
                                                <div className="flex justify-between items-center"><span className="text-[10px] text-slate-400 uppercase font-black">Nombre</span><span className="text-sm font-bold text-slate-700">{userData.name} {userData.lastName}</span></div>
                                                <div className="flex justify-between items-center"><span className="text-[10px] text-slate-400 uppercase font-black">Email</span><span className="text-sm font-bold text-slate-700">{userData.email}</span></div>
                                                <div className="flex justify-between items-center"><span className="text-[10px] text-slate-400 uppercase font-black">Teléfono</span><span className="text-sm font-bold text-slate-700">{userData.phone}</span></div>
                                                <div className="flex justify-between items-center border-t pt-3"><span className="text-[10px] text-slate-400 uppercase font-black">Rol</span><span className="text-xs font-black text-indigo-600 uppercase tracking-widest">{userData.role}</span></div>
                                            </div>
                                            <div className="flex gap-3">
                                                <button onClick={handleNext} className="flex-1 bg-indigo-600 text-white py-4 rounded-xl font-black text-xs uppercase tracking-widest shadow-lg shadow-indigo-100 active:scale-95 transition-all">Confirmar y Enviar</button>
                                                <button onClick={resetProcess} className="px-6 py-4 bg-white text-slate-400 border border-slate-200 rounded-xl font-black text-xs uppercase hover:text-red-500 active:scale-95 transition-all">Editar</button>
                                            </div>
                                        </div>
                                    )}

                                    {/* ÉXITO FINAL */}
                                    {step >= 7 && (
                                        <div className="space-y-6">
                                            <div className="bot-bubble animate-chat bg-emerald-50 border-emerald-100">
                                                <div className="flex items-center gap-3 text-emerald-600 mb-2">
                                                    <Icon name="check-circle" size={24} strokeWidth={3} />
                                                    <h4 className="font-black uppercase tracking-tighter text-lg">Invitación Enviada</h4>
                                                </div>
                                                <p className="text-emerald-700 font-medium">El usuario recibirá un link para validar su identidad y completar su perfil.</p>
                                            </div>

                                            <div className="grid grid-cols-3 gap-4 animate-chat" style={{animationDelay: '0.4s'}}>
                                                <button onClick={() => setStep(0)} className="flex flex-col items-center gap-3 p-6 bg-white border-2 border-slate-50 rounded-[2rem] hover:border-indigo-600 transition-all shadow-sm">
                                                    <div className="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center"><Icon name="user-plus" /></div>
                                                    <span className="text-[9px] font-black uppercase text-slate-500 text-center">Nuevo Usuario</span>
                                                </button>
                                                <button className="flex flex-col items-center gap-3 p-6 bg-white border-2 border-slate-50 rounded-[2rem] hover:border-[#0055DD] transition-all shadow-sm">
                                                    <div className="w-12 h-12 bg-blue-50 text-[#0055DD] rounded-2xl flex items-center justify-center"><Icon name="building-2" /></div>
                                                    <span className="text-[9px] font-black uppercase text-slate-500 text-center">Nueva Propiedad</span>
                                                </button>
                                                <button className="flex flex-col items-center gap-3 p-6 bg-white border-2 border-slate-50 rounded-[2rem] hover:border-emerald-600 transition-all shadow-sm">
                                                    <div className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center"><Icon name="file-text" /></div>
                                                    <span className="text-[9px] font-black uppercase text-slate-500 text-center">Nuevo Contrato</span>
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </React.Fragment>
                            )}

                            {isTyping && (
                                <div className="bot-bubble flex items-center gap-1.5 py-4 w-max">
                                    <div className="typing-dot"></div>
                                    <div className="typing-dot"></div>
                                    <div className="typing-dot"></div>
                                </div>
                            )}
                        </div>

                        {/* INPUT CONTEXTUAL (SOLO PASOS 0 A 4) */}
                        {step < 5 && !isMassive && (
                            <footer className="p-10 border-t border-slate-50 bg-white/80 backdrop-blur-md sticky bottom-0 z-40">
                                <div className="flex gap-4 max-w-2xl mx-auto">
                                    <input 
                                        type={step === 2 ? "email" : "text"}
                                        placeholder={
                                            step === 0 ? "Escribe su Nombre..." :
                                            step === 1 ? "Su Apellido..." :
                                            step === 2 ? "Correo Electrónico..." :
                                            step === 3 ? "Teléfono o WhatsApp..." : "Escribe aquí..."
                                        }
                                        value={
                                            step === 0 ? userData.name :
                                            step === 1 ? userData.lastName :
                                            step === 2 ? userData.email :
                                            step === 3 ? userData.phone : ""
                                        }
                                        onChange={(e) => {
                                            const v = e.target.value;
                                            if(step === 0) setUserData({...userData, name: v});
                                            else if(step === 1) setUserData({...userData, lastName: v});
                                            else if(step === 2) setUserData({...userData, email: v});
                                            else if(step === 3) setUserData({...userData, phone: v});
                                        }}
                                        className="input-chat"
                                        onKeyDown={(e) => e.key === 'Enter' && handleNext()}
                                        autoFocus
                                    />
                                    <button 
                                        onClick={handleNext}
                                        className="bg-indigo-600 text-white w-16 h-16 rounded-[1.5rem] flex items-center justify-center shadow-xl shadow-indigo-100 hover:bg-indigo-700 active:scale-95 transition-all shrink-0"
                                    >
                                        <Icon name="send" />
                                    </button>
                                </div>
                            </footer>
                        )}

                        {isMassive && step < 7 && (
                             <footer className="p-10 border-t border-slate-50 bg-white flex justify-center">
                                <button onClick={() => setStep(7)} className="bg-indigo-600 text-white px-10 py-5 rounded-[2.5rem] font-black text-xs uppercase tracking-widest shadow-xl">Iniciar Carga de Cartera</button>
                             </footer>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
