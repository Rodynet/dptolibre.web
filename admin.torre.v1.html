<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DptoLibre Admin - Torre de Control</title>
    
    <!-- Librerías necesarias para que React funcione en HTML puro -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 font-sans">
    
    <!-- Aquí es donde se monta la App de React -->
    <div id="root"></div>

    <script type="text/babel">
        // Extraemos los componentes de Lucide
        const { Shield, RefreshCw, AlertTriangle, FileText, Users } = lucide;

        function App() {
            const [status, setStatus] = React.useState('Activo');
            const [logs, setLogs] = React.useState(['Sistema inicializado.']);

            const addLog = (msg) => {
                const timestamp = new Date().toLocaleTimeString();
                setLogs(prev => [`${timestamp} - ${msg}`, ...prev].slice(0, 5));
            };

            const handleRestart = () => {
                setStatus('Reiniciando...');
                addLog('Iniciando ciclo de mantenimiento...');
                setTimeout(() => {
                    setStatus('Activo');
                    addLog('Sistema restaurado correctamente.');
                }, 2000);
            };

            return (
                <div className="max-w-md mx-auto mt-10 bg-white p-6 rounded-2xl shadow-xl border border-gray-200">
                    <h1 className="text-2xl font-bold mb-6 flex items-center gap-2">
                        <Shield className="text-blue-600" /> Blindato Admin
                    </h1>
                    
                    <div className="mb-6 p-4 bg-gray-50 rounded-xl flex justify-between items-center border">
                        <span className="font-semibold text-gray-700">Estado actual:</span>
                        <span className={`px-3 py-1 rounded-full text-sm font-bold ${status === 'Activo' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>
                            {status}
                        </span>
                    </div>

                    <button 
                        onClick={handleRestart}
                        className="w-full flex items-center justify-center gap-2 bg-blue-600 text-white py-3 rounded-xl hover:bg-blue-700 transition font-medium"
                    >
                        <RefreshCw size={18} /> Reiniciar Sistema
                    </button>

                    <div className="mt-8">
                        <h2 className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">Actividad reciente</h2>
                        <div className="space-y-2">
                            {logs.map((log, index) => (
                                <p key={index} className="text-sm text-gray-600 bg-gray-50 p-2 rounded border-l-2 border-blue-500">
                                    {log}
                                </p>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // --- INICIALIZADOR ---
        // Esto es lo que te faltaba: montar la app en el div 'root'
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
