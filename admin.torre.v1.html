<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DptoLibre Admin - Torre de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#F4F7F9] font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const { LayoutDashboard, FileText, Users, Building2, Settings, Plus, Bell, Search, User, Gavel, TrendingUp, Zap, Clock } = lucide;

        function DashboardApp() {
            const [activeView, setActiveView] = useState('inicio');

            const SidebarItem = ({ id, label, icon: Icon }) => (
                <button 
                    onClick={() => setActiveView(id)}
                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition-all ${activeView === id ? 'bg-[#0055DD] text-white shadow-lg' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}
                >
                    <Icon size={18} /> {label}
                </button>
            );

            return (
                <div className="flex h-screen w-full">
                    {/* Sidebar */}
                    <aside className="w-64 bg-[#0A142F] text-white flex flex-col p-6">
                        <div className="flex items-center gap-2 mb-10">
                            <div className="bg-[#0055DD] p-2 rounded-lg font-black text-white">DL</div>
                            <span className="font-black text-xl tracking-tighter">dptolibre</span>
                        </div>
                        <nav className="flex-1 space-y-2">
                            <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest px-3 mb-2">Gestión</p>
                            <SidebarItem id="inicio" label="Torre de Control" icon={LayoutDashboard} />
                            <SidebarItem id="contratos" label="Contratos" icon={FileText} />
                            <SidebarItem id="usuarios" label="Usuarios" icon={Users} />
                            <SidebarItem id="propiedades" label="Propiedades" icon={Building2} />
                            <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest px-3 mt-6 mb-2">Configuración</p>
                            <SidebarItem id="admin" label="Administración" icon={Settings} />
                        </nav>
                    </aside>

                    {/* Main */}
                    <div className="flex-1 flex flex-col">
                        <header className="h-20 bg-white border-b border-slate-200 flex justify-between items-center px-8">
                            <h2 className="text-sm font-black uppercase text-slate-400 tracking-widest">{activeView}</h2>
                            <div className="flex items-center gap-4">
                                <button className="bg-[#0055DD] text-white px-5 py-2.5 rounded-xl font-black text-xs uppercase flex items-center gap-2 shadow-lg shadow-blue-500/30">
                                    <Plus size={16} /> Crear Nuevo
                                </button>
                                <div className="w-8 h-8 rounded-full bg-slate-200"></div>
                            </div>
                        </header>

                        <main className="p-8 overflow-y-auto">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                    <p className="text-[10px] font-black text-slate-400 uppercase">Recaudación Bruta</p>
                                    <h3 className="text-2xl font-black mt-1">$12.540.800</h3>
                                    <div className="text-[10px] font-bold text-emerald-500 mt-2 flex items-center gap-1"><TrendingUp size={12}/> +$12k hoy</div>
                                </div>
                                <div className="bg-slate-900 p-6 rounded-3xl text-white">
                                    <p className="text-[10px] font-black text-indigo-400 uppercase">Mis Ganancias</p>
                                    <h3 className="text-2xl font-black mt-1 text-[#00D1FF]">$840.500</h3>
                                </div>
                                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                    <p className="text-[10px] font-black text-slate-400 uppercase">Saldo de Dueños</p>
                                    <h3 className="text-2xl font-black mt-1">$7.820.000</h3>
                                    <div className="text-[10px] font-bold text-amber-500 mt-2 flex items-center gap-1"><Clock size={12}/> 14 Dueños a liquidar</div>
                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DashboardApp />);
    </script>
</body>
</html>
