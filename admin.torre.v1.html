<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DptoLibre Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">
    
    <div id="root"></div>

    <script type="text/babel">
        // Componentes de iconos nativos (SVG) para evitar errores de carga externa
        const IconShield = () => (
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-blue-600">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
        );

        const IconRefresh = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16" />
            </svg>
        );

        function App() {
            const [status, setStatus] = React.useState('Activo');
            const [logs, setLogs] = React.useState(['Sistema inicializado correctamente.']);

            const handleRestart = () => {
                setStatus('Reiniciando...');
                const timestamp = new Date().toLocaleTimeString();
                setLogs(prev => [`${timestamp} - Reiniciando servicios...`, ...prev]);
                
                setTimeout(() => {
                    setStatus('Activo');
                    setLogs(prev => [`${new Date().toLocaleTimeString()} - Sistema listo.`, ...prev]);
                }, 1500);
            };

            return (
                <div className="max-w-md mx-auto mt-10 bg-white p-6 rounded-2xl shadow-xl border border-gray-200">
                    <h1 className="text-2xl font-bold mb-6 flex items-center gap-2">
                        <IconShield /> DptoLibre Admin
                    </h1>
                    
                    <div className="mb-6 p-4 bg-gray-50 rounded-xl flex justify-between items-center border border-gray-100">
                        <span className="font-semibold text-gray-700">Estado:</span>
                        <span className={`px-3 py-1 rounded-full text-sm font-bold ${status === 'Activo' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>
                            {status}
                        </span>
                    </div>

                    <button 
                        onClick={handleRestart}
                        className="w-full flex items-center justify-center gap-2 bg-blue-600 text-white py-3 rounded-xl hover:bg-blue-700 transition font-medium"
                    >
                        <IconRefresh /> Reiniciar Sistema
                    </button>

                    <div className="mt-8">
                        <h2 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Logs del sistema</h2>
                        <div className="space-y-2 max-h-40 overflow-y-auto">
                            {logs.map((log, index) => (
                                <p key={index} className="text-xs text-gray-600 bg-gray-50 p-2 rounded border-l-2 border-blue-500 font-mono">
                                    {log}
                                </p>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
