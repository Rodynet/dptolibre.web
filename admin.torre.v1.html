<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blindato Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [status, setStatus] = React.useState('cargando');

            React.useEffect(() => {
                // Forzamos un pequeño delay para asegurar que el DOM esté listo
                const timer = setTimeout(() => {
                    setStatus('ready');
                }, 100);
                return () => clearTimeout(timer);
            }, []);

            if (status === 'cargando') {
                return (
                    <div className="flex items-center justify-center h-screen bg-slate-900 text-white">
                        <p className="text-xl font-bold animate-pulse">Cargando sistema...</p>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-white p-10">
                    <h1 className="text-4xl font-black text-slate-900">Blindato Admin</h1>
                    <p className="mt-4 text-slate-600">Sistema operativo y listo para interactuar.</p>
                    <div className="mt-8 p-6 bg-blue-50 rounded-2xl border-2 border-blue-100">
                        <h2 className="font-bold text-blue-800">Estado: Online</h2>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
