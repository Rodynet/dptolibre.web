<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blindato Admin Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    
    <div id="app-container" class="max-w-4xl mx-auto mt-10 p-6 bg-white shadow-xl rounded-2xl border border-slate-200">
        <header class="border-b pb-6">
            <h1 class="text-3xl font-extrabold text-blue-900 tracking-tight">Blindato Admin</h1>
            <p class="text-slate-500 mt-1">Panel de control del sistema de seguridad.</p>
        </header>

        <main id="main-content" class="mt-8">
            <div id="status-card" class="p-6 bg-green-50 border border-green-200 rounded-xl">
                <h2 class="text-lg font-bold text-green-800">Estado del Sistema</h2>
                <p class="text-green-600 mt-2">El motor de ejecución está operativo y estable.</p>
            </div>

            <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="showAlert('Servicio iniciado correctamente')" class="w-full p-4 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition">
                    Iniciar Servicio
                </button>
                <button onclick="showAlert('Estado verificado')" class="w-full p-4 bg-slate-200 text-slate-800 font-semibold rounded-lg hover:bg-slate-300 transition">
                    Verificar Estado
                </button>
            </div>
        </main>
    </div>

    <script>
        // Función de utilidad segura para reemplazar alerts
        function showAlert(message) {
            const container = document.getElementById('main-content');
            const alert = document.createElement('div');
            alert.className = 'mt-4 p-4 bg-blue-100 text-blue-900 rounded-lg fade-in';
            alert.textContent = message;
            container.appendChild(alert);
            
            setTimeout(() => {
                alert.remove();
            }, 3000);
        }

        console.log("Blindato Admin cargado correctamente sin dependencias externas.");
    </script>
</body>
</html>
