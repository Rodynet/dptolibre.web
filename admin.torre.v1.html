<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DptoLibre Admin - Torre de Control V84</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --brand-blue: #0055DD;
            --brand-cyan: #00D1FF;
            --brand-dark: #0A142F;
            --bg-gray: #F4F7F9;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-gray);
            color: #1e293b;
            margin: 0;
            overflow: hidden; 
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes popIn { 0% { opacity: 0; transform: scale(0.95) translateY(-10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        .dropdown-pop { animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; transform-origin: top right; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // COMPONENTE DE ICONOS (A prueba de fallos)
        const Icon = ({ name, size = 20, className = "" }) => {
            React.useEffect(() => { 
                if (window.lucide) window.lucide.createIcons(); 
            }, [name, size, className]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // COMPONENTE DE GRÁFICO VELOCÍMETRO
        const Gauge = ({ value, label }) => {
            const color = value > 90 ? 'text-emerald-500' : value > 75 ? 'text-amber-500' : 'text-red-500';
            return (
                <div className="relative w-32 h-32 flex items-center justify-center">
                    <svg className="w-full h-full transform -rotate-90">
                        <circle cx="50%" cy="50%" r="45%" strokeWidth="8" fill="transparent" className="text-slate-100" stroke="currentColor" />
                        <circle cx="50%" cy="50%" r="45%" strokeWidth="8" fill="transparent" strokeDasharray="283" strokeDashoffset={283 - (283 * value) / 100} className={color} stroke="currentColor" style={{ strokeLinecap: 'round', transition: 'stroke-dashoffset 1s ease-out' }} />
                    </svg>
                    <div className="absolute inset-0 flex flex-col items-center justify-center">
                        <span className="text-2xl font-black text-slate-800">{value}%</span>
                        <span className="text-[9px] font-black uppercase text-slate-400 tracking-widest">{label}</span>
                    </div>
                </div>
            );
        };

        function AdminWebOS() {
            const [activeView, setActiveView] = React.useState('inicio');
            const [showAddMenu, setShowAddMenu] = React.useState(false);

            // Datos de prueba (Mocks)
            const adminData = {
                name: "Rodrigo",
                agency: "Inmobiliaria Raíces",
                healthScore: 94,
                feesBalance: 840500,
                feesYieldToday: 1250,
                ownersReady: 14
            };

            const verdicts = [
                { id: 1, type: 'aprobacion', title: 'Legajo Verificado: Marcos Galperin', desc: 'IA confirma solvencia. Identidad validada. Listo para firmar contrato.', action: 'DAR OK FINAL', color: 'emerald' },
                { id: 2, type: 'alerta', title: 'Dueño inactivo: Caseros 1230', desc: 'Presupuesto de plomería ($15.000) esperando OK hace 48hs.', action: 'PUSH URGENCIA', color: 'amber' },
                { id: 3, type: 'riesgo', title: 'Renovación Crítica: Av. Colón 450', desc: 'Vence en 45 días. El inquilino es Excelente, enviar oferta de retención.', action: 'ENVIAR OFERTA', color: 'indigo' }
            ];

            // VISTA: DASHBOARD PRINCIPAL
            const DashboardView = () => (
                <div className="p-8 animate-in h-full overflow-y-auto custom-scrollbar pb-32">
                    <header className="mb-8">
                        <h1 className="text-3xl font-black text-slate-800 tracking-tight italic">Torre de Control</h1>
                        <p className="text-slate-500 font-medium mt-1">Visión anticipada de tu negocio y acciones requeridas.</p>
                    </header>

                    <div className="grid grid-cols-12 gap-6 mb-6">
                        
                        {/* COLUMNA 1: Salud y Riesgo */}
                        <div className="col-span-12 lg:col-span-3 space-y-6">
                            <div className="glass-card p-6 rounded-3xl flex flex-col items-center text-center">
                                <Gauge value={adminData.healthScore} label="Salud" />
                                <p className="text-xs text-slate-500 mt-4 leading-relaxed">Puntualidad excelente. Resolución de tickets promedio: 24hs.</p>
                            </div>
                            
                            <div className="glass-card p-6 rounded-3xl border-l-4 border-l-red-500">
                                <div className="flex items-center gap-3 mb-4">
                                    <Icon name="radar" className="text-red-500" />
                                    <h3 className="font-black text-slate-800 text-sm uppercase tracking-tighter">Radar de Mora</h3>
                                </div>
                                <div className="bg-red-50 p-3 rounded-xl border border-red-100 flex flex-col gap-2">
                                    <div className="flex justify-between items-center">
                                        <p className="text-xs font-bold text-red-800">Mariano Gomez</p>
                                        <p className="text-[10px] font-black text-red-600 uppercase">Score 650</p>
                                    </div>
                                    <button className="w-full text-[9px] bg-red-600 text-white py-2 rounded-lg font-black uppercase">Ofrecer Préstamo Adelanto</button>
                                </div>
                            </div>
                        </div>

                        {/* COLUMNA 2: Veredictos (El Juez) */}
                        <div className="col-span-12 lg:col-span-5 flex flex-col">
                            <div className="glass-card p-6 rounded-3xl flex-1 flex flex-col">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="font-black text-slate-800 text-lg flex items-center gap-2 italic">
                                        <Icon name="gavel" className="text-[#0055DD]" /> La Valla de Veredictos
                                    </h3>
                                    <span className="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-[10px] font-black uppercase">3 Acciones</span>
                                </div>
                                <p className="text-xs text-slate-500 mb-6">El sistema ha procesado la burocracia. Solo requieren tu autorización final.</p>
                                
                                <div className="space-y-4">
                                    {verdicts.map(v => (
                                        <div key={v.id} className={`bg-white border border-slate-100 p-5 rounded-2xl shadow-sm flex flex-col gap-4 border-l-4 border-l-${v.color}-500`}>
                                            <div>
                                                <h4 className="font-bold text-slate-800 text-sm">{v.title}</h4>
                                                <p className="text-xs text-slate-600 mt-1">{v.desc}</p>
                                            </div>
                                            <button className="w-full py-3 bg-slate-900 text-white rounded-xl font-black text-[10px] uppercase tracking-widest hover:bg-slate-800 transition-colors">
                                                {v.action}
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* COLUMNA 3: Tesorería y Ventas */}
                        <div className="col-span-12 lg:col-span-4 space-y-6">
                            {/* Proyección Cash Flow */}
                            <div className="glass-card p-6 rounded-3xl bg-slate-900 text-white shadow-2xl relative overflow-hidden">
                                <Icon name="wallet" size={100} className="absolute -right-4 -bottom-4 text-white/5" />
                                <h3 className="text-[10px] font-black uppercase text-indigo-400 tracking-widest mb-6">Recaudación y Clearing</h3>
                                <div className="space-y-5 relative z-10">
                                    <div>
                                        <div className="flex justify-between text-xs mb-1"><span className="text-slate-300">Cobrado (Disponible)</span><span className="font-bold text-emerald-400">$2.150.000</span></div>
                                        <div className="h-2 w-full bg-slate-800 rounded-full overflow-hidden"><div className="h-full bg-emerald-400" style={{width:'40%'}}></div></div>
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-xs mb-1"><span className="text-slate-300">En Clearing (Rindiendo)</span><span className="font-bold text-[#00D1FF]">$4.500.000</span></div>
                                        <div className="h-2 w-full bg-slate-800 rounded-full overflow-hidden"><div className="h-full bg-[#00D1FF]" style={{width:'60%'}}></div></div>
                                    </div>
                                </div>
                                <button className="mt-8 w-full flex items-center justify-center gap-2 bg-emerald-500 text-slate-900 py-4 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg active:scale-95 transition-all">
                                    <Icon name="zap" size={16}/> Liquidar Masivo ({adminData.ownersReady} Dueños)
                                </button>
                            </div>

                            {/* Mis Ganancias */}
                            <div className="glass-card p-6 rounded-3xl border border-[#0055DD]/20">
                                <h3 className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-2">Mis Ganancias (Float)</h3>
                                <p className="text-3xl font-black text-[#0055DD]">${adminData.feesBalance.toLocaleString()}</p>
                                <div className="mt-4 flex items-center gap-3 bg-blue-50 text-blue-700 p-3 rounded-xl border border-blue-100">
                                    <Icon name="sparkles" size={18} className="text-amber-500" />
                                    <p className="text-xs font-medium">Tus fondos rinden <strong>+${adminData.feesYieldToday}</strong> hoy automáticamente.</p>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );

            // VISTA EN CONSTRUCCIÓN (Para links del menú)
            const EnConstruccion = ({ title }) => (
                <div className="flex flex-col items-center justify-center h-full animate-in opacity-50">
                    <Icon name="settings" size={64} className="mb-4 text-slate-400 animate-spin-slow" />
                    <h2 className="text-2xl font-black text-slate-700 uppercase tracking-tighter">Módulo {title}</h2>
                    <p className="text-slate-500 font-medium">Disponible en la próxima actualización.</p>
                </div>
            );

            // RENDER PRINCIPAL
            return (
                <div className="flex h-screen w-full font-sans">
                    
                    {/* BARRA LATERAL (SIDEBAR) */}
                    <aside className="w-64 bg-[#0A142F] text-white flex flex-col border-r border-slate-800 shadow-2xl z-20">
                        <div className="p-8 border-b border-white/5 flex items-center gap-3">
                            <div className="w-10 h-10 bg-[#0055DD] rounded-xl flex items-center justify-center text-white font-black text-xl shadow-lg">D</div>
                            <span className="font-black text-xl tracking-tighter leading-none italic">DptoLibre</span>
                        </div>

                        <nav className="flex-1 p-4 space-y-2 mt-4">
                            <p className="px-3 pb-2 text-[10px] font-black uppercase text-slate-500 tracking-widest">Gestión</p>
                            
                            {[
                                { id: 'inicio', label: 'Torre de Control', icon: 'layout-dashboard' },
                                { id: 'contratos', label: 'Contratos', icon: 'file-text' },
                                { id: 'usuarios', label: 'Usuarios', icon: 'users' },
                                { id: 'propiedades', label: 'Propiedades', icon: 'building-2' },
                            ].map(item => (
                                <button 
                                    key={item.id}
                                    onClick={() => setActiveView(item.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition-all ${activeView === item.id ? 'bg-[#0055DD] text-white shadow-lg' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}
                                >
                                    <Icon name={item.icon} size={18} /> {item.label}
                                </button>
                            ))}

                            <p className="px-3 pt-6 pb-2 text-[10px] font-black uppercase text-slate-500 tracking-widest">Configuración</p>
                            <button 
                                onClick={() => setActiveView('administracion')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition-all ${activeView === 'administracion' ? 'bg-[#0055DD] text-white shadow-lg' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}
                            >
                                <Icon name="settings" size={18} /> Administración
                            </button>
                        </nav>
                    </aside>

                    {/* ÁREA CENTRAL */}
                    <div className="flex-1 flex flex-col relative bg-[#F4F7F9]">
                        
                        {/* CABECERA (HEADER) */}
                        <header className="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 px-8 flex justify-between items-center z-40 sticky top-0 shadow-sm">
                            <h2 className="font-black text-slate-400 uppercase tracking-widest text-xs">{activeView}</h2>

                            <div className="flex items-center gap-6">
                                {/* Menú CREAR (+) */}
                                <div className="relative">
                                    <button 
                                        onClick={() => setShowAddMenu(!showAddMenu)}
                                        className="flex items-center gap-2 bg-[#0055DD] text-white px-5 py-2.5 rounded-xl font-black text-xs uppercase tracking-widest shadow-lg hover:bg-blue-700 active:scale-95 transition-all"
                                    >
                                        <Icon name="plus" size={16} /> Crear
                                    </button>
                                    
                                    {showAddMenu && (
                                        <div className="absolute top-14 right-0 w-64 bg-white rounded-2xl shadow-2xl border border-slate-100 p-2 animate-in z-50">
                                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest px-3 py-2">Acceso Rápido</p>
                                            <button onClick={() => setShowAddMenu(false)} className="w-full flex items-center gap-3 px-3 py-3 hover:bg-blue-50 rounded-xl text-sm font-bold text-slate-700 transition-colors">
                                                <div className="bg-indigo-100 text-indigo-600 p-2 rounded-lg"><Icon name="user-plus" size={16}/></div> Nuevo Usuario
                                            </button>
                                            <button onClick={() => setShowAddMenu(false)} className="w-full flex items-center gap-3 px-3 py-3 hover:bg-blue-50 rounded-xl text-sm font-bold text-slate-700 transition-colors">
                                                <div className="bg-emerald-100 text-emerald-600 p-2 rounded-lg"><Icon name="file-signature" size={16}/></div> Nuevo Contrato
                                            </button>
                                            <button onClick={() => setShowAddMenu(false)} className="w-full flex items-center gap-3 px-3 py-3 hover:bg-blue-50 rounded-xl text-sm font-bold text-slate-700 transition-colors">
                                                <div className="bg-amber-100 text-amber-600 p-2 rounded-lg"><Icon name="building-2" size={16}/></div> Nueva Propiedad
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <div className="h-6 w-[1px] bg-slate-200"></div>

                                <button className="text-slate-400 hover:text-[#0055DD] transition-colors relative">
                                    <Icon name="bell" size={20} />
                                    <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>
                                </button>
                                
                                <div className="flex items-center gap-3 text-left">
                                    <div className="w-8 h-8 rounded-full border border-slate-200 overflow-hidden bg-slate-100">
                                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" alt="Perfil" />
                                    </div>
                                    <div className="hidden md:block">
                                        <p className="text-xs font-bold text-slate-800 leading-none">{adminData.name}</p>
                                        <p className="text-[10px] text-slate-500 font-medium mt-0.5">{adminData.agency}</p>
                                    </div>
                                </div>
                            </div>
                        </header>

                        {/* CONTENEDOR DINÁMICO */}
                        <div className="flex-1 overflow-hidden relative">
                            {activeView === 'inicio' && <DashboardView />}
                            {activeView !== 'inicio' && <EnConstruccion title={activeView} />}
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminWebOS />);
    </script>
</body>
</html>
