<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blindato Admin - Alta Usuario AI V4.0</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --brand-blue: #0055DD;
            --brand-dark: #0A142F;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
            color: #1e293b;
        }

        .animate-bubble { 
            animation: bubbleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
        }
        @keyframes bubbleIn { 
            from { opacity: 0; transform: translateY(15px) scale(0.95); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }

        .bot-bubble {
            @apply bg-white border border-slate-100 p-5 rounded-tr-[2rem] rounded-br-[2rem] rounded-bl-[2rem] shadow-sm max-w-[85%] text-sm font-medium leading-relaxed;
        }

        .user-bubble {
            @apply bg-[#0055DD] text-white p-5 rounded-tl-[2rem] rounded-bl-[2rem] rounded-br-[2rem] shadow-lg max-w-[80%] text-sm font-bold ml-auto;
        }

        .input-chat {
            @apply w-full bg-white border-2 border-slate-100 px-6 py-4 rounded-2xl text-base font-bold focus:ring-4 focus:ring-blue-50 focus:border-[#0055DD] outline-none transition-all;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .sidebar { background-color: #0A142F; }

        .typing-dot {
            width: 4px; height: 4px; background: #94a3b8; border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

        .role-card {
            @apply p-4 bg-white border-2 border-slate-50 rounded-2xl text-left font-bold text-slate-700 flex items-center gap-3 hover:border-[#0055DD] hover:bg-blue-50 transition-all active:scale-95 cursor-pointer;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { 
                if (window.lucide) window.lucide.createIcons(); 
            }, [name, size, className]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // Mock de base de datos de propiedades y contratos para la búsqueda
        const mockProps = [
            { id: 1, address: "Caseros 1230, 4B", neighborhood: "Centro", rooms: 2 },
            { id: 2, address: "Av. Colón 450", neighborhood: "Centro", rooms: 3 }
        ];

        const mockContracts = [
            { id: "CTR-101", address: "Caseros 1230, 4B", owner: "Roberto Daer" },
            { id: "CTR-102", address: "Av. Colón 450", owner: "Carlos Paz" },
            { id: "CTR-103", address: "San Martín 22", owner: "Ana Gomez" },
            { id: "CTR-104", address: "Belgrano 880", owner: "Roberto Daer" }
        ];

        function BlindatoAdminApp() {
            /* Pasos Lógicos:
               0-3: Datos personales
               4: Selección de Rol
               --- Si Propietario ---
               50: Propiedad Nueva / Existente / Saltar
               51: Búsqueda de propiedad
               52: Resultados propiedad
               --- Si Inquilino ---
               60: Asociar Contrato o Solo Invitar
               61: Contrato Nuevo o Existente
               62: Búsqueda de contrato (Input)
               63: Resultados de contrato
               --- Final ---
               80: Resumen Confirmación
               90: Éxito Final
            */
            const [step, setStep] = useState(0);
            const [isMassive, setIsMassive] = useState(false);
            const [isTyping, setIsTyping] = useState(false);
            const [currentSearch, setCurrentSearch] = useState("");
            
            const [searchResults, setSearchResults] = useState([]);
            const [searchContractResults, setSearchContractResults] = useState([]);

            const [userData, setUserData] = useState({ 
                name: '', lastName: '', email: '', phone: '', 
                role: '', 
                propChoice: '', 
                searchTerm: '', 
                linkedProp: null,
                inqChoice: '',
                inqContractType: '',
                contractSearchTerm: '',
                linkedContract: null
            });

            const scrollRef = useRef(null);

            const typeAndGo = (nextStep, delay = 800) => {
                setIsTyping(true);
                setTimeout(() => {
                    setIsTyping(false);
                    setStep(nextStep);
                }, delay);
            };

            const handleNextStep = () => {
                if (step === 0 && !userData.name.trim()) return;
                if (step === 1 && !userData.lastName.trim()) return;
                if (step === 2 && !userData.email.trim()) return;
                if (step === 3 && !userData.phone.trim()) return;

                setStep(step + 1);
                if (step + 1 < 5) typeAndGo(step + 1);
            };

            const selectRole = (roleName) => {
                setUserData({ ...userData, role: roleName });
                if (roleName === 'Propietario') typeAndGo(50);
                else if (roleName === 'Inquilino') typeAndGo(60);
                else typeAndGo(80); // Administrador va directo al resumen
            };

            // --- LÓGICA DUEÑO ---
            const handlePropChoice = (choice) => {
                setUserData({ ...userData, propChoice: choice });
                if (choice === 'nueva' || choice === 'saltar') typeAndGo(80);
                else typeAndGo(51);
            };

            const executePropSearch = () => {
                const term = currentSearch.toLowerCase().trim();
                if (!term) return;
                setUserData(prev => ({ ...prev, searchTerm: term }));
                setIsTyping(true);
                setStep(52); 
                setTimeout(() => {
                    const results = mockProps.filter(p => p.address.toLowerCase().includes(term));
                    setSearchResults(results);
                    setIsTyping(false);
                    setCurrentSearch('');
                }, 1200);
            };

            const selectProperty = (prop) => {
                setUserData({ ...userData, linkedProp: prop });
                typeAndGo(80);
            };

            // --- LÓGICA INQUILINO ---
            const handleInqChoice = (choice) => {
                setUserData({ ...userData, inqChoice: choice });
                if (choice === 'contrato') typeAndGo(61);
                else typeAndGo(80); // Solo invitar
            };

            const handleContractType = (type) => {
                setUserData({ ...userData, inqContractType: type });
                if (type === 'nuevo') typeAndGo(80); // Si es nuevo va al resumen directo
                else typeAndGo(62); // Si es existente busca
            };

            const executeContractSearch = () => {
                const term = currentSearch.toLowerCase().trim();
                if (!term) return;
                setUserData(prev => ({ ...prev, contractSearchTerm: term }));
                setIsTyping(true);
                setStep(63);
                setTimeout(() => {
                    const results = mockContracts.filter(c => 
                        c.address.toLowerCase().includes(term) || 
                        c.owner.toLowerCase().includes(term)
                    );
                    setSearchContractResults(results);
                    setIsTyping(false);
                    setCurrentSearch('');
                }, 1200);
            };

            const selectContract = (contract) => {
                setUserData({ ...userData, linkedContract: contract });
                typeAndGo(80);
            };

            // --- ACCIONES FINALES ---
            const editData = () => {
                setStep(0);
                // Retiene los datos para edición rápida
            };

            const confirmAndSend = () => {
                typeAndGo(90, 1500);
            };

            // Auto-scroll
            useEffect(() => {
                if (scrollRef.current) {
                    scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
                }
            }, [step, isTyping, searchResults, searchContractResults]);

            const Sidebar = () => (
                <aside className="w-24 sidebar text-white flex flex-col items-center py-8 gap-10 border-r border-slate-800 h-screen fixed left-0 top-0 z-50 shadow-2xl">
                    <div className="w-12 h-12 bg-indigo-500 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-lg">B</div>
                    <nav className="flex flex-col gap-8 text-slate-500">
                        <div className="p-3 hover:text-white transition-colors cursor-pointer"><Icon name="layout-grid" size={24} /></div>
                        <div className="p-3 bg-indigo-500/10 text-indigo-400 rounded-xl"><Icon name="user-plus" size={24} /></div>
                        <div className="p-3 hover:text-white transition-colors cursor-pointer"><Icon name="building" size={24} /></div>
                        <div className="p-3 hover:text-white transition-colors cursor-pointer"><Icon name="file-text" size={24} /></div>
                        <div className="p-3 hover:text-white transition-colors cursor-pointer"><Icon name="wallet" size={24} /></div>
                    </nav>
                </aside>
            );

            // Control de visibilidad del input inferior
            const showInput = (step >= 0 && step <= 3) || step === 51 || step === 52 || step === 62 || step === 63;

            return (
                <div className="flex min-h-screen w-full relative overflow-hidden bg-[#F8FAFC]">
                    <Sidebar />
                    
                    <main className="flex-1 flex flex-col ml-24 h-screen max-w-4xl mx-auto relative border-x border-slate-100 bg-white shadow-sm">
                        
                        <header className="p-6 border-b border-slate-50 flex justify-between items-center bg-white sticky top-0 z-40">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-[#0055DD] shadow-inner">
                                    <Icon name="sparkles" size={20} />
                                </div>
                                <div>
                                    <h2 className="text-sm font-black uppercase tracking-widest text-slate-800 leading-none italic">Secretaría Digital</h2>
                                    <p className="text-[10px] text-emerald-500 font-bold uppercase mt-1">Conectado • Asistente AI</p>
                                </div>
                            </div>
                            <button 
                                onClick={() => { setIsMassive(!isMassive); setStep(0); }}
                                className="bg-slate-50 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-400 border border-slate-100 hover:text-indigo-600 transition-all"
                            >
                                {isMassive ? "Vía Chat" : "Carga Masiva"}
                            </button>
                        </header>

                        <div ref={scrollRef} className="flex-1 overflow-y-auto p-8 space-y-8 no-scrollbar pb-48">
                            
                            {/* Bienvenida */}
                            <div className="bot-bubble animate-bubble">
                                <p>¡Hola! Soy tu asistente de Blindato. Vamos a cargar un usuario nuevo en tu red.</p>
                                <p className="mt-2 text-indigo-500 font-bold italic">¿Cuál es su nombre?</p>
                            </div>

                            {!isMassive && (
                                <React.Fragment>
                                    {/* PASOS 1-4: DATOS BÁSICOS */}
                                    {step >= 1 && <div className="user-bubble animate-bubble">{userData.name}</div>}
                                    {step === 1 && !isTyping && <div className="bot-bubble animate-bubble italic">¿Y su apellido?</div>}

                                    {step >= 2 && <div className="user-bubble animate-bubble">{userData.lastName}</div>}
                                    {step === 2 && !isTyping && <div className="bot-bubble animate-bubble">Perfecto. ¿Cuál es su correo electrónico?</div>}

                                    {step >= 3 && <div className="user-bubble animate-bubble">{userData.email}</div>}
                                    {step === 3 && !isTyping && <div className="bot-bubble animate-bubble">¿A qué teléfono o WhatsApp enviamos la invitación?</div>}

                                    {step >= 4 && <div className="user-bubble animate-bubble">{userData.phone}</div>}
                                    
                                    {/* SELECCIÓN DE ROL */}
                                    {step === 4 && !isTyping && (
                                        <div className="bot-bubble animate-bubble">
                                            <p>Excelente. Ahora selecciona el rol que tendrá <strong>{userData.name}</strong> en la plataforma:</p>
                                            <div className="mt-6 flex flex-col gap-3">
                                                {[
                                                    { id: 'Inquilino', icon: 'user', desc: 'Ocupante / Pagador' },
                                                    { id: 'Propietario', icon: 'shield', desc: 'Dueño de activos' },
                                                    { id: 'Administrador', icon: 'building-2', desc: 'Gestor' }
                                                ].map(roleItem => (
                                                    <div key={roleItem.id} onClick={() => selectRole(roleItem.id)} className="role-card group">
                                                        <div className="w-10 h-10 bg-slate-50 rounded-xl flex items-center justify-center text-slate-400 group-hover:bg-[#0055DD] group-hover:text-white transition-all"><Icon name={roleItem.icon} size={18}/></div>
                                                        <div className="flex-1"><p className="text-xs font-black uppercase tracking-widest">{roleItem.id}</p><p className="text-[9px] text-slate-400 font-bold uppercase">{roleItem.desc}</p></div>
                                                        <Icon name="chevron-right" size={16} className="text-slate-200 group-hover:text-slate-400" />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {step >= 5 && <div className="user-bubble animate-bubble uppercase tracking-widest">{userData.role}</div>}

                                    {/* --- RAMA PROPIETARIO --- */}
                                    {step === 50 && !isTyping && (
                                        <div className="bot-bubble animate-bubble">
                                            <p>¡Entendido! Podemos asociar a este propietario a una de sus propiedades ahora mismo o hacerlo más tarde.</p>
                                            <p className="font-bold text-slate-700 mt-2">¿Querés asociarlo ahora?</p>
                                            <div className="mt-4 flex flex-col gap-2">
                                                <button onClick={() => handlePropChoice('existente')} className="p-4 bg-white border-2 border-slate-100 rounded-2xl font-bold text-slate-600 hover:border-[#0055DD] hover:bg-blue-50 transition-all flex items-center gap-3"><Icon name="search" size={18}/><span className="text-xs uppercase tracking-widest">A propiedad Existente</span></button>
                                                <button onClick={() => handlePropChoice('nueva')} className="p-4 bg-white border-2 border-slate-100 rounded-2xl font-bold text-slate-600 hover:border-emerald-500 hover:bg-emerald-50 transition-all flex items-center gap-3"><Icon name="plus-circle" size={18}/><span className="text-xs uppercase tracking-widest">Crear Nueva Propiedad</span></button>
                                                <button onClick={() => handlePropChoice('saltar')} className="p-3 text-slate-400 font-bold text-[10px] uppercase tracking-widest hover:text-slate-600 mt-2">Saltar paso (Opcional)</button>
                                            </div>
                                        </div>
                                    )}

                                    {step >= 51 && userData.propChoice === 'existente' && <div className="user-bubble animate-bubble uppercase tracking-widest">Propiedad Existente</div>}
                                    {step >= 51 && userData.propChoice === 'nueva' && <div className="user-bubble animate-bubble uppercase tracking-widest">Propiedad Nueva</div>}
                                    {step >= 51 && userData.propChoice === 'saltar' && <div className="user-bubble animate-bubble uppercase tracking-widest">Omitir por ahora</div>}

                                    {step === 51 && !isTyping && (
                                        <div className="bot-bubble animate-bubble italic text-indigo-700">
                                            Por favor, ingresá la <strong>dirección o barrio</strong> para buscar la propiedad.
                                        </div>
                                    )}

                                    {step >= 52 && userData.searchTerm && <div className="user-bubble animate-bubble">{userData.searchTerm}</div>}
                                    
                                    {step === 52 && !isTyping && (
                                        <div className="bot-bubble animate-bubble">
                                            {searchResults.length === 0 ? (
                                                <p className="text-red-500 font-bold">No encontré propiedades que coincidan. Intentá de nuevo.</p>
                                            ) : (
                                                <div>
                                                    <p className="font-bold text-slate-700 mb-3">Seleccioná la correcta para asociarla al dueño:</p>
                                                    <div className="space-y-2">
                                                        {searchResults.map(p => (
                                                            <div key={p.id} onClick={() => selectProperty(p)} className="role-card group bg-indigo-50/50 border-indigo-100">
                                                                <div className="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-indigo-500 group-hover:bg-indigo-600 group-hover:text-white transition-colors"><Icon name="building" size={18}/></div>
                                                                <div className="flex-1"><p className="text-sm font-black text-slate-800">{p.address}</p><p className="text-[10px] text-slate-500 font-bold uppercase">{p.neighborhood}</p></div>
                                                                <Icon name="check-circle" size={18} className="text-slate-300 group-hover:text-indigo-600" />
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* --- RAMA INQUILINO --- */}
                                    {step === 60 && !isTyping && (
                                        <div className="bot-bubble animate-bubble">
                                            <p>Perfecto. Ya tenemos los datos del Inquilino.</p>
                                            <p className="font-bold text-slate-700 mt-2">¿Querés asociarlo a un contrato ahora o solo enviarle la invitación para su activación?</p>
                                            <div className="mt-4 flex gap-3">
                                                <button onClick={() => handleInqChoice('contrato')} className="flex-1 p-4 bg-white border-2 border-slate-100 rounded-2xl font-bold text-slate-600 hover:border-emerald-500 hover:bg-emerald-50 transition-all flex flex-col items-center gap-2"><Icon name="file-signature" size={20}/><span className="text-[10px] uppercase tracking-widest text-center leading-tight">Asociar<br/>Contrato</span></button>
                                                <button onClick={() => handleInqChoice('solo_invitar')} className="flex-1 p-4 bg-white border-2 border-slate-100 rounded-2xl font-bold text-slate-600 hover:border-[#0055DD] hover:bg-blue-50 transition-all flex flex-col items-center gap-2"><Icon name="send" size={20}/><span className="text-[10px] uppercase tracking-widest text-center leading-tight">Solo<br/>Invitar</span></button>
                                            </div>
                                        </div>
                                    )}

                                    {step >= 61 && userData.inqChoice === 'contrato' && <div className="user-bubble animate-bubble uppercase tracking-widest">Asociar Contrato</div>}
                                    {step >= 61 && userData.inqChoice === 'solo_invitar' && <div className="user-bubble animate-bubble uppercase tracking-widest">Solo Invitar</div>}

                                    {step === 61 && !isTyping && (
                                        <div className="bot-bubble animate-bubble">
                                            <p>¿El contrato es nuevo o ya lo tenés cargado en el sistema?</p>
                                            <div className="mt-4 flex gap-3">
                                                <button onClick={() => handleContractType('nuevo')} className="flex-1 p-4 bg-white border-2 border-slate-100 rounded-2xl font-bold text-slate-600 hover:border-emerald-500 hover:bg-emerald-50 transition-all flex items-center justify-center gap-2"><Icon name="plus-circle" size={18}/><span className="text-[10px] uppercase tracking-widest">Nuevo</span></button>
                                                <button onClick={() => handleContractType('existente')} className="flex-1 p-4 bg-white border-2 border-slate-100 rounded-2xl font-bold text-slate-600 hover:border-[#0055DD] hover:bg-blue-50 transition-all flex items-center justify-center gap-2"><Icon name="search" size={18}/><span className="text-[10px] uppercase tracking-widest">Existente</span></button>
                                            </div>
                                        </div>
                                    )}

                                    {step >= 62 && userData.inqContractType === 'existente' && <div className="user-bubble animate-bubble uppercase tracking-widest">Contrato Existente</div>}
                                    {step >= 62 && userData.inqContractType === 'nuevo' && <div className="user-bubble animate-bubble uppercase tracking-widest">Contrato Nuevo</div>}

                                    {step === 62 && !isTyping && (
                                        <div className="bot-bubble animate-bubble italic text-indigo-700">
                                            Por favor, ingresá alguna referencia del contrato (Dirección de la propiedad o nombre del dueño) para buscarlo.
                                        </div>
                                    )}

                                    {step >= 63 && userData.contractSearchTerm && <div className="user-bubble animate-bubble">{userData.contractSearchTerm}</div>}

                                    {step === 63 && !isTyping && (
                                        <div className="bot-bubble animate-bubble">
                                            {searchContractResults.length === 0 ? (
                                                <p className="text-red-500 font-bold">No encontré contratos. Intentá de nuevo.</p>
                                            ) : (
                                                <div>
                                                    <p className="font-bold text-slate-700 mb-3">Encontré estos contratos. Seleccioná el correcto:</p>
                                                    <div className="space-y-2">
                                                        {searchContractResults.map(c => (
                                                            <div key={c.id} onClick={() => selectContract(c)} className="role-card group bg-indigo-50/50 border-indigo-100">
                                                                <div className="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-indigo-500 group-hover:bg-indigo-600 group-hover:text-white transition-colors"><Icon name="file-text" size={18}/></div>
                                                                <div className="flex-1"><p className="text-sm font-black text-slate-800">{c.address}</p><p className="text-[10px] text-slate-500 font-bold uppercase">Dueño: {c.owner}</p></div>
                                                                <Icon name="check-circle" size={18} className="text-slate-300 group-hover:text-indigo-600" />
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* --- RESUMEN FINAL --- */}
                                    {step === 80 && !isTyping && (
                                        <div className="bot-bubble animate-bubble bg-slate-50 border-slate-200">
                                            <div className="flex items-center gap-2 mb-4 text-[#0055DD]">
                                                <Icon name="file-text" size={16} />
                                                <h4 className="font-black uppercase text-[10px] tracking-widest">Resumen de la Invitación</h4>
                                            </div>
                                            <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm space-y-3 mb-6">
                                                <div className="flex justify-between items-center"><span className="text-[10px] text-slate-400 uppercase font-black">Nombre</span><span className="text-sm font-bold text-slate-700">{userData.name} {userData.lastName}</span></div>
                                                <div className="flex justify-between items-center"><span className="text-[10px] text-slate-400 uppercase font-black">Email</span><span className="text-sm font-bold text-slate-700">{userData.email}</span></div>
                                                <div className="flex justify-between items-center"><span className="text-[10px] text-slate-400 uppercase font-black">WhatsApp</span><span className="text-sm font-bold text-slate-700">{userData.phone}</span></div>
                                                <div className="flex justify-between items-center border-t border-slate-50 pt-3"><span className="text-[10px] text-slate-400 uppercase font-black">Rol</span><span className="text-xs font-black text-indigo-600 uppercase tracking-widest">{userData.role}</span></div>
                                                
                                                {/* Datos Condicionales */}
                                                {userData.role === 'Propietario' && userData.propChoice === 'nueva' && (
                                                    <div className="flex justify-between items-center pt-2"><span className="text-[10px] text-slate-400 uppercase font-black">Acción Post-Alta</span><span className="text-[10px] font-black text-emerald-600 uppercase">Alta de Propiedad</span></div>
                                                )}
                                                {userData.role === 'Propietario' && userData.propChoice === 'existente' && userData.linkedProp && (
                                                    <div className="flex justify-between items-center pt-2"><span className="text-[10px] text-slate-400 uppercase font-black">Propiedad Asoc.</span><span className="text-[10px] font-black text-slate-800 uppercase text-right max-w-[150px] truncate">{userData.linkedProp.address}</span></div>
                                                )}
                                                {userData.role === 'Propietario' && userData.propChoice === 'saltar' && (
                                                    <div className="flex justify-between items-center pt-2"><span className="text-[10px] text-slate-400 uppercase font-black">Propiedad Asoc.</span><span className="text-[10px] font-black text-slate-500 uppercase">Ninguna por ahora</span></div>
                                                )}

                                                {userData.role === 'Inquilino' && userData.inqChoice === 'contrato' && userData.inqContractType === 'nuevo' && (
                                                    <div className="flex justify-between items-center pt-2"><span className="text-[10px] text-slate-400 uppercase font-black">Acción Post-Alta</span><span className="text-[10px] font-black text-emerald-600 uppercase">Alta de Contrato</span></div>
                                                )}
                                                {userData.role === 'Inquilino' && userData.inqChoice === 'contrato' && userData.inqContractType === 'existente' && userData.linkedContract && (
                                                    <div className="flex justify-between items-center pt-2"><span className="text-[10px] text-slate-400 uppercase font-black">Contrato Asoc.</span><span className="text-[10px] font-black text-slate-800 uppercase text-right max-w-[150px] truncate">{userData.linkedContract.address}</span></div>
                                                )}
                                                {userData.role === 'Inquilino' && userData.inqChoice === 'solo_invitar' && (
                                                    <div className="flex justify-between items-center pt-2"><span className="text-[10px] text-slate-400 uppercase font-black">Acción</span><span className="text-[10px] font-black text-slate-500 uppercase">Solo Invitación</span></div>
                                                )}
                                            </div>
                                            <div className="flex gap-3">
                                                <button onClick={confirmAndSend} className="flex-1 bg-indigo-600 text-white py-4 rounded-xl font-black text-xs uppercase tracking-widest shadow-lg shadow-indigo-100 active:scale-95 transition-all">Confirmar y Enviar</button>
                                                <button onClick={editData} className="px-6 py-4 bg-white text-slate-400 border border-slate-200 rounded-xl font-black text-xs uppercase hover:text-red-500 active:scale-95 transition-all">Editar</button>
                                            </div>
                                        </div>
                                    )}

                                    {/* ÉXITO */}
                                    {step === 90 && (
                                        <div className="space-y-6">
                                            <div className="bot-bubble animate-bubble bg-emerald-50 border-emerald-100">
                                                <div className="flex items-center gap-3 text-emerald-600 mb-2">
                                                    <Icon name="check-circle" size={24} strokeWidth={3} />
                                                    <h4 className="font-black uppercase tracking-tighter text-lg">Invitación Enviada</h4>
                                                </div>
                                                <p className="text-emerald-700 font-medium leading-relaxed">
                                                    El usuario recibirá el link para su activación biométrica.
                                                </p>
                                                {((userData.propChoice === 'nueva') || (userData.inqContractType === 'nuevo')) && (
                                                    <p className="text-emerald-800 font-black text-xs mt-3 uppercase">Redirigiendo a tu próxima acción en 5s...</p>
                                                )}
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 animate-bubble" style={{animationDelay: '0.4s'}}>
                                                <button onClick={() => { setStep(0); setUserData({ name: '', lastName: '', email: '', phone: '', role: '', propChoice: '', searchTerm: '', linkedProp: null, inqChoice: '', inqContractType: '', contractSearchTerm: '', linkedContract: null }); setCurrentSearch(''); }} className="flex flex-col items-center gap-3 p-6 bg-white border-2 border-slate-50 rounded-[2rem] hover:border-indigo-600 transition-all shadow-sm group">
                                                    <div className="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center group-hover:scale-110 transition-transform"><Icon name="user-plus" /></div>
                                                    <span className="text-[9px] font-black uppercase text-slate-500 text-center">Nuevo Usuario</span>
                                                </button>
                                                <button className="flex flex-col items-center gap-3 p-6 bg-white border-2 border-slate-50 rounded-[2rem] hover:border-[#0055DD] transition-all shadow-sm group">
                                                    <div className="w-12 h-12 bg-blue-50 text-[#0055DD] rounded-2xl flex items-center justify-center group-hover:scale-110 transition-transform"><Icon name="building-2" /></div>
                                                    <span className="text-[9px] font-black uppercase text-slate-500 text-center">Nueva Propiedad</span>
                                                </button>
                                                <button className="flex flex-col items-center gap-3 p-6 bg-white border-2 border-slate-50 rounded-[2rem] hover:border-emerald-600 transition-all shadow-sm group">
                                                    <div className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center group-hover:scale-110 transition-transform"><Icon name="file-text" /></div>
                                                    <span className="text-[9px] font-black uppercase text-slate-500 text-center">Nuevo Contrato</span>
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </React.Fragment>
                            )}

                            {isTyping && (
                                <div className="bot-bubble flex items-center gap-1.5 py-4 w-max">
                                    <div className="typing-dot"></div>
                                    <div className="typing-dot"></div>
                                    <div className="typing-dot"></div>
                                </div>
                            )}
                        </div>

                        {/* BARRA DE INPUT CONTEXTUAL */}
                        {showInput && !isMassive && (
                            <footer className="p-10 border-t border-slate-50 bg-white/80 backdrop-blur-md sticky bottom-0 z-40">
                                <div className="flex gap-4 max-w-2xl mx-auto">
                                    <input 
                                        type={step === 2 ? "email" : "text"}
                                        placeholder={
                                            step === 0 ? "Escribe su Nombre..." :
                                            step === 1 ? "Su Apellido..." :
                                            step === 2 ? "Correo Electrónico..." :
                                            step === 3 ? "Teléfono o WhatsApp..." : 
                                            (step === 51 || step === 52) ? "Ej: Caseros, Alberdi..." : 
                                            (step === 62 || step === 63) ? "Ej: Dirección o dueño..." : ""
                                        }
                                        value={
                                            step === 0 ? userData.name :
                                            step === 1 ? userData.lastName :
                                            step === 2 ? userData.email :
                                            step === 3 ? userData.phone : 
                                            (step === 51 || step === 52 || step === 62 || step === 63) ? currentSearch : ""
                                        }
                                        onChange={(e) => {
                                            const v = e.target.value;
                                            if(step === 0) setUserData({...userData, name: v});
                                            else if(step === 1) setUserData({...userData, lastName: v});
                                            else if(step === 2) setUserData({...userData, email: v});
                                            else if(step === 3) setUserData({...userData, phone: v});
                                            else if(step === 51 || step === 52 || step === 62 || step === 63) setCurrentSearch(v);
                                        }}
                                        className="input-chat shadow-inner"
                                        onKeyDown={(e) => {
                                            if (e.key === 'Enter') {
                                                if (step < 4) handleNextStep();
                                                else if (step === 51 || step === 52) executePropSearch();
                                                else if (step === 62 || step === 63) executeContractSearch();
                                            }
                                        }}
                                        autoFocus
                                    />
                                    <button 
                                        onClick={() => {
                                            if (step < 4) handleNextStep();
                                            else if (step === 51 || step === 52) executePropSearch();
                                            else if (step === 62 || step === 63) executeContractSearch();
                                        }}
                                        className="bg-indigo-600 text-white w-16 h-16 rounded-[1.5rem] flex items-center justify-center shadow-xl shadow-indigo-100 hover:bg-indigo-700 active:scale-95 transition-all shrink-0"
                                    >
                                        <Icon name={step === 51 || step === 52 || step === 62 || step === 63 ? "search" : "send"} />
                                    </button>
                                </div>
                            </footer>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BlindatoAdminApp />);
    </script>
</body>
</html>
