<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blindato Admin - Secretaría Digital Integral</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --brand-blue: #0055DD;
            --brand-dark: #0A142F;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
            color: #1e293b;
        }

        .animate-bubble { 
            animation: bubbleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
        }
        @keyframes bubbleIn { 
            from { opacity: 0; transform: translateY(15px) scale(0.95); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }

        .bot-bubble {
            @apply bg-white border border-slate-100 p-5 rounded-tr-[2rem] rounded-br-[2rem] rounded-bl-[2rem] shadow-sm max-w-[85%] text-sm font-medium leading-relaxed;
        }

        .user-bubble {
            @apply bg-[#0055DD] text-white p-5 rounded-tl-[2rem] rounded-bl-[2rem] rounded-br-[2rem] shadow-lg max-w-[80%] text-sm font-bold ml-auto;
        }

        .input-chat {
            @apply w-full bg-white border-2 border-slate-100 px-6 py-4 rounded-2xl text-base font-bold focus:ring-4 focus:ring-blue-50 focus:border-[#0055DD] outline-none transition-all;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .sidebar { background-color: #0A142F; }

        .typing-dot {
            width: 4px; height: 4px; background: #94a3b8; border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

        .role-card {
            @apply p-4 bg-white border-2 border-slate-50 rounded-2xl text-left font-bold text-slate-700 flex items-center gap-3 hover:border-[#0055DD] hover:bg-blue-50 transition-all active:scale-95 cursor-pointer;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { 
                if (window.lucide) window.lucide.createIcons(); 
            }, [name, size, className]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // Mocks Database
        const mockProps = [
            { id: 1, address: "Caseros 1230, 4B", neighborhood: "Centro" },
            { id: 2, address: "Av. Colón 450", neighborhood: "Alberdi" },
            { id: 3, address: "San Martín 22", neighborhood: "Nueva Córdoba" }
        ];

        const mockTenants = [
            { id: 1, name: "Marcos Galperin", dni: "20-30444555-9", email: "marcos@mercadolibre.com" },
            { id: 2, name: "Luis Scola", dni: "20-22333444-1", email: "luis@basketball.com" },
            { id: 3, name: "Lionel Messi", dni: "20-10222333-5", email: "lio@afa.com" }
        ];

        function BlindatoAssistantApp() {
            /* ESTADOS DE PASOS:
               -1: Menú Principal
               -- Flujo Usuario --
               0-3: Datos personales (Nombre, Apellido, Email, Teléfono)
               4: Selección de Rol
               5: Resumen Usuario
               6: Éxito Usuario
               -- Flujo Propiedad --
               53: Dirección Propiedad
               54: Tarjeta Geolocalizada / Extras
               55: Resumen Propiedad
               56: Éxito Propiedad
               -- Flujo Contrato --
               100: Buscar Propiedad
               101: Resultados Propiedad
               102: Buscar Inquilino
               103: Resultados Inquilino
               104: Monto de Alquiler
               105: Resumen Contrato
               106: Éxito Contrato
            */
            const [step, setStep] = useState(-1);
            const [returnToStep, setReturnToStep] = useState(null); // Para anidar flujos
            const [isTyping, setIsTyping] = useState(false);
            
            // Datos de Flujos
            const [userData, setUserData] = useState({ name: '', lastName: '', email: '', phone: '', role: '' });
            const [propData, setPropData] = useState({ newPropAddress: '', newPropExtras: '' });
            const [contractData, setContractData] = useState({ 
                propSearch: '', linkedProp: null, 
                tenantSearch: '', linkedTenant: null, 
                rentAmount: '' 
            });

            // Resultados de Búsqueda
            const [searchResultsProp, setSearchResultsProp] = useState([]);
            const [searchResultsTenant, setSearchResultsTenant] = useState([]);

            const scrollRef = useRef(null);

            const formatCurrency = (val) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(val);

            // Helpers de Navegación del Chat
            const typeAndGo = (nextStep, delay = 800) => {
                setIsTyping(true);
                setTimeout(() => {
                    setIsTyping(false);
                    setStep(nextStep);
                }, delay);
            };

            const resetAll = () => {
                setUserData({ name: '', lastName: '', email: '', phone: '', role: '' });
                setPropData({ newPropAddress: '', newPropExtras: '' });
                setContractData({ propSearch: '', linkedProp: null, tenantSearch: '', linkedTenant: null, rentAmount: '' });
                setReturnToStep(null);
                setStep(-1);
            };

            // --- LÓGICA DE FLUJOS ---

            const handleNextStep = () => {
                // Validación User Flow
                if (step === 0 && !userData.name.trim()) return;
                if (step === 1 && !userData.lastName.trim()) return;
                if (step === 2 && !userData.email.trim()) return;
                if (step === 3 && !userData.phone.trim()) return;
                
                // Validación Prop Flow
                if (step === 53 && !propData.newPropAddress.trim()) return;

                // Validación Contract Flow
                if (step === 100 && !contractData.propSearch.trim()) return;
                if (step === 102 && !contractData.tenantSearch.trim()) return;
                if (step === 104 && !contractData.rentAmount.trim()) return;

                setIsTyping(true);
                setTimeout(() => {
                    setIsTyping(false);
                    // Lógica de avance
                    if (step === 0) setStep(1);
                    else if (step === 1) setStep(2);
                    else if (step === 2) setStep(3);
                    else if (step === 3) {
                        if (returnToStep) setStep(5); // Si vengo del contrato, salto el rol
                        else setStep(4);
                    }
                    // Props
                    else if (step === 53) setStep(54);
                    // Contracts
                    else if (step === 100) executePropSearch();
                    else if (step === 102) executeTenantSearch();
                    else if (step === 104) setStep(105);
                }, 800);
            };

            // Búsqueda de Propiedades
            const executePropSearch = () => {
                const term = contractData.propSearch.toLowerCase().trim();
                const results = mockProps.filter(p => p.address.toLowerCase().includes(term) || p.neighborhood.toLowerCase().includes(term));
                setSearchResultsProp(results);
                setStep(101);
            };

            // Búsqueda de Inquilinos
            const executeTenantSearch = () => {
                const term = contractData.tenantSearch.toLowerCase().trim();
                const results = mockTenants.filter(t => t.name.toLowerCase().includes(term) || t.dni.includes(term) || t.email.toLowerCase().includes(term));
                setSearchResultsTenant(results);
                setStep(103);
            };

            // Selecciones en Contrato
            const selectContractProp = (prop) => {
                setContractData({ ...contractData, linkedProp: prop });
                typeAndGo(102);
            };

            const selectContractTenant = (tenant) => {
                setContractData({ ...contractData, linkedTenant: tenant });
                typeAndGo(104);
            };

            // Anidación: Crear desde Contrato
            const createPropForContract = () => {
                setReturnToStep(102); // Volver al contrato paso inquilino
                typeAndGo(53);
            };

            const createTenantForContract = () => {
                setReturnToStep(104); // Volver al contrato paso monto
                setUserData({ ...userData, role: 'Inquilino' });
                typeAndGo(0);
            };

            // Confirmaciones
            const confirmProp = () => {
                const newProp = { id: 99, address: propData.newPropAddress, neighborhood: "Cargada Manualmente" };
                if (returnToStep === 102) {
                    setContractData({ ...contractData, linkedProp: newProp });
                    setReturnToStep(null);
                    typeAndGo(102);
                } else {
                    typeAndGo(56);
                }
            };

            const confirmUser = () => {
                typeAndGo(6);
            };

            const confirmContract = () => {
                typeAndGo(106, 1500);
            };

            // Post-Éxito Usuario (Para volver al contrato si aplica)
            const handlePostUserSuccess = () => {
                if (returnToStep === 104) {
                    const newUser = { id: 99, name: `${userData.name} ${userData.lastName}`, email: userData.email, dni: "Pendiente KYC" };
                    setContractData({ ...contractData, linkedTenant: newUser });
                    setReturnToStep(null);
                    typeAndGo(104);
                } else {
                    resetAll();
                }
            };

            // Auto-scroll
            useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [step, isTyping, searchResultsProp, searchResultsTenant]);

            const showInput = [0, 1, 2, 3, 53, 100, 102, 104].includes(step) && !isTyping;

            // Determinar placeholder
            const getPlaceholder = () => {
                if (step === 0) return "Ej: Marcos";
                if (step === 1) return "Ej: Galperin";
                if (step === 2) return "correo@ejemplo.com";
                if (step === 3) return "Ej: +54 9 11 1234-5678";
                if (step === 53) return "Dirección de la propiedad...";
                if (step === 100) return "Busca por calle o barrio...";
                if (step === 102) return "Nombre, DNI o Email...";
                if (step === 104) return "Ej: 450000";
                return "Escribe aquí...";
            };

            const getInputValue = () => {
                if (step === 0) return userData.name;
                if (step === 1) return userData.lastName;
                if (step === 2) return userData.email;
                if (step === 3) return userData.phone;
                if (step === 53) return propData.newPropAddress;
                if (step === 100) return contractData.propSearch;
                if (step === 102) return contractData.tenantSearch;
                if (step === 104) return contractData.rentAmount;
                return "";
            };

            const handleInputChange = (e) => {
                const v = e.target.value;
                if (step === 0) setUserData({...userData, name: v});
                else if (step === 1) setUserData({...userData, lastName: v});
                else if (step === 2) setUserData({...userData, email: v});
                else if (step === 3) setUserData({...userData, phone: v});
                else if (step === 53) setPropData({...propData, newPropAddress: v});
                else if (step === 100) setContractData({...contractData, propSearch: v});
                else if (step === 102) setContractData({...contractData, tenantSearch: v});
                else if (step === 104) setContractData({...contractData, rentAmount: v});
            };

            // --- VISTAS GLOBALES ---
            return (
                <div className="flex min-h-screen w-full relative overflow-hidden bg-[#F8FAFC]">
                    
                    {/* BARRA LATERAL */}
                    <aside className="w-24 sidebar text-white flex flex-col items-center py-8 gap-10 border-r border-slate-800 h-screen fixed left-0 top-0 z-50 shadow-2xl">
                        <div className="w-12 h-12 bg-indigo-500 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-lg">B</div>
                        <nav className="flex flex-col gap-8 text-slate-500">
                            <div className="p-3 hover:text-white transition-colors cursor-pointer"><Icon name="layout-grid" size={24} /></div>
                            <div className="p-3 bg-indigo-500/10 text-indigo-400 rounded-xl cursor-pointer"><Icon name="sparkles" size={24} /></div>
                            <div className="p-3 hover:text-white transition-colors cursor-pointer"><Icon name="building" size={24} /></div>
                            <div className="p-3 hover:text-white transition-colors cursor-pointer"><Icon name="wallet" size={24} /></div>
                        </nav>
                    </aside>
                    
                    <main className="flex-1 flex flex-col ml-24 h-screen max-w-4xl mx-auto relative border-x border-slate-100 bg-white shadow-sm">
                        
                        {/* HEADER */}
                        <header className="p-6 border-b border-slate-50 flex justify-between items-center bg-white sticky top-0 z-40">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-[#0055DD] shadow-inner">
                                    <Icon name="sparkles" size={20} />
                                </div>
                                <div>
                                    <h2 className="text-sm font-black uppercase tracking-widest text-slate-800 leading-none italic">Secretaría Digital</h2>
                                    <p className="text-[10px] text-emerald-500 font-bold uppercase mt-1">Conectado • Asistente AI</p>
                                </div>
                            </div>
                            <button onClick={resetAll} className="bg-slate-50 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-indigo-600 transition-all flex items-center gap-2">
                                <Icon name="rotate-ccw" size={14}/> Reiniciar
                            </button>
                        </header>

                        {/* CHAT AREA */}
                        <div ref={scrollRef} className="flex-1 overflow-y-auto p-8 space-y-8 no-scrollbar pb-48">
                            
                            {/* --- MENÚ PRINCIPAL --- */}
                            {step === -1 && !isTyping && (
                                <div className="bot-bubble animate-bubble">
                                    <p>¡Hola! Soy tu asistente de Blindato.</p>
                                    <p className="mt-2 text-indigo-500 font-bold italic">¿En qué te puedo ayudar hoy?</p>
                                    <div className="mt-6 flex flex-col gap-3">
                                        <button onClick={() => typeAndGo(100)} className="role-card group">
                                            <div className="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition-all"><Icon name="file-signature" size={18}/></div>
                                            <div className="flex-1"><p className="text-xs font-black uppercase tracking-widest">Alta de Contrato</p><p className="text-[9px] text-slate-400 font-medium uppercase mt-1">Vincular propiedad e inquilino</p></div>
                                            <Icon name="chevron-right" size={16} className="text-slate-200 group-hover:text-indigo-400" />
                                        </button>
                                        <button onClick={() => typeAndGo(0)} className="role-card group">
                                            <div className="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center group-hover:bg-emerald-600 group-hover:text-white transition-all"><Icon name="user-plus" size={18}/></div>
                                            <div className="flex-1"><p className="text-xs font-black uppercase tracking-widest">Nuevo Usuario</p><p className="text-[9px] text-slate-400 font-medium uppercase mt-1">Inquilino o Propietario</p></div>
                                            <Icon name="chevron-right" size={16} className="text-slate-200 group-hover:text-emerald-400" />
                                        </button>
                                        <button onClick={() => typeAndGo(53)} className="role-card group">
                                            <div className="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-all"><Icon name="building-2" size={18}/></div>
                                            <div className="flex-1"><p className="text-xs font-black uppercase tracking-widest">Nueva Propiedad</p><p className="text-[9px] text-slate-400 font-medium uppercase mt-1">Cargar y geolocalizar activo</p></div>
                                            <Icon name="chevron-right" size={16} className="text-slate-200 group-hover:text-blue-400" />
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* --- FLUJO: ALTA DE CONTRATO (100+) --- */}
                            {step >= 100 && <div className="user-bubble animate-bubble uppercase tracking-widest">Alta de Contrato</div>}
                            
                            {step === 100 && !isTyping && (
                                <div className="bot-bubble animate-bubble italic text-indigo-700">
                                    Vamos a armar un nuevo contrato. Primero, ingresá la <strong>dirección o barrio</strong> de la propiedad a alquilar.
                                </div>
                            )}

                            {step >= 101 && <div className="user-bubble animate-bubble">{contractData.propSearch}</div>}

                            {step === 101 && !isTyping && (
                                <div className="bot-bubble animate-bubble">
                                    {searchResultsProp.length > 0 ? (
                                        <>
                                            <p className="font-bold text-slate-700 mb-4">Encontré estas propiedades. Seleccioná la correcta:</p>
                                            <div className="space-y-2 mb-4">
                                                {searchResultsProp.map(p => (
                                                    <div key={p.id} onClick={() => selectContractProp(p)} className="role-card group bg-indigo-50/50 border-indigo-100">
                                                        <div className="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-indigo-500 group-hover:bg-indigo-600 group-hover:text-white transition-colors"><Icon name="building" size={18}/></div>
                                                        <div className="flex-1"><p className="text-sm font-black text-slate-800">{p.address}</p><p className="text-[10px] text-slate-500 font-bold uppercase">{p.neighborhood}</p></div>
                                                        <Icon name="check-circle" size={18} className="text-slate-300 group-hover:text-indigo-600" />
                                                    </div>
                                                ))}
                                            </div>
                                            <p className="text-xs text-slate-500 mb-2">¿No está en la lista?</p>
                                        </>
                                    ) : (
                                        <p className="font-bold text-red-500 mb-4">No encontré propiedades con ese nombre en tu base.</p>
                                    )}
                                    <button onClick={createPropForContract} className="w-full p-4 bg-white border-2 border-dashed border-indigo-200 rounded-2xl text-indigo-600 font-bold text-xs uppercase hover:bg-indigo-50 transition-colors flex justify-center items-center gap-2">
                                        <Icon name="plus-circle" size={16} /> Cargar Nueva Propiedad
                                    </button>
                                </div>
                            )}

                            {step >= 102 && contractData.linkedProp && (
                                <div className="bot-bubble animate-bubble bg-emerald-50 border-emerald-100 flex items-center gap-3">
                                    <Icon name="building" className="text-emerald-500" />
                                    <span className="font-black text-emerald-800 text-sm">{contractData.linkedProp.address}</span>
                                </div>
                            )}

                            {step === 102 && !isTyping && (
                                <div className="bot-bubble animate-bubble italic text-indigo-700">
                                    Excelente. Ahora, ingresá el <strong>Nombre, DNI o Email</strong> del futuro inquilino para buscarlo.
                                </div>
                            )}

                            {step >= 103 && <div className="user-bubble animate-bubble">{contractData.tenantSearch}</div>}

                            {step === 103 && !isTyping && (
                                <div className="bot-bubble animate-bubble">
                                    {searchResultsTenant.length > 0 ? (
                                        <>
                                            <p className="font-bold text-slate-700 mb-4">Encontré estos inquilinos. Seleccioná al correcto:</p>
                                            <div className="space-y-2 mb-4">
                                                {searchResultsTenant.map(t => (
                                                    <div key={t.id} onClick={() => selectContractTenant(t)} className="role-card group bg-indigo-50/50 border-indigo-100">
                                                        <div className="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-indigo-500 group-hover:bg-indigo-600 group-hover:text-white transition-colors"><Icon name="user" size={18}/></div>
                                                        <div className="flex-1"><p className="text-sm font-black text-slate-800">{t.name}</p><p className="text-[10px] text-slate-500 font-bold uppercase">{t.dni} • {t.email}</p></div>
                                                        <Icon name="check-circle" size={18} className="text-slate-300 group-hover:text-indigo-600" />
                                                    </div>
                                                ))}
                                            </div>
                                            <p className="text-xs text-slate-500 mb-2">¿No está en la lista?</p>
                                        </>
                                    ) : (
                                        <p className="font-bold text-red-500 mb-4">No encontré inquilinos con ese dato.</p>
                                    )}
                                    <button onClick={createTenantForContract} className="w-full p-4 bg-white border-2 border-dashed border-indigo-200 rounded-2xl text-indigo-600 font-bold text-xs uppercase hover:bg-indigo-50 transition-colors flex justify-center items-center gap-2">
                                        <Icon name="user-plus" size={16} /> Cargar Nuevo Inquilino
                                    </button>
                                </div>
                            )}

                            {step >= 104 && contractData.linkedTenant && (
                                <div className="bot-bubble animate-bubble bg-emerald-50 border-emerald-100 flex items-center gap-3">
                                    <Icon name="user-check" className="text-emerald-500" />
                                    <div>
                                        <span className="font-black text-emerald-800 text-sm block">{contractData.linkedTenant.name}</span>
                                        <span className="font-bold text-emerald-600 text-[10px]">{contractData.linkedTenant.email}</span>
                                    </div>
                                </div>
                            )}

                            {step === 104 && !isTyping && (
                                <div className="bot-bubble animate-bubble italic text-indigo-700">
                                    Por último, ¿cuál será el <strong>monto mensual</strong> del alquiler?
                                </div>
                            )}

                            {step >= 105 && contractData.rentAmount && <div className="user-bubble animate-bubble">${contractData.rentAmount}</div>}

                            {step === 105 && !isTyping && (
                                <div className="bot-bubble animate-bubble bg-slate-50 border-slate-200">
                                    <div className="flex items-center gap-2 mb-4 text-[#0055DD]">
                                        <Icon name="file-text" size={16} />
                                        <h4 className="font-black uppercase text-[10px] tracking-widest">Resumen del Contrato</h4>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm space-y-3 mb-6">
                                        <div className="flex justify-between items-center"><span className="text-[10px] text-slate-400 uppercase font-black">Propiedad</span><span className="text-xs font-bold text-slate-700 text-right max-w-[150px] truncate">{contractData.linkedProp?.address}</span></div>
                                        <div className="flex justify-between items-center"><span className="text-[10px] text-slate-400 uppercase font-black">Inquilino</span><span className="text-xs font-bold text-slate-700 text-right">{contractData.linkedTenant?.name}</span></div>
                                        <div className="flex justify-between items-center border-t border-slate-50 pt-3"><span className="text-[10px] text-slate-400 uppercase font-black">Monto Mensual</span><span className="text-sm font-black text-emerald-600">{formatCurrency(contractData.rentAmount)}</span></div>
                                    </div>
                                    <div className="flex gap-3">
                                        <button onClick={confirmContract} className="flex-1 bg-indigo-600 text-white py-4 rounded-xl font-black text-xs uppercase tracking-widest shadow-lg shadow-indigo-100 active:scale-95 transition-all">Confirmar y Compartir</button>
                                        <button onClick={() => typeAndGo(100)} className="px-6 py-4 bg-white text-slate-400 border border-slate-200 rounded-xl font-black text-xs uppercase hover:text-red-500 active:scale-95 transition-all">Editar</button>
                                    </div>
                                </div>
                            )}

                            {step === 106 && (
                                <div className="space-y-6">
                                    <div className="bot-bubble animate-bubble bg-emerald-50 border-emerald-100">
                                        <div className="flex items-center gap-3 text-emerald-600 mb-2">
                                            <Icon name="check-circle" size={24} strokeWidth={3} />
                                            <h4 className="font-black uppercase tracking-tighter text-lg">Contrato Generado</h4>
                                        </div>
                                        <p className="text-emerald-700 font-medium leading-relaxed mb-4">
                                            El contrato fue creado exitosamente. Se ha notificado al inquilino <strong>{contractData.linkedTenant?.name}</strong> y al propietario para que comiencen el proceso de firma digital.
                                        </p>
                                        <button onClick={() => alert("Link Compartido por WhatsApp")} className="w-full bg-emerald-500 text-slate-900 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest flex items-center justify-center gap-2 shadow-lg shadow-emerald-200 hover:bg-emerald-400 transition-colors">
                                            <Icon name="share-2" size={16} /> Compartir Link a Partes
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4 animate-bubble" style={{animationDelay: '0.4s'}}>
                                        <button onClick={() => resetAll()} className="flex items-center gap-3 p-4 bg-white border border-slate-100 rounded-2xl hover:border-indigo-500 transition-all shadow-sm group">
                                            <div className="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform"><Icon name="file-signature" size={18}/></div>
                                            <span className="text-[10px] font-black uppercase text-slate-600 leading-tight text-left">Nuevo<br/>Contrato</span>
                                        </button>
                                        <button onClick={() => { resetAll(); typeAndGo(53); }} className="flex items-center gap-3 p-4 bg-white border border-slate-100 rounded-2xl hover:border-blue-500 transition-all shadow-sm group">
                                            <div className="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform"><Icon name="building-2" size={18}/></div>
                                            <span className="text-[10px] font-black uppercase text-slate-600 leading-tight text-left">Nueva<br/>Propiedad</span>
                                        </button>
                                        <button onClick={() => { resetAll(); typeAndGo(0); }} className="flex items-center gap-3 p-4 bg-white border border-slate-100 rounded-2xl hover:border-emerald-500 transition-all shadow-sm group">
                                            <div className="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform"><Icon name="user-plus" size={18}/></div>
                                            <span className="text-[10px] font-black uppercase text-slate-600 leading-tight text-left">Nuevo<br/>Usuario</span>
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* --- FLUJO: ALTA DE USUARIO (0-6) --- */}
                            {step >= 0 && step <= 6 && (
                                <React.Fragment>
                                    {step >= 1 && <div className="user-bubble animate-bubble">{userData.name}</div>}
                                    {step === 1 && !isTyping && <div className="bot-bubble animate-bubble italic">¿Y su apellido?</div>}
                                    
                                    {step >= 2 && <div className="user-bubble animate-bubble">{userData.lastName}</div>}
                                    {step === 2 && !isTyping && <div className="bot-bubble animate-bubble">Perfecto. ¿Cuál es su correo electrónico?</div>}
                                    
                                    {step >= 3 && <div className="user-bubble animate-bubble">{userData.email}</div>}
                                    {step === 3 && !isTyping && <div className="bot-bubble animate-bubble">¿A qué teléfono o WhatsApp enviamos la invitación?</div>}
                                    
                                    {step >= 4 && <div className="user-bubble animate-bubble">{userData.phone}</div>}
                                    {step === 4 && !isTyping && !returnToStep && (
                                        <div className="bot-bubble animate-bubble">
                                            <p>Excelente. Ahora selecciona el rol para <strong>{userData.name}</strong>:</p>
                                            <div className="mt-6 flex flex-col gap-3">
                                                {['Inquilino', 'Propietario', 'Administrador'].map(r => (
                                                    <button key={r} onClick={() => { setUserData({...userData, role: r}); typeAndGo(5); }} className="role-card group">
                                                        <div className="w-10 h-10 bg-slate-50 rounded-xl flex items-center justify-center text-slate-400 group-hover:bg-[#0055DD] group-hover:text-white transition-all"><Icon name={r === 'Inquilino' ? 'user' : r === 'Propietario' ? 'shield' : 'building'} size={18}/></div>
                                                        <div className="flex-1"><p className="text-xs font-black uppercase tracking-widest">{r}</p></div>
                                                        <Icon name="chevron-right" size={16} className="text-slate-200" />
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {step >= 5 && <div className="user-bubble animate-bubble uppercase tracking-widest">{userData.role}</div>}
                                    {step === 5 && !isTyping && (
                                        <div className="bot-bubble animate-bubble bg-slate-50 border-slate-200">
                                            <div className="flex items-center gap-2 mb-4 text-[#0055DD]"><Icon name="file-text" size={16} /><h4 className="font-black uppercase text-[10px] tracking-widest">Resumen de Invitación</h4></div>
                                            <div className="bg-white p-5 rounded-2xl shadow-sm space-y-3 mb-6">
                                                <div className="flex justify-between items-center"><span className="text-[10px] text-slate-400 uppercase font-black">Nombre</span><span className="text-sm font-bold text-slate-700">{userData.name} {userData.lastName}</span></div>
                                                <div className="flex justify-between items-center"><span className="text-[10px] text-slate-400 uppercase font-black">Email</span><span className="text-sm font-bold text-slate-700">{userData.email}</span></div>
                                                <div className="flex justify-between items-center border-t border-slate-50 pt-3"><span className="text-[10px] text-slate-400 uppercase font-black">Rol</span><span className="text-xs font-black text-indigo-600 uppercase tracking-widest">{userData.role}</span></div>
                                            </div>
                                            <button onClick={confirmUser} className="w-full bg-indigo-600 text-white py-4 rounded-xl font-black text-xs uppercase tracking-widest shadow-lg shadow-indigo-100 active:scale-95">Confirmar y Enviar</button>
                                        </div>
                                    )}

                                    {step === 6 && (
                                        <div className="space-y-6">
                                            <div className="bot-bubble animate-bubble bg-emerald-50 border-emerald-100">
                                                <div className="flex items-center gap-3 text-emerald-600 mb-2"><Icon name="check-circle" size={24} strokeWidth={3} /><h4 className="font-black uppercase tracking-tighter text-lg">Usuario Invitado</h4></div>
                                                <p className="text-emerald-700 font-medium leading-relaxed mb-4">El usuario recibirá un link para validar su identidad.</p>
                                                {returnToStep === 104 ? (
                                                    <button onClick={handlePostUserSuccess} className="w-full bg-emerald-600 text-white py-3 rounded-xl font-black text-[10px] uppercase shadow-md flex items-center justify-center gap-2"><Icon name="arrow-right" size={14} /> VOLVER AL CONTRATO</button>
                                                ) : (
                                                    <button onClick={resetAll} className="w-full bg-white text-emerald-700 border border-emerald-200 py-3 rounded-xl font-black text-[10px] uppercase">Finalizar</button>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </React.Fragment>
                            )}

                            {/* --- FLUJO: ALTA DE PROPIEDAD (53-56) --- */}
                            {step >= 53 && step <= 56 && (
                                <React.Fragment>
                                    {step === 53 && !isTyping && <div className="bot-bubble animate-bubble italic text-indigo-700">Por favor, ingresá la <strong>dirección exacta</strong> del nuevo inmueble.</div>}
                                    {step >= 54 && <div className="user-bubble animate-bubble">{propData.newPropAddress}</div>}
                                    
                                    {step === 54 && !isTyping && (
                                        <div className="bot-bubble animate-bubble space-y-4">
                                            <p>¡Excelente! Encontré la ubicación por Google Maps:</p>
                                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                                                <div className="aspect-video bg-slate-200 rounded-xl mb-3 overflow-hidden relative">
                                                    <img src="https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=500&q=80" alt="Propiedad" className="w-full h-full object-cover" />
                                                    <div className="absolute top-2 left-2 bg-black/60 text-white text-[9px] px-2 py-1 rounded-md flex items-center gap-1 backdrop-blur-md font-bold uppercase"><Icon name="map-pin" size={10} /> Geolocalizado</div>
                                                </div>
                                                <p className="font-black text-slate-800 text-sm leading-tight">{propData.newPropAddress}</p>
                                            </div>
                                            <p className="font-bold text-slate-700 pt-2">¿Querés agregar alguna característica extra? (Ej: "Con cochera").</p>
                                            <button onClick={() => { setPropData({...propData, newPropExtras: 'Sin extras'}); typeAndGo(55); }} className="w-full py-3 bg-slate-50 text-slate-500 rounded-xl font-bold text-xs uppercase hover:bg-slate-100 transition-colors">No, continuar así</button>
                                        </div>
                                    )}

                                    {step >= 55 && propData.newPropExtras && propData.newPropExtras !== 'Sin extras' && <div className="user-bubble animate-bubble">{propData.newPropExtras}</div>}
                                    
                                    {step === 55 && !isTyping && (
                                        <div className="bot-bubble animate-bubble bg-slate-50 border-slate-200">
                                            <p className="mb-4 font-bold text-slate-800 uppercase text-[10px] tracking-widest">Resumen de Propiedad</p>
                                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-4">
                                                <p className="font-black text-sm text-slate-800 mb-1">{propData.newPropAddress}</p>
                                                <p className="text-[10px] text-slate-500 font-bold uppercase">Extras: {propData.newPropExtras}</p>
                                            </div>
                                            <button onClick={confirmProp} className="w-full bg-indigo-600 text-white py-4 rounded-xl font-black text-xs uppercase tracking-widest shadow-lg shadow-indigo-100 active:scale-95">Confirmar Propiedad</button>
                                        </div>
                                    )}

                                    {step === 56 && (
                                        <div className="bot-bubble animate-bubble bg-emerald-50 border-emerald-100">
                                            <div className="flex items-center gap-3 text-emerald-600 mb-4"><Icon name="check-circle" size={24} strokeWidth={3} /><h4 className="font-black uppercase tracking-tighter text-lg">Propiedad Guardada</h4></div>
                                            <button onClick={resetAll} className="w-full bg-white text-emerald-700 border border-emerald-200 py-3 rounded-xl font-black text-[10px] uppercase">Finalizar y volver al menú</button>
                                        </div>
                                    )}
                                </React.Fragment>
                            )}

                            {/* Indicador de escritura */}
                            {isTyping && (
                                <div className="bot-bubble flex items-center gap-1.5 py-4 w-max">
                                    <div className="typing-dot"></div><div className="typing-dot"></div><div className="typing-dot"></div>
                                </div>
                            )}
                        </div>

                        {/* ÁREA DE INPUT CONTEXTUAL */}
                        {showInput && (
                            <footer className="p-10 border-t border-slate-50 bg-white/80 backdrop-blur-md sticky bottom-0 z-40">
                                <div className="flex gap-4 max-w-2xl mx-auto">
                                    <input 
                                        type={step === 2 ? "email" : (step === 104 ? "number" : "text")}
                                        placeholder={getPlaceholder()}
                                        value={getInputValue()}
                                        onChange={handleInputChange}
                                        className="input-chat shadow-inner"
                                        onKeyDown={(e) => {
                                            if (e.key === 'Enter') handleNextStep();
                                        }}
                                        autoFocus
                                    />
                                    <button 
                                        onClick={handleNextStep}
                                        className="bg-indigo-600 text-white w-16 h-16 rounded-[1.5rem] flex items-center justify-center shadow-xl shadow-indigo-100 hover:bg-indigo-700 active:scale-95 transition-all shrink-0"
                                    >
                                        <Icon name={step === 100 || step === 102 ? "search" : "send"} />
                                    </button>
                                </div>
                            </footer>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BlindatoAssistantApp />);
    </script>
</body>
</html>
