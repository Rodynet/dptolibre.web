<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DptoLibre Admin - Secretaría Digital Integral</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --brand-blue: #0055DD;
            --brand-dark: #0D1B4B;
            --brand-cyan: #00D1FF;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #E8EAF0;
            color: #1e293b;
        }

        .animate-bubble { 
            animation: bubbleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
        }
        @keyframes bubbleIn { 
            from { opacity: 0; transform: translateY(15px) scale(0.95); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }

        .bot-bubble {
            @apply bg-white border border-slate-100 p-5 rounded-tr-[2rem] rounded-br-[2rem] rounded-bl-[2rem] shadow-sm max-w-[85%] text-sm font-medium leading-relaxed;
        }

        .user-bubble {
            @apply bg-[#0055DD] text-white p-5 rounded-tl-[2rem] rounded-bl-[2rem] rounded-br-[2rem] shadow-lg max-w-[80%] text-sm font-bold ml-auto;
        }

        .input-chat {
            @apply w-full bg-white border-2 border-slate-100 px-6 py-4 rounded-2xl text-base font-bold focus:ring-4 focus:ring-blue-50 focus:border-[#0055DD] outline-none transition-all;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .sidebar { background-color: var(--brand-dark); }

        .typing-dot {
            width: 4px; height: 4px; background: #94a3b8; border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

        .role-card {
            @apply p-4 bg-white border-2 border-slate-50 rounded-2xl text-left font-bold text-slate-700 flex items-center gap-3 hover:border-[#0055DD] hover:bg-blue-50 transition-all active:scale-95 cursor-pointer;
        }

        .config-card {
            @apply mt-4 p-5 bg-slate-50 rounded-2xl border border-slate-200 text-slate-800;
        }

        .chip {
            @apply px-3 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wider cursor-pointer border transition-colors;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { 
                if (window.lucide) window.lucide.createIcons(); 
            }, [name, size, className]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // Mocks Database
        const mockProps = [
            { id: 1, address: "Caseros 1230, 4B", neighborhood: "Centro" },
            { id: 2, address: "Av. Colón 450", neighborhood: "Alberdi" },
            { id: 3, address: "San Martín 22", neighborhood: "Nueva Córdoba" }
        ];

        const mockTenants = [
            { id: 1, name: "Marcos Galperin", dni: "20-30444555-9", email: "marcos@mercadolibre.com" },
            { id: 2, name: "Luis Scola", dni: "20-22333444-1", email: "luis@basketball.com" }
        ];

        function DptoLibreAssistantApp() {
            const [step, setStep] = useState(-1);
            const [returnToStep, setReturnToStep] = useState(null); 
            const [isTyping, setIsTyping] = useState(false);
            
            // Datos de Flujos
            const [userData, setUserData] = useState({ name: '', lastName: '', email: '', phone: '', role: '' });
            const [propData, setPropData] = useState({ newPropAddress: '', newPropExtras: '' });
            
            // CONTRATO DATA EXPANDIDO
            const [contractData, setContractData] = useState({ 
                propSearch: '', linkedProp: null, 
                tenantSearch: '', linkedTenant: null, 
                // Financiero
                amount: '450000', currency: 'ARS', updateFreq: 'Trimestral', updateIndex: 'IPC',
                financialSummary: '',
                // Fechas
                startDate: '', duration: 24, dueDay: 10, lateFee: 0.5,
                datesSummary: '',
                // Servicios y Gastos
                tenantServices: ['Luz', 'Gas', 'Agua'], expensesPayer: 'Inquilino', inventory: '', commission: '',
                servicesSummary: '',
                // Preferencias
                useDptoLibreContract: true, enableTickets: true,
                prefsSummary: ''
            });

            // Resultados de Búsqueda
            const [searchResultsProp, setSearchResultsProp] = useState([]);
            const [searchResultsTenant, setSearchResultsTenant] = useState([]);

            const scrollRef = useRef(null);
            const formatCurrency = (val, cur) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: cur || 'ARS', maximumFractionDigits: 0 }).format(val);

            // Helpers de Navegación del Chat
            const typeAndGo = (nextStep, delay = 800) => {
                setIsTyping(true);
                setTimeout(() => {
                    setIsTyping(false);
                    setStep(nextStep);
                }, delay);
            };

            const resetAll = () => {
                setUserData({ name: '', lastName: '', email: '', phone: '', role: '' });
                setPropData({ newPropAddress: '', newPropExtras: '' });
                setContractData({ propSearch: '', linkedProp: null, tenantSearch: '', linkedTenant: null, amount: '450000', currency: 'ARS', updateFreq: 'Trimestral', updateIndex: 'IPC', startDate: '', duration: 24, dueDay: 10, lateFee: 0.5, tenantServices: ['Luz', 'Gas', 'Agua'], expensesPayer: 'Inquilino', inventory: '', commission: '', useDptoLibreContract: true, enableTickets: true, financialSummary: '', datesSummary: '', servicesSummary: '', prefsSummary: '' });
                setReturnToStep(null);
                setStep(-1);
            };

            // --- LÓGICA DE FLUJOS ---

            const handleNextStep = () => {
                if (step === 0 && !userData.name.trim()) return;
                if (step === 1 && !userData.lastName.trim()) return;
                if (step === 2 && !userData.email.trim()) return;
                if (step === 3 && !userData.phone.trim()) return;
                if (step === 53 && !propData.newPropAddress.trim()) return;
                if (step === 100 && !contractData.propSearch.trim()) return;
                if (step === 102 && !contractData.tenantSearch.trim()) return;

                setIsTyping(true);
                setTimeout(() => {
                    setIsTyping(false);
                    if (step === 0) setStep(1);
                    else if (step === 1) setStep(2);
                    else if (step === 2) setStep(3);
                    else if (step === 3) {
                        if (returnToStep) setStep(5);
                        else setStep(4);
                    }
                    else if (step === 53) setStep(54);
                    else if (step === 100) executePropSearch();
                    else if (step === 102) executeTenantSearch();
                }, 800);
            };

            // Búsquedas
            const executePropSearch = () => {
                const term = contractData.propSearch.toLowerCase().trim();
                const results = mockProps.filter(p => p.address.toLowerCase().includes(term) || p.neighborhood.toLowerCase().includes(term));
                setSearchResultsProp(results);
                setStep(101);
            };

            const executeTenantSearch = () => {
                const term = contractData.tenantSearch.toLowerCase().trim();
                const results = mockTenants.filter(t => t.name.toLowerCase().includes(term) || t.dni.includes(term) || t.email.toLowerCase().includes(term));
                setSearchResultsTenant(results);
                setStep(103);
            };

            // Selecciones
            const selectContractProp = (prop) => {
                setContractData({ ...contractData, linkedProp: prop });
                typeAndGo(102);
            };

            const selectContractTenant = (tenant) => {
                setContractData({ ...contractData, linkedTenant: tenant });
                typeAndGo(104);
            };

            // Submit de Cards de Contrato
            const submitFinancial = () => {
                const sum = `${formatCurrency(contractData.amount, contractData.currency)} | Act. ${contractData.updateFreq} por ${contractData.updateIndex}`;
                setContractData({...contractData, financialSummary: sum});
                typeAndGo(105);
            };

            const submitDates = () => {
                const start = contractData.startDate ? new Date(contractData.startDate).toLocaleDateString() : 'A definir';
                const sum = `Inicio: ${start} | ${contractData.duration} meses | Vence día ${contractData.dueDay} (Punitorio ${contractData.lateFee}%)`;
                setContractData({...contractData, datesSummary: sum});
                typeAndGo(106);
            };

            const submitServices = () => {
                const srvs = contractData.tenantServices.length > 0 ? contractData.tenantServices.join(', ') : 'Ninguno';
                const sum = `Servicios: ${srvs} | Expensas: ${contractData.expensesPayer} | Com. $${contractData.commission || 0}`;
                setContractData({...contractData, servicesSummary: sum});
                typeAndGo(107);
            };

            const submitPrefs = () => {
                const sum = `Contrato: ${contractData.useDptoLibreContract ? 'Modelo DptoLibre' : 'Propio'} | Tickets Habilitados: ${contractData.enableTickets ? 'Sí' : 'No'}`;
                setContractData({...contractData, prefsSummary: sum});
                typeAndGo(108);
            };

            const confirmContract = () => {
                typeAndGo(109, 1500);
            };

            // Auto-scroll
            useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [step, isTyping, searchResultsProp, searchResultsTenant, contractData]);

            const showInput = [0, 1, 2, 3, 53, 100, 102].includes(step) && !isTyping;

            // Determinar placeholder
            const getPlaceholder = () => {
                if (step === 0) return "Ej: Marcos";
                if (step === 1) return "Ej: Galperin";
                if (step === 2) return "correo@ejemplo.com";
                if (step === 3) return "Ej: +54 9 11 1234-5678";
                if (step === 53) return "Dirección de la propiedad...";
                if (step === 100) return "Busca por calle o barrio...";
                if (step === 102) return "Nombre, DNI o Email...";
                return "Escribe aquí...";
            };

            const getInputValue = () => {
                if (step === 0) return userData.name;
                if (step === 1) return userData.lastName;
                if (step === 2) return userData.email;
                if (step === 3) return userData.phone;
                if (step === 53) return propData.newPropAddress;
                if (step === 100) return contractData.propSearch;
                if (step === 102) return contractData.tenantSearch;
                return "";
            };

            const handleInputChange = (e) => {
                const v = e.target.value;
                if (step === 0) setUserData({...userData, name: v});
                else if (step === 1) setUserData({...userData, lastName: v});
                else if (step === 2) setUserData({...userData, email: v});
                else if (step === 3) setUserData({...userData, phone: v});
                else if (step === 53) setPropData({...propData, newPropAddress: v});
                else if (step === 100) setContractData({...contractData, propSearch: v});
                else if (step === 102) setContractData({...contractData, tenantSearch: v});
            };

            // --- VISTAS GLOBALES ---
            return (
                <div className="flex min-h-screen w-full relative overflow-hidden bg-[#F8FAFC]">
                    
                    {/* BARRA LATERAL */}
                    <aside className="w-24 sidebar text-white flex flex-col items-center py-8 gap-10 border-r border-[#0D1B4B] h-screen fixed left-0 top-0 z-50 shadow-2xl">
                        <div className="w-12 h-12 bg-[#0055DD] rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-lg">D</div>
                        <nav className="flex flex-col gap-8 text-slate-400">
                            <div className="p-3 hover:text-white transition-colors cursor-pointer"><Icon name="layout-grid" size={24} /></div>
                            <div className="p-3 bg-blue-500/10 text-[#00D1FF] rounded-xl cursor-pointer"><Icon name="sparkles" size={24} /></div>
                            <div className="p-3 hover:text-white transition-colors cursor-pointer"><Icon name="building" size={24} /></div>
                            <div className="p-3 hover:text-white transition-colors cursor-pointer"><Icon name="wallet" size={24} /></div>
                        </nav>
                    </aside>
                    
                    <main className="flex-1 flex flex-col ml-24 h-screen max-w-4xl mx-auto relative border-x border-slate-100 bg-white shadow-sm">
                        
                        {/* HEADER */}
                        <header className="p-6 border-b border-slate-50 flex justify-between items-center bg-white sticky top-0 z-40">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-[#0055DD] shadow-inner">
                                    <Icon name="sparkles" size={20} />
                                </div>
                                <div>
                                    <h2 className="text-sm font-black uppercase tracking-widest text-slate-800 leading-none italic">Secretaría Digital</h2>
                                    <p className="text-[10px] text-emerald-500 font-bold uppercase mt-1">Conectado • Asistente AI</p>
                                </div>
                            </div>
                            <button onClick={resetAll} className="bg-slate-50 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-[#0055DD] transition-all flex items-center gap-2">
                                <Icon name="rotate-ccw" size={14}/> Reiniciar
                            </button>
                        </header>

                        {/* CHAT AREA */}
                        <div ref={scrollRef} className="flex-1 overflow-y-auto p-8 space-y-8 no-scrollbar pb-48">
                            
                            {/* --- MENÚ PRINCIPAL --- */}
                            {step === -1 && !isTyping && (
                                <div className="bot-bubble animate-bubble border-l-4 border-l-[#0055DD]">
                                    <p>¡Hola! Soy tu asistente de DptoLibre.</p>
                                    <p className="mt-2 text-[#0055DD] font-bold italic">¿Qué vamos a gestionar hoy?</p>
                                    <div className="mt-6 flex flex-col gap-3">
                                        <button onClick={() => typeAndGo(100)} className="role-card group">
                                            <div className="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center group-hover:bg-[#0055DD] group-hover:text-white transition-all"><Icon name="file-signature" size={18}/></div>
                                            <div className="flex-1"><p className="text-xs font-black uppercase tracking-widest">Alta de Contrato</p><p className="text-[9px] text-slate-400 font-medium uppercase mt-1">Configurar y vincular partes</p></div>
                                            <Icon name="chevron-right" size={16} className="text-slate-200 group-hover:text-[#00D1FF]" />
                                        </button>
                                        {/* Other buttons omitted for brevity in focus of contract flow */}
                                    </div>
                                </div>
                            )}

                            {/* --- FLUJO: ALTA DE CONTRATO (100+) --- */}
                            {step >= 100 && <div className="user-bubble animate-bubble uppercase tracking-widest bg-[#0D1B4B]">Alta de Contrato</div>}
                            
                            {step === 100 && !isTyping && (
                                <div className="bot-bubble animate-bubble italic text-slate-600">
                                    Vamos a armar un nuevo contrato. Primero, ingresá la <strong>dirección o barrio</strong> de la propiedad a alquilar.
                                </div>
                            )}

                            {step >= 101 && <div className="user-bubble animate-bubble">{contractData.propSearch}</div>}

                            {step === 101 && !isTyping && (
                                <div className="bot-bubble animate-bubble">
                                    {searchResultsProp.length > 0 ? (
                                        <>
                                            <p className="font-bold text-slate-700 mb-4">Encontré estas propiedades. Seleccioná la correcta:</p>
                                            <div className="space-y-2 mb-4">
                                                {searchResultsProp.map(p => (
                                                    <div key={p.id} onClick={() => selectContractProp(p)} className="role-card group bg-blue-50/50 border-blue-100">
                                                        <div className="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-[#0055DD] group-hover:bg-[#0055DD] group-hover:text-white transition-colors"><Icon name="building" size={18}/></div>
                                                        <div className="flex-1"><p className="text-sm font-black text-slate-800">{p.address}</p><p className="text-[10px] text-slate-500 font-bold uppercase">{p.neighborhood}</p></div>
                                                        <Icon name="check-circle" size={18} className="text-slate-300 group-hover:text-[#0055DD]" />
                                                    </div>
                                                ))}
                                            </div>
                                        </>
                                    ) : (
                                        <p className="font-bold text-red-500 mb-4">No encontré propiedades. Intentá nuevamente.</p>
                                    )}
                                </div>
                            )}

                            {step >= 102 && contractData.linkedProp && (
                                <div className="bot-bubble animate-bubble bg-emerald-50 border-emerald-100 flex items-center gap-3">
                                    <Icon name="building" className="text-emerald-500" />
                                    <span className="font-black text-emerald-800 text-sm">{contractData.linkedProp.address}</span>
                                </div>
                            )}

                            {step === 102 && !isTyping && (
                                <div className="bot-bubble animate-bubble italic text-slate-600">
                                    Excelente. Ahora, ingresá el <strong>Nombre, DNI o Email</strong> del futuro inquilino para buscarlo.
                                </div>
                            )}

                            {step >= 103 && <div className="user-bubble animate-bubble">{contractData.tenantSearch}</div>}

                            {step === 103 && !isTyping && (
                                <div className="bot-bubble animate-bubble">
                                    {searchResultsTenant.length > 0 ? (
                                        <>
                                            <p className="font-bold text-slate-700 mb-4">Encontré estos inquilinos. Seleccioná al correcto:</p>
                                            <div className="space-y-2 mb-4">
                                                {searchResultsTenant.map(t => (
                                                    <div key={t.id} onClick={() => selectContractTenant(t)} className="role-card group bg-blue-50/50 border-blue-100">
                                                        <div className="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-[#0055DD] group-hover:bg-[#0055DD] group-hover:text-white transition-colors"><Icon name="user" size={18}/></div>
                                                        <div className="flex-1"><p className="text-sm font-black text-slate-800">{t.name}</p><p className="text-[10px] text-slate-500 font-bold uppercase">{t.dni} • {t.email}</p></div>
                                                        <Icon name="check-circle" size={18} className="text-slate-300 group-hover:text-[#0055DD]" />
                                                    </div>
                                                ))}
                                            </div>
                                        </>
                                    ) : (
                                        <p className="font-bold text-red-500 mb-4">No encontré inquilinos con ese dato.</p>
                                    )}
                                </div>
                            )}

                            {step >= 104 && contractData.linkedTenant && (
                                <div className="bot-bubble animate-bubble bg-emerald-50 border-emerald-100 flex items-center gap-3">
                                    <Icon name="user-check" className="text-emerald-500" />
                                    <div>
                                        <span className="font-black text-emerald-800 text-sm block">{contractData.linkedTenant.name}</span>
                                        <span className="font-bold text-emerald-600 text-[10px]">{contractData.linkedTenant.email}</span>
                                    </div>
                                </div>
                            )}

                            {/* TARJETA 1: CONDICIONES FINANCIERAS */}
                            {step === 104 && !isTyping && (
                                <div className="bot-bubble animate-bubble w-full max-w-[90%]">
                                    <p className="font-medium text-slate-700">Perfecto. Configuremos las <strong>condiciones financieras</strong> del contrato:</p>
                                    <div className="config-card space-y-4">
                                        <div className="flex gap-4">
                                            <div className="flex-1">
                                                <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Monto del Alquiler</label>
                                                <input type="number" value={contractData.amount} onChange={e => setContractData({...contractData, amount: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none focus:border-[#0055DD]" />
                                            </div>
                                            <div className="w-24">
                                                <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Moneda</label>
                                                <select value={contractData.currency} onChange={e => setContractData({...contractData, currency: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none focus:border-[#0055DD]">
                                                    <option>ARS</option>
                                                    <option>USD</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div className="flex gap-4">
                                            <div className="flex-1">
                                                <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Actualización</label>
                                                <select value={contractData.updateFreq} onChange={e => setContractData({...contractData, updateFreq: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none focus:border-[#0055DD]">
                                                    <option>Trimestral</option>
                                                    <option>Cuatrimestral</option>
                                                    <option>Semestral</option>
                                                    <option>Anual</option>
                                                    <option>Fija (Sin act.)</option>
                                                </select>
                                            </div>
                                            <div className="flex-1">
                                                <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Índice</label>
                                                <select value={contractData.updateIndex} onChange={e => setContractData({...contractData, updateIndex: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none focus:border-[#0055DD]">
                                                    <option>IPC</option>
                                                    <option>ICL</option>
                                                    <option>Casa Propia</option>
                                                    <option>Fijo Pactado</option>
                                                </select>
                                            </div>
                                        </div>
                                        <button onClick={submitFinancial} className="w-full bg-[#0055DD] text-white py-3 rounded-xl text-xs font-black uppercase tracking-widest mt-2 shadow-md">Continuar</button>
                                    </div>
                                </div>
                            )}
                            {step >= 105 && contractData.financialSummary && <div className="user-bubble animate-bubble">{contractData.financialSummary}</div>}

                            {/* TARJETA 2: FECHAS Y PENALIDADES */}
                            {step === 105 && !isTyping && (
                                <div className="bot-bubble animate-bubble w-full max-w-[90%]">
                                    <p className="font-medium text-slate-700">Anotado. Ahora las <strong>fechas y penalidades</strong>:</p>
                                    <div className="config-card space-y-4">
                                        <div className="flex gap-4">
                                            <div className="flex-1">
                                                <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Fecha de Inicio</label>
                                                <input type="date" value={contractData.startDate} onChange={e => setContractData({...contractData, startDate: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none focus:border-[#0055DD]" />
                                            </div>
                                            <div className="w-24">
                                                <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Plazo (m)</label>
                                                <input type="number" value={contractData.duration} onChange={e => setContractData({...contractData, duration: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none focus:border-[#0055DD] text-center" />
                                            </div>
                                        </div>
                                        <div className="flex gap-4">
                                            <div className="flex-1">
                                                <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Día de Vencimiento</label>
                                                <div className="relative">
                                                    <span className="absolute left-3 top-3 text-slate-400 text-sm font-bold">Día</span>
                                                    <input type="number" min="1" max="28" value={contractData.dueDay} onChange={e => setContractData({...contractData, dueDay: e.target.value})} className="w-full p-3 pl-10 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none focus:border-[#0055DD]" />
                                                </div>
                                            </div>
                                            <div className="flex-1">
                                                <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Punitorio Diario</label>
                                                <div className="relative">
                                                    <input type="number" step="0.1" value={contractData.lateFee} onChange={e => setContractData({...contractData, lateFee: e.target.value})} className="w-full p-3 pr-8 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none focus:border-[#0055DD] text-right" />
                                                    <span className="absolute right-3 top-3 text-slate-400 text-sm font-bold">%</span>
                                                </div>
                                            </div>
                                        </div>
                                        <button onClick={submitDates} className="w-full bg-[#0055DD] text-white py-3 rounded-xl text-xs font-black uppercase tracking-widest mt-2 shadow-md">Continuar</button>
                                    </div>
                                </div>
                            )}
                            {step >= 106 && contractData.datesSummary && <div className="user-bubble animate-bubble">{contractData.datesSummary}</div>}

                            {/* TARJETA 3: SERVICIOS E INVENTARIO */}
                            {step === 106 && !isTyping && (
                                <div className="bot-bubble animate-bubble w-full max-w-[90%]">
                                    <p className="font-medium text-slate-700">Bien. Definamos los <strong>servicios, gastos e inventario</strong> a resguardar:</p>
                                    <div className="config-card space-y-4">
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-slate-400 block mb-2">Servicios a cargo del inquilino</label>
                                            <div className="flex flex-wrap gap-2">
                                                {['Luz', 'Gas', 'Agua', 'Internet', 'Municipal'].map(s => (
                                                    <span 
                                                        key={s} 
                                                        onClick={() => {
                                                            const newS = contractData.tenantServices.includes(s) 
                                                                ? contractData.tenantServices.filter(x => x !== s) 
                                                                : [...contractData.tenantServices, s];
                                                            setContractData({...contractData, tenantServices: newS});
                                                        }}
                                                        className={`chip ${contractData.tenantServices.includes(s) ? 'bg-blue-50 border-[#0055DD] text-[#0055DD]' : 'bg-white border-slate-200 text-slate-500'}`}
                                                    >{s}</span>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="flex gap-4">
                                            <div className="flex-1">
                                                <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Expensas Ordinarias</label>
                                                <select value={contractData.expensesPayer} onChange={e => setContractData({...contractData, expensesPayer: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-xs font-bold outline-none focus:border-[#0055DD]">
                                                    <option>A cargo del Inquilino</option>
                                                    <option>A cargo del Dueño</option>
                                                    <option>No posee</option>
                                                </select>
                                            </div>
                                            <div className="flex-1">
                                                <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Comisión / Gastos</label>
                                                <input type="number" placeholder="Ej: 150000" value={contractData.commission} onChange={e => setContractData({...contractData, commission: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-xs font-bold outline-none focus:border-[#0055DD]" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Mobiliario o Características a Resguardar</label>
                                            <textarea 
                                                placeholder="Ej: Aire acondicionado Surrey, Heladera Whirlpool, Mesa de Roble..." 
                                                value={contractData.inventory} onChange={e => setContractData({...contractData, inventory: e.target.value})}
                                                className="w-full p-3 bg-white border border-slate-200 rounded-xl text-xs font-medium outline-none focus:border-[#0055DD]" rows="2"
                                            ></textarea>
                                        </div>
                                        <button onClick={submitServices} className="w-full bg-[#0055DD] text-white py-3 rounded-xl text-xs font-black uppercase tracking-widest mt-2 shadow-md">Continuar</button>
                                    </div>
                                </div>
                            )}
                            {step >= 107 && contractData.servicesSummary && <div className="user-bubble animate-bubble">{contractData.servicesSummary}</div>}

                            {/* TARJETA 4: PREFERENCIAS (Tickets y Contrato) */}
                            {step === 107 && !isTyping && (
                                <div className="bot-bubble animate-bubble w-full max-w-[90%]">
                                    <p className="font-medium text-slate-700">Casi listos. Selecciona las <strong>preferencias operativas</strong>:</p>
                                    <div className="config-card space-y-4">
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-slate-400 block mb-2">Modelo de Contrato</label>
                                            <div className="flex flex-col gap-2">
                                                <div onClick={() => setContractData({...contractData, useDptoLibreContract: true})} className={`p-3 rounded-xl border flex items-center gap-3 cursor-pointer ${contractData.useDptoLibreContract ? 'border-[#0055DD] bg-blue-50' : 'border-slate-200 bg-white'}`}>
                                                    <div className={`w-4 h-4 rounded-full border-2 flex items-center justify-center ${contractData.useDptoLibreContract ? 'border-[#0055DD]' : 'border-slate-300'}`}>
                                                        {contractData.useDptoLibreContract && <div className="w-2 h-2 rounded-full bg-[#0055DD]"></div>}
                                                    </div>
                                                    <div><p className="text-xs font-bold text-slate-800">Modelo DptoLibre</p><p className="text-[9px] text-slate-500">Recomendado - Validado legalmente</p></div>
                                                </div>
                                                <div onClick={() => setContractData({...contractData, useDptoLibreContract: false})} className={`p-3 rounded-xl border flex items-center gap-3 cursor-pointer ${!contractData.useDptoLibreContract ? 'border-[#0055DD] bg-blue-50' : 'border-slate-200 bg-white'}`}>
                                                    <div className={`w-4 h-4 rounded-full border-2 flex items-center justify-center ${!contractData.useDptoLibreContract ? 'border-[#0055DD]' : 'border-slate-300'}`}>
                                                        {!contractData.useDptoLibreContract && <div className="w-2 h-2 rounded-full bg-[#0055DD]"></div>}
                                                    </div>
                                                    <div><p className="text-xs font-bold text-slate-800">Subir PDF Propio</p><p className="text-[9px] text-slate-500">Pierde funciones de arbitraje express</p></div>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="pt-2 border-t border-slate-200 flex items-center justify-between">
                                            <div>
                                                <p className="text-xs font-bold text-slate-800">Módulo de Tickets</p>
                                                <p className="text-[9px] text-slate-500">Permitir al inquilino reportar averías en la App</p>
                                            </div>
                                            <div onClick={() => setContractData({...contractData, enableTickets: !contractData.enableTickets})} className={`w-12 h-6 rounded-full cursor-pointer relative transition-colors ${contractData.enableTickets ? 'bg-emerald-500' : 'bg-slate-300'}`}>
                                                <div className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-all ${contractData.enableTickets ? 'left-7' : 'left-1'}`}></div>
                                            </div>
                                        </div>
                                        <button onClick={submitPrefs} className="w-full bg-[#0055DD] text-white py-3 rounded-xl text-xs font-black uppercase tracking-widest mt-2 shadow-md">Finalizar</button>
                                    </div>
                                </div>
                            )}
                            {step >= 108 && contractData.prefsSummary && <div className="user-bubble animate-bubble">{contractData.prefsSummary}</div>}

                            {/* --- RESUMEN FINAL --- */}
                            {step === 108 && !isTyping && (
                                <div className="bot-bubble animate-bubble bg-slate-50 border-slate-200 w-full max-w-[90%]">
                                    <div className="flex items-center gap-2 mb-4 text-[#0055DD]">
                                        <Icon name="file-text" size={16} />
                                        <h4 className="font-black uppercase text-[10px] tracking-widest">Resumen del Contrato</h4>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm space-y-3 mb-6">
                                        <div className="flex justify-between items-center"><span className="text-[10px] text-slate-400 uppercase font-black">Propiedad</span><span className="text-xs font-bold text-slate-700 text-right max-w-[150px] truncate">{contractData.linkedProp?.address}</span></div>
                                        <div className="flex justify-between items-center"><span className="text-[10px] text-slate-400 uppercase font-black">Inquilino</span><span className="text-xs font-bold text-slate-700 text-right">{contractData.linkedTenant?.name}</span></div>
                                        <div className="flex justify-between items-center border-t border-slate-50 pt-3"><span className="text-[10px] text-slate-400 uppercase font-black">Monto Base</span><span className="text-sm font-black text-emerald-600">{formatCurrency(contractData.amount, contractData.currency)}</span></div>
                                        <div className="flex justify-between items-center"><span className="text-[10px] text-slate-400 uppercase font-black">Plazo / Ajuste</span><span className="text-xs font-bold text-slate-700">{contractData.duration}m | {contractData.updateFreq} ({contractData.updateIndex})</span></div>
                                    </div>
                                    <div className="flex gap-3">
                                        <button onClick={confirmContract} className="flex-1 bg-[#0D1B4B] text-white py-4 rounded-xl font-black text-xs uppercase tracking-widest shadow-lg active:scale-95 transition-all">Generar y Compartir</button>
                                        <button onClick={() => typeAndGo(100)} className="px-4 py-4 bg-white text-slate-400 border border-slate-200 rounded-xl font-black text-xs uppercase hover:text-red-500 active:scale-95 transition-all">Editar</button>
                                    </div>
                                </div>
                            )}

                            {/* ÉXITO */}
                            {step === 109 && (
                                <div className="space-y-6">
                                    <div className="bot-bubble animate-bubble bg-emerald-50 border-emerald-100">
                                        <div className="flex items-center gap-3 text-emerald-600 mb-2">
                                            <Icon name="check-circle" size={24} strokeWidth={3} />
                                            <h4 className="font-black uppercase tracking-tighter text-lg">Contrato Generado</h4>
                                        </div>
                                        <p className="text-emerald-700 font-medium leading-relaxed mb-4">
                                            El contrato fue creado bajo los estándares de DptoLibre. Se ha notificado al inquilino <strong>{contractData.linkedTenant?.name}</strong> y al propietario para firmar.
                                        </p>
                                        <button onClick={() => alert("Link Compartido por WhatsApp")} className="w-full bg-emerald-500 text-slate-900 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest flex items-center justify-center gap-2 shadow-lg shadow-emerald-200 hover:bg-emerald-400 transition-colors">
                                            <Icon name="share-2" size={16} /> Compartir Link a Partes
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4 animate-bubble" style={{animationDelay: '0.4s'}}>
                                        <button onClick={() => resetAll()} className="flex items-center gap-3 p-4 bg-white border border-slate-100 rounded-2xl hover:border-[#0055DD] transition-all shadow-sm group">
                                            <div className="w-10 h-10 bg-blue-50 text-[#0055DD] rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform"><Icon name="file-signature" size={18}/></div>
                                            <span className="text-[10px] font-black uppercase text-slate-600 leading-tight text-left">Nuevo<br/>Contrato</span>
                                        </button>
                                        <button onClick={() => { resetAll(); typeAndGo(0); }} className="flex items-center gap-3 p-4 bg-white border border-slate-100 rounded-2xl hover:border-[#0055DD] transition-all shadow-sm group">
                                            <div className="w-10 h-10 bg-blue-50 text-[#0055DD] rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform"><Icon name="user-plus" size={18}/></div>
                                            <span className="text-[10px] font-black uppercase text-slate-600 leading-tight text-left">Nuevo<br/>Usuario</span>
                                        </button>
                                    </div>
                                </div>
                            )}

                            {isTyping && (
                                <div className="bot-bubble flex items-center gap-1.5 py-4 w-max">
                                    <div className="typing-dot"></div><div className="typing-dot"></div><div className="typing-dot"></div>
                                </div>
                            )}
                        </div>

                        {/* ÁREA DE INPUT CONTEXTUAL */}
                        {showInput && (
                            <footer className="p-10 border-t border-slate-50 bg-white/80 backdrop-blur-md sticky bottom-0 z-40">
                                <div className="flex gap-4 max-w-2xl mx-auto">
                                    <input 
                                        type="text"
                                        placeholder={getPlaceholder()}
                                        value={getInputValue()}
                                        onChange={handleInputChange}
                                        className="input-chat shadow-inner"
                                        onKeyDown={(e) => {
                                            if (e.key === 'Enter') {
                                                if (step < 4) handleNextStep();
                                                else if (step === 100) executePropSearch();
                                                else if (step === 102) executeTenantSearch();
                                            }
                                        }}
                                        autoFocus
                                    />
                                    <button 
                                        onClick={() => {
                                            if (step < 4) handleNextStep();
                                            else if (step === 100) executePropSearch();
                                            else if (step === 102) executeTenantSearch();
                                        }}
                                        className="bg-[#0D1B4B] text-white w-16 h-16 rounded-[1.5rem] flex items-center justify-center shadow-xl hover:bg-[#0055DD] active:scale-95 transition-all shrink-0"
                                    >
                                        <Icon name={step === 100 || step === 102 ? "search" : "send"} />
                                    </button>
                                </div>
                            </footer>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DptoLibreAssistantApp />);
    </script>
</body>
</html>
