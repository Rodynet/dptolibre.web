<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Comando - DptoLibre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <div class="min-h-screen flex">
        <!-- Sidebar Fijo -->
        <aside class="w-64 bg-slate-900 text-white flex-shrink-0">
            <div class="p-6 text-2xl font-bold border-b border-slate-800">DptoLibre</div>
            <nav class="mt-6">
                <a href="#" class="block py-3 px-6 bg-blue-600 border-l-4 border-white">Dashboard</a>
                <a href="#" class="block py-3 px-6 hover:bg-slate-800 transition">Propiedades</a>
                <a href="#" class="block py-3 px-6 hover:bg-slate-800 transition">Propietarios</a>
                <a href="#" class="block py-3 px-6 hover:bg-slate-800 transition">Finanzas</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1">
            <!-- Barra Superior -->
            <header class="bg-white shadow-sm p-4 flex justify-between items-center border-b border-gray-200">
                <h1 class="text-xl font-semibold">Centro de Comando</h1>
                <div class="flex gap-4">
                    <button class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700">Nueva Gestión</button>
                </div>
            </header>

            <!-- Grid de Indicadores -->
            <div class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-sm text-gray-500">Propiedades Totales</p>
                        <h3 class="text-2xl font-bold">142</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-sm text-gray-500">Ocupación</p>
                        <h3 class="text-2xl font-bold">88%</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-sm text-gray-500">Pagos Pendientes</p>
                        <h3 class="text-2xl font-bold text-red-500">12</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-sm text-gray-500">Ingresos Mes</p>
                        <h3 class="text-2xl font-bold text-green-600">$4.2M</h3>
                    </div>
                </div>

                <!-- Tabla de Gestión -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 flex justify-between">
                        <h2 class="font-bold text-lg">Últimas Gestiones</h2>
                    </div>
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-gray-600 uppercase text-xs">
                            <tr>
                                <th class="px-6 py-4">Propiedad</th>
                                <th class="px-6 py-4">Propietario</th>
                                <th class="px-6 py-4">Estado</th>
                                <th class="px-6 py-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-gestiones" class="divide-y divide-gray-100">
                            <!-- Inyectado por JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const gestiones = [
            { prop: "Dpto 101 - Edificio Sol", pro: "Juan Pérez", estado: "Al día" },
            { prop: "Dpto 204 - Torres B", pro: "María García", estado: "Pendiente" },
            { prop: "Dpto 402 - Los Olivos", pro: "Carlos Ruiz", estado: "Al día" }
        ];

        const tbody = document.getElementById('tabla-gestiones');
        tbody.innerHTML = gestiones.map(g => `
            <tr class="hover:bg-gray-50 transition">
                <td class="px-6 py-4 font-medium">${g.prop}</td>
                <td class="px-6 py-4 text-gray-600">${g.pro}</td>
                <td class="px-6 py-4">
                    <span class="px-2 py-1 rounded-full text-xs ${g.estado === 'Al día' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
                        ${g.estado}
                    </span>
                </td>
                <td class="px-6 py-4">
                    <button class="text-blue-600 hover:text-blue-800"><i class="fas fa-edit"></i></button>
                </td>
            </tr>
        `).join('');
    </script>
</body>
</html>
