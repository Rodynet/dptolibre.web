<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DptoLibre Admin - Directorio de Propiedades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const initialProperties = [
            { id: 1, address: "Belgrano 880, 2A", type: "Departamento", status: "Alquilada", tenant: "Ana Silva", roi: "4.2%", lastMaintenance: "12/2025" },
            { id: 2, address: "Caseros 1230, 4B", type: "Departamento", status: "Alquilada", tenant: "Marcos Galperin", roi: "4.5%", lastMaintenance: "03/2026" },
            { id: 3, address: "Av. Colón 450", type: "Oficina", status: "Vacante", tenant: "-", roi: "0%", lastMaintenance: "01/2026" },
            { id: 4, address: "San Martín 22", type: "Local Comercial", status: "En Mantenimiento", tenant: "Damián Martínez", roi: "3.8%", lastMaintenance: "05/2026" }
        ];

        function PropertyAdmin() {
            const [selectedProp, setSelectedProp] = useState(null);

            return (
                <div className="flex h-screen bg-slate-50 p-10">
                    <div className="flex-1 bg-white rounded-[2rem] shadow-xl border border-slate-100 overflow-hidden">
                        <table className="w-full text-left">
                            <thead className="bg-slate-50">
                                <tr>
                                    <th className="p-6 text-[10px] font-black uppercase text-slate-400">Dirección</th>
                                    <th className="p-6 text-[10px] font-black uppercase text-slate-400">Estado</th>
                                    <th className="p-6 text-[10px] font-black uppercase text-slate-400">Inquilino Actual</th>
                                    <th className="p-6 text-[10px] font-black uppercase text-slate-400">ROI</th>
                                </tr>
                            </thead>
                            <tbody>
                                {initialProperties.map(prop => (
                                    <tr key={prop.id} onClick={() => setSelectedProp(prop)} className="hover:bg-slate-50 cursor-pointer border-t">
                                        <td className="p-6 font-bold">{prop.address}</td>
                                        <td className="p-6"><span className="px-2 py-1 rounded-full text-[10px] font-black bg-blue-100 text-blue-700">{prop.status}</span></td>
                                        <td className="p-6">{prop.tenant}</td>
                                        <td className="p-6 font-mono font-bold text-[#0055DD]">{prop.roi}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PropertyAdmin />);
    </script>
</body>
</html>
