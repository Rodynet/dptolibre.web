<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DptoLibre Admin Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const data = [
            { id: 1, address: "Belgrano 880, 2A", owner: "Ana Silva", tenant: "Juan Pérez", status: "Alquilada", start: "2025-01-01", end: "2026-12-31", progress: 75, photo: "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?w=400" },
            { id: 2, address: "Caseros 1230, 4B", owner: "Carlos Paz", tenant: "María López", status: "Reservado", start: "2026-06-01", end: "2027-06-01", progress: 0, photo: "https://images.unsplash.com/photo-1484154218962-a197022b5858?w=400" },
            { id: 3, address: "Av. Colón 450", owner: "Carlos Paz", tenant: "-", status: "Disponible", start: "-", end: "-", progress: 0, photo: "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=400" }
        ];

        function App() {
            const [view, setView] = useState('grid');
            const [search, setSearch] = useState('');

            return (
                <div className="flex h-screen">
                    <aside className="w-64 bg-slate-900 text-white p-6 flex flex-col">
                        <h1 className="text-xl font-black text-emerald-400 mb-10">DPTOLIBRE</h1>
                        <nav className="space-y-4">
                            {['Usuarios', 'Contratos', 'Propiedades'].map(i => <div key={i} className={`p-2 cursor-pointer ${i === 'Propiedades' ? 'font-bold text-emerald-400' : 'text-slate-400'}`}>{i}</div>)}
                        </nav>
                    </aside>

                    <main className="flex-1 p-8 overflow-y-auto">
                        <div className="flex justify-between items-center mb-6">
                            <input onChange={(e) => setSearch(e.target.value)} placeholder="Buscar..." className="p-2 border rounded-lg w-1/3" />
                            <div className="flex gap-2">
                                <button onClick={() => setView('grid')} className="px-4 py-2 bg-slate-200 rounded">Cuadrícula</button>
                                <button onClick={() => setView('list')} className="px-4 py-2 bg-slate-200 rounded">Lista</button>
                                <button className="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold">+ Nuevo</button>
                            </div>
                        </div>

                        <div className={view === 'grid' ? "grid grid-cols-3 gap-6" : "space-y-4"}>
                            {data.filter(i => i.address.toLowerCase().includes(search.toLowerCase())).map(p => (
                                <div key={p.id} className="bg-white p-4 rounded-xl border flex gap-4">
                                    <img src={p.photo} className="w-24 h-24 object-cover rounded-lg" />
                                    <div className="flex-1">
                                        <h3 className="font-bold">{p.address}</h3>
                                        <p className="text-xs">Dueño: <span className="text-blue-600 cursor-pointer">{p.owner}</span></p>
                                        <p className="text-xs">Inquilino: <span className="text-blue-600 cursor-pointer">{p.tenant}</span></p>
                                        <div className="mt-2 text-[10px] flex gap-2">
                                            <span>Desde: {p.start}</span>
                                            {p.end !== '-' && <span>Hasta: {p.end}</span>}
                                        </div>
                                        {p.status === 'Alquilada' && (
                                            <div className="w-full bg-slate-200 h-2 rounded-full mt-2">
                                                <div className="bg-emerald-500 h-2 rounded-full" style={{ width: `${p.progress}%` }}></div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
