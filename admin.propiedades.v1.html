<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DptoLibre | Gestión Completa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800">

<!-- Modal para Crear -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-6">
        <h2 class="text-xl font-bold mb-4">Nueva Entidad</h2>
        <form id="entity-form" class="flex flex-col gap-4">
            <input type="text" id="ent-name" placeholder="Nombre" class="w-full p-3 border rounded-xl" required>
            <input type="text" id="ent-desc" placeholder="Descripción breve" class="w-full p-3 border rounded-xl" required>
            <select id="ent-type" class="w-full p-3 border rounded-xl">
                <option value="Propiedad">Propiedad</option>
                <option value="Usuario">Usuario</option>
                <option value="Contrato">Contrato</option>
            </select>
            <div class="flex justify-end gap-3 mt-4">
                <button type="button" onclick="toggleModal()" class="px-4 py-2 text-slate-500">Cancelar</button>
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-xl">Guardar</button>
            </div>
        </form>
    </div>
</div>

<!-- Panel de Detalles / Edición -->
<div id="detail-panel" class="hidden fixed right-0 top-0 h-full w-96 bg-white shadow-2xl z-40 p-6 border-l">
    <button onclick="closeDetail()" class="text-slate-400 hover:text-slate-900"><i class="fas fa-times"></i> Cerrar</button>
    <div id="detail-content" class="mt-6"></div>
</div>

<main class="max-w-6xl mx-auto p-8">
    <header class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold">Panel de Control</h1>
        <div class="flex gap-3">
            <input type="text" id="search-input" onkeyup="render()" placeholder="Buscar por nombre o descripción..." class="px-4 py-2 border rounded-xl w-72">
            <button onclick="toggleModal()" class="bg-blue-600 text-white px-5 py-2 rounded-xl"><i class="fas fa-plus mr-2"></i> Nuevo</button>
        </div>
    </header>

    <div id="content-area" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
</main>

<script>
    let data = [
        { id: 1, name: "Dpto Palermo", desc: "Departamento 2 amb con vista al parque", type: "Propiedad", status: "Disponible" },
        { id: 2, name: "Juan Pérez", desc: "Inquilino principal contrato anual", type: "Usuario", status: "Activo" }
    ];

    function render() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const filtered = data.filter(i => 
            i.name.toLowerCase().includes(query) || i.desc.toLowerCase().includes(query)
        );
        
        document.getElementById('content-area').innerHTML = filtered.map(item => `
            <div class="bg-white p-6 rounded-2xl border shadow-sm">
                <h3 class="font-bold text-lg">${item.name}</h3>
                <p class="text-sm text-slate-500 mb-4 truncate">${item.desc}</p>
                <span class="px-2 py-1 bg-slate-100 rounded text-xs font-bold">${item.type}</span>
                <button onclick="verDetalle(${item.id})" class="mt-4 w-full border border-slate-200 py-2 rounded-lg hover:bg-slate-50">Ver Detalle</button>
            </div>
        `).join('');
    }

    function verDetalle(id) {
        const item = data.find(i => i.id === id);
        const panel = document.getElementById('detail-content');
        panel.innerHTML = `
            <h2 class="text-2xl font-bold mb-2">${item.name}</h2>
            <p class="text-slate-600 mb-4">${item.desc}</p>
            <div class="space-y-4">
                <input type="text" value="${item.name}" id="edit-name" class="w-full p-2 border rounded">
                <textarea id="edit-desc" class="w-full p-2 border rounded">${item.desc}</textarea>
                <button onclick="guardarEdicion(${id})" class="w-full bg-blue-600 text-white py-2 rounded-xl">Guardar Cambios</button>
                <button onclick="eliminar(${id})" class="w-full text-red-500 py-2">Eliminar</button>
            </div>
        `;
        document.getElementById('detail-panel').classList.remove('hidden');
    }

    function guardarEdicion(id) {
        const index = data.findIndex(i => i.id === id);
        data[index].name = document.getElementById('edit-name').value;
        data[index].desc = document.getElementById('edit-desc').value;
        render();
        closeDetail();
    }

    function eliminar(id) {
        data = data.filter(i => i.id !== id);
        render();
        closeDetail();
    }

    function closeDetail() { document.getElementById('detail-panel').classList.add('hidden'); }
    function toggleModal() { document.getElementById('modal').classList.toggle('hidden'); }

    document.getElementById('entity-form').onsubmit = (e) => {
        e.preventDefault();
        data.push({ 
            id: Date.now(), 
            name: document.getElementById('ent-name').value, 
            desc: document.getElementById('ent-desc').value,
            type: document.getElementById('ent-type').value 
        });
        render();
        toggleModal();
    };

    render();
</script>
</body>
</html>
