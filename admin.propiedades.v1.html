<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DptoLibre - Gestión de Propiedades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const initialData = [
            { id: 1, address: "Belgrano 880, 2A", owner: "Ana Silva", status: "Con Contrato", progress: 100, photo: "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?w=200" },
            { id: 2, address: "Caseros 1230, 4B", owner: "Carlos Paz", status: "Reservado", progress: 75, photo: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=200" },
            { id: 3, address: "Av. Colón 450", owner: "Lucía Méndez", status: "Vacante", progress: 25, photo: "https://images.unsplash.com/photo-1484154218962-a197022b5858?w=200" },
            { id: 4, address: "San Martín 22", owner: "Juan Pérez", status: "Pausada", progress: 50, photo: "https://images.unsplash.com/photo-1497366216548-37526070297c?w=200" }
        ];

        function App() {
            const [search, setSearch] = useState("");
            const [view, setView] = useState("grid"); // 'grid' o 'list'
            const [filter, setFilter] = useState("Todos");
            
            const filteredData = useMemo(() => {
                return initialData.filter(p => 
                    (filter === "Todos" || p.status === filter) &&
                    (p.address.toLowerCase().includes(search.toLowerCase()) || p.owner.toLowerCase().includes(search.toLowerCase()))
                );
            }, [search, filter]);

            return (
                <div className="p-8 max-w-6xl mx-auto">
                    <header className="flex justify-between items-center mb-8">
                        <div>
                            <h1 className="text-2xl font-black">Mis Propiedades</h1>
                            <p className="text-slate-500 text-sm">Gestiona y filtra tus unidades.</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setView('grid')} className={`p-2 rounded ${view === 'grid' ? 'bg-slate-900 text-white' : 'bg-white'}`}>Grid</button>
                            <button onClick={() => setView('list')} className={`p-2 rounded ${view === 'list' ? 'bg-slate-900 text-white' : 'bg-white'}`}>Lista</button>
                        </div>
                    </header>

                    <div className="flex gap-4 mb-6">
                        <input 
                            type="text" 
                            placeholder="Buscar por dirección o dueño..." 
                            className="flex-1 p-3 rounded-xl border border-slate-200 outline-none"
                            onChange={(e) => setSearch(e.target.value)}
                        />
                        <select onChange={(e) => setFilter(e.target.value)} className="p-3 rounded-xl border border-slate-200">
                            <option>Todos</option>
                            <option>Vacante</option>
                            <option>Reservado</option>
                            <option>Con Contrato</option>
                            <option>Pausada</option>
                        </select>
                    </div>

                    <div className={view === 'grid' ? "grid grid-cols-1 md:grid-cols-2 gap-4" : "space-y-4"}>
                        {filteredData.map(p => (
                            <div key={p.id} className={`bg-white p-4 rounded-xl border flex ${view === 'list' ? 'items-center gap-4' : 'flex-col gap-2'}`}>
                                <img src={p.photo} className={view === 'grid' ? "w-full h-32 object-cover rounded-lg" : "w-16 h-16 rounded"} />
                                <div className="flex-1">
                                    <h3 className="font-bold">{p.address}</h3>
                                    <p className="text-xs text-slate-500">{p.owner}</p>
                                    <span className="text-[10px] bg-slate-100 px-2 py-1 rounded">{p.status}</span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
