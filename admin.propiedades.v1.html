<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DptoLibre | Gestión de Propiedades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800">

<div class="flex h-screen">
    <!-- Sidebar -->
    <aside class="w-20 bg-slate-950 text-slate-400 flex flex-col items-center py-8 gap-8">
        <div class="text-white text-2xl font-bold">D</div>
        <nav class="flex flex-col gap-6">
            <a class="hover:text-white transition"><i class="fas fa-home"></i></a>
            <a class="text-white bg-blue-600 p-3 rounded-xl"><i class="fas fa-building"></i></a>
            <a class="hover:text-white transition"><i class="fas fa-user"></i></a>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto">
        <!-- Header -->
        <header class="bg-white border-b border-slate-200 p-6 flex justify-between items-center sticky top-0 z-10">
            <div>
                <h1 class="text-2xl font-bold text-slate-950">Propiedades</h1>
                <p class="text-slate-500 text-sm">Administración central de activos</p>
            </div>
            <div class="flex items-center gap-4">
                <!-- Buscador -->
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-3 text-slate-400"></i>
                    <input type="text" placeholder="Buscar propiedad..." class="pl-10 pr-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none w-64">
                </div>
                <!-- Menú Nuevo -->
                <div class="relative group">
                    <button class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-medium hover:bg-blue-700 flex items-center gap-2">
                        <i class="fas fa-plus text-sm"></i> Nuevo <i class="fas fa-chevron-down text-xs ml-2"></i>
                    </button>
                    <div class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-slate-100 hidden group-hover:block">
                        <a class="block px-4 py-3 hover:bg-slate-50 text-sm">Propiedad</a>
                        <a class="block px-4 py-3 hover:bg-slate-50 text-sm">Usuario</a>
                        <a class="block px-4 py-3 hover:bg-slate-50 text-sm">Contrato</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Controles de Vista -->
        <div class="px-8 py-4 flex justify-between items-center">
            <div class="flex gap-2">
                <button onclick="setView('grid')" class="p-2 border rounded-lg bg-white shadow-sm"><i class="fas fa-th-large"></i></button>
                <button onclick="setView('list')" class="p-2 border rounded-lg bg-white shadow-sm"><i class="fas fa-list"></i></button>
            </div>
        </div>

        <!-- Contenido Dinámico -->
        <div id="view-container" class="px-8 pb-8">
            <!-- Grid por defecto -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Ejemplo de tarjeta -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 class="font-bold text-lg">Dpto Palermo - 2 Amb</h3>
                    <div class="h-32 bg-slate-100 rounded-lg my-4 flex items-center justify-center text-slate-400 border border-slate-200">
                        <i class="fas fa-map-marked-alt text-2xl mr-2"></i> Mapa: Córdoba, ARG
                    </div>
                    <div class="flex gap-2">
                        <button class="flex-1 bg-slate-900 text-white py-2 rounded-lg text-sm">Ver Detalles</button>
                        <button class="px-3 border rounded-lg"><i class="fas fa-ellipsis-v"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    function setView(mode) {
        const container = document.getElementById('view-container');
        if(mode === 'list') {
            container.innerHTML = `<div class="bg-white rounded-2xl border border-slate-200 p-4">
                <table class="w-full text-left">
                    <tr class="text-slate-400 text-sm border-b">
                        <th class="pb-3">Nombre</th>
                        <th class="pb-3">Estado</th>
                        <th class="pb-3">Acciones</th>
                    </tr>
                    <tr><td class="py-4 font-medium">Dpto Palermo - 2 Amb</td><td class="text-emerald-600 text-sm">Alquilado</td><td><button class="text-blue-600 underline">Editar</button></td></tr>
                </table>
            </div>`;
        } else {
            location.reload(); // Recarga simple para volver a grid
        }
    }
</script>
</body>
</html>
