<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Propiedades - DptoLibre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden-panel { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex">

    <!-- Sidebar Fijo -->
    <aside class="w-64 bg-white border-r border-slate-200 p-6 flex-shrink-0">
        <h1 class="text-2xl font-black text-blue-600 mb-10">DptoLibre</h1>
        <nav class="space-y-4">
            <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Gestión</div>
            <button class="flex items-center gap-3 w-full p-3 bg-blue-50 text-blue-700 rounded-xl font-semibold">
                Propiedades
            </button>
        </nav>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 overflow-y-auto">
        <header class="sticky top-0 bg-slate-50/80 backdrop-blur-md p-8 border-b border-slate-200 flex justify-between items-center">
            <h2 class="text-2xl font-black">Panel de Propiedades</h2>
            <div class="flex gap-2">
                <button onclick="changeView('grid')" class="p-2 rounded-lg bg-white border border-slate-200">Cuadrícula</button>
                <button onclick="changeView('list')" class="p-2 rounded-lg bg-white border border-slate-200">Lista</button>
            </div>
        </header>

        <div id="container" class="p-8 grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Card de ejemplo -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h3 class="text-lg font-bold mb-2">Belgrano 880, 2A</h3>
                <div class="space-y-1 text-sm text-slate-600 mb-4">
                    <p><strong>Dueño:</strong> <a href="#" class="text-blue-600 underline">Ana Silva</a></p>
                    <p><strong>Inquilino:</strong> <a href="#" class="text-blue-600 underline">Juan Pérez</a></p>
                    <p><strong>Contrato:</strong> <a href="#" class="text-blue-600 font-medium">CN-2026-001</a></p>
                </div>
                <button onclick="toggleDetail()" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-bold">Ver Detalle</button>
            </div>
        </div>
    </main>

    <!-- Panel Lateral Detalle (Oculto por defecto) -->
    <div id="detailPanel" class="hidden-panel w-96 bg-white border-l border-slate-200 p-8 shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black">Detalle Completo</h2>
            <button onclick="toggleDetail()" class="text-slate-400">Cerrar</button>
        </div>
        <div class="space-y-4">
            <p><strong>Ubicación:</strong> -31.416, -64.183</p>
            <p><strong>Estado:</strong> Alquilada</p>
            <button class="w-full p-3 bg-blue-600 text-white rounded-xl font-bold">Editar Propiedad</button>
            <button class="w-full p-3 border border-slate-200 rounded-xl font-bold">Ver Fotos</button>
        </div>
    </div>

    <script>
        function changeView(view) {
            const container = document.getElementById('container');
            container.className = view === 'grid' 
                ? 'p-8 grid grid-cols-1 md:grid-cols-2 gap-6' 
                : 'p-8 space-y-4';
        }

        function toggleDetail() {
            const panel = document.getElementById('detailPanel');
            panel.classList.toggle('hidden-panel');
        }
    </script>
</body>
</html>
