<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DptoLibre Admin Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const data = [
            { id: 1, address: "Belgrano 880, 2A", owner: "Ana Silva", tenant: "Juan Pérez", status: "Alquilada", start: "2025-01-01", end: "2026-12-31", progress: 75, desc: "Departamento céntrico, luminoso, cerca de universidades." },
            { id: 2, address: "Caseros 1230, 4B", owner: "Carlos Paz", tenant: "María López", status: "Reservado", start: "2026-06-01", end: "2027-06-01", progress: 0, desc: "Amplio balcón con vista a las sierras." },
            { id: 3, address: "Av. Colón 450", owner: "Carlos Paz", tenant: "-", status: "Disponible", start: "-", end: "-", progress: 0, desc: "Monoambiente a estrenar con cochera incluida." }
        ];

        function App() {
            const [view, setView] = useState('grid');
            const [search, setSearch] = useState('');
            const [filter, setFilter] = useState('Todos');
            const [selectedId, setSelectedId] = useState(null);

            const filteredData = data.filter(i => 
                (filter === 'Todos' || i.status === filter) &&
                (i.address.toLowerCase().includes(search.toLowerCase()) || i.owner.toLowerCase().includes(search.toLowerCase()))
            );

            const selectedProp = data.find(i => i.id === selectedId);

            return (
                <div className="flex h-screen bg-slate-50">
                    <aside className="w-64 bg-slate-900 text-white p-6">
                        <h1 className="text-xl font-black text-emerald-400 mb-10 tracking-widest">DPTOLIBRE</h1>
                        <nav className="space-y-4">
                            {['Usuarios', 'Contratos', 'Propiedades'].map(i => (
                                <div key={i} className={`p-2 cursor-pointer ${i === 'Propiedades' ? 'font-bold text-emerald-400 border-l-4 border-emerald-400' : 'text-slate-400'}`}>{i}</div>
                            ))}
                        </nav>
                    </aside>

                    <main className="flex-1 p-8 overflow-y-auto">
                        {!selectedId ? (
                            <>
                                <div className="flex justify-between items-center mb-6">
                                    <input onChange={(e) => setSearch(e.target.value)} placeholder="Buscar..." className="p-3 border rounded-xl w-1/3 shadow-sm" />
                                    <div className="flex gap-2">
                                        {['Todos', 'Alquilada', 'Reservado', 'Disponible'].map(f => (
                                            <button key={f} onClick={() => setFilter(f)} className={`px-3 py-1 rounded-full text-xs font-bold ${filter === f ? 'bg-slate-800 text-white' : 'bg-white border'}`}>{f}</button>
                                        ))}
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setView('grid')} className="px-4 py-2 bg-white rounded-lg border shadow-sm">Grid</button>
                                        <button onClick={() => setView('list')} className="px-4 py-2 bg-white rounded-lg border shadow-sm">Lista</button>
                                        <button className="bg-emerald-600 text-white px-6 py-2 rounded-lg font-bold">+ Nuevo</button>
                                    </div>
                                </div>
                                <div className={view === 'grid' ? "grid grid-cols-1 lg:grid-cols-2 gap-6" : "space-y-4"}>
                                    {filteredData.map(p => (
                                        <div key={p.id} onClick={() => setSelectedId(p.id)} className="bg-white p-5 rounded-2xl border shadow-sm cursor-pointer hover:border-emerald-500">
                                            <h3 className="font-bold text-lg">{p.address}</h3>
                                            <p className="text-sm text-slate-500">{p.status} • Dueño: {p.owner}</p>
                                        </div>
                                    ))}
                                </div>
                            </>
                        ) : (
                            <div className="bg-white p-8 rounded-3xl border shadow-lg">
                                <button onClick={() => setSelectedId(null)} className="mb-4 text-emerald-600 font-bold">← Volver</button>
                                <div className="grid grid-cols-2 gap-10">
                                    <div>
                                        <h2 className="text-3xl font-black mb-2">{selectedProp.address}</h2>
                                        <div className="grid grid-cols-3 gap-2 mb-6">
                                            {[1,2,3].map(i => <div key={i} className="h-24 bg-slate-200 rounded-lg flex items-center justify-center text-xs text-slate-500">Foto {i}</div>)}
                                        </div>
                                        <label className="block text-xs text-slate-400">Descripción</label>
                                        <textarea className="w-full h-24 border rounded-xl p-3" defaultValue={selectedProp.desc}></textarea>
                                    </div>
                                    <div>
                                        <div className="h-48 bg-slate-100 rounded-2xl flex items-center justify-center border-2 border-dashed mb-6">Mapa de Ubicación</div>
                                        <div className="space-y-4">
                                            <input className="w-full p-3 border rounded-xl" defaultValue={selectedProp.owner} />
                                            <input className="w-full p-3 border rounded-xl" defaultValue={selectedProp.status} />
                                            <button className="w-full bg-slate-900 text-white py-3 rounded-xl font-bold">Guardar Cambios</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
