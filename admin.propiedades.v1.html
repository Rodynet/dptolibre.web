<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DptoLibre Admin - Gestión de Propiedades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .slide-in-right { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const initialProperties = [
            { id: 1, address: "Belgrano 880, 2A", owner: "Ana Silva", ownerLink: "#", tenant: "Juan Pérez", tenantLink: "#", status: "Alquilada", price: "$450.000", features: "2 Dorm, 1 Baño, Balcón", contract: "CTR-001", contractLink: "#", lastUpdate: "2026-05-20", location: "Córdoba, Centro", photos: [1, 2, 3] },
            { id: 2, address: "Caseros 1230, 4B", owner: "Carlos Paz", ownerLink: "#", tenant: "María López", tenantLink: "#", status: "Alquilada", price: "$600.000", features: "3 Dorm, 2 Baños, Cochera", contract: "CTR-9901", contractLink: "#", lastUpdate: "2026-05-22", location: "Córdoba, B° Alberdi", photos: [1, 2] },
            { id: 3, address: "Av. Colón 450", owner: "Carlos Paz", ownerLink: "#", tenant: "Ninguno", tenantLink: null, status: "Vacante", price: "$320.000", features: "1 Dorm, Monoambiente", contract: "Sin contrato", contractLink: null, lastUpdate: "2026-06-03", location: "Córdoba, Centro", photos: [1] },
            { id: 4, address: "San Martín 22", owner: "Juan Pérez", ownerLink: "#", tenant: "Comercio S.A.", tenantLink: "#", status: "En Mantenimiento", price: "$0", features: "Local Comercial", contract: "MT-005", contractLink: "#", lastUpdate: "2026-05-21", location: "Córdoba, Nueva Cba", photos: [1, 2, 3, 4] }
        ];

        function App() {
            const [filter, setFilter] = useState('Todos');
            const [search, setSearch] = useState('');
            const [selectedProp, setSelectedProp] = useState(null);

            const getAntiquity = (dateStr) => {
                const date = new Date(dateStr);
                const now = new Date();
                const diff = Math.floor((now - date) / (1000 * 60 * 60 * 24));
                return `${diff} días en este estado`;
            };

            const filtered = initialProperties
                .filter(p => filter === 'Todos' || p.status === filter)
                .filter(p => p.address.toLowerCase().includes(search.toLowerCase()) || p.owner.toLowerCase().includes(search.toLowerCase()))
                .sort((a, b) => new Date(b.lastUpdate) - new Date(a.lastUpdate));

            const StatusBadge = ({ status }) => {
                const colors = { "Alquilada": "bg-emerald-100 text-emerald-700", "Vacante": "bg-amber-100 text-amber-700", "En Mantenimiento": "bg-red-100 text-red-700" };
                return <span className={`px-2 py-1 rounded-full text-[9px] font-black uppercase ${colors[status]}`}>{status}</span>;
            };

            return (
                <div className="flex h-screen bg-slate-50">
                    <aside className="w-72 bg-slate-900 p-6 flex flex-col text-white">
                        <h1 className="font-black text-xl mb-10">DptoLibre</h1>
                        <nav className="space-y-4">
                            {['Dashboard', 'Usuarios', 'Propiedades'].map(item => (
                                <button key={item} className={`w-full p-4 rounded-xl text-left font-bold ${item === 'Propiedades' ? 'bg-[#0055DD]' : 'text-slate-400'}`}>{item}</button>
                            ))}
                        </nav>
                    </aside>

                    <main className="flex-1 p-10 overflow-y-auto">
                        <div className="flex justify-between items-center mb-8">
                            <h2 className="text-2xl font-black text-slate-800">Propiedades</h2>
                            <input 
                                className="p-3 w-80 rounded-xl bg-white shadow-sm border border-slate-200"
                                placeholder="Buscar por dirección o dueño..."
                                onChange={(e) => setSearch(e.target.value)}
                            />
                        </div>

                        <div className="flex gap-2 mb-6">
                            {['Todos', 'Alquilada', 'Vacante', 'En Mantenimiento'].map(f => (
                                <button key={f} onClick={() => setFilter(f)} className={`px-4 py-2 rounded-lg text-[10px] font-black uppercase ${filter === f ? 'bg-[#0055DD] text-white' : 'bg-white border'}`}>{f}</button>
                            ))}
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200">
                            {filtered.map(p => (
                                <div key={p.id} className="flex items-center p-6 border-b border-slate-100 hover:bg-slate-50 transition-all">
                                    <div className="w-16 h-16 bg-slate-200 rounded-xl mr-6"></div>
                                    <div className="flex-1">
                                        <p className="font-black text-slate-800">{p.address}</p>
                                        <p className="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Dueño: {p.owner}</p>
                                    </div>
                                    <div className="mr-10"><StatusBadge status={p.status} /></div>
                                    <button onClick={() => setSelectedProp(p)} className="px-6 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold text-xs">Abrir Legajo</button>
                                </div>
                            ))}
                        </div>
                    </main>

                    {selectedProp && (
                        <div className="fixed inset-0 bg-black/20 backdrop-blur-sm flex justify-end z-50">
                            <div className="w-[500px] bg-white h-full shadow-2xl slide-in-right p-8 overflow-y-auto">
                                <div className="flex justify-between mb-8">
                                    <h2 className="text-xl font-black">Legajo: {selectedProp.address}</h2>
                                    <button onClick={() => setSelectedProp(null)} className="font-bold">Cerrar</button>
                                </div>
                                
                                <div className="flex gap-2 mb-6 overflow-x-auto no-scrollbar">
                                    {selectedProp.photos.map((pic, i) => <div key={i} className="w-24 h-24 bg-slate-200 rounded-xl flex-shrink-0"></div>)}
                                </div>

                                <div className="space-y-4 mb-6">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-slate-50 p-4 rounded-xl">
                                            <p className="text-[10px] uppercase font-black text-slate-400">Dueño</p>
                                            <a href={selectedProp.ownerLink} className="font-bold text-[#0055DD] underline">{selectedProp.owner}</a>
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded-xl">
                                            <p className="text-[10px] uppercase font-black text-slate-400">Inquilino</p>
                                            <a href={selectedProp.tenantLink} className="font-bold text-[#0055DD] underline">{selectedProp.tenant}</a>
                                        </div>
                                    </div>
                                    <div className="bg-slate-50 p-4 rounded-xl">
                                        <p className="text-[10px] uppercase font-black text-slate-400">Contrato</p>
                                        <a href={selectedProp.contractLink} className="font-bold text-slate-800 underline">{selectedProp.contract}</a>
                                    </div>
                                    <div className="bg-slate-50 p-4 rounded-xl">
                                        <p className="text-[10px] uppercase font-black text-slate-400">Ubicación y Estado</p>
                                        <p className="font-bold text-slate-800">{selectedProp.location}</p>
                                        <p className="text-xs text-emerald-600 font-bold">{getAntiquity(selectedProp.lastUpdate)}</p>
                                    </div>
                                </div>
                                
                                <button className="w-full py-4 bg-[#0055DD] text-white rounded-xl font-black uppercase text-xs">Editar Propiedad</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
