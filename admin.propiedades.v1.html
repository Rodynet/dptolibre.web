<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DptoLibre - Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; }
        .sidebar { transition: width 0.3s ease; }
        .main-content { transition: margin-left 0.3s ease; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Estructura Principal -->
    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar w-64 bg-white border-r border-gray-200 flex flex-col">
            <div class="h-16 flex items-center px-6 border-b border-gray-100 font-bold text-blue-600 text-xl">
                DptoLibre
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" class="block p-3 bg-blue-50 text-blue-600 rounded-lg font-medium">Dashboard</a>
                <a href="#" class="block p-3 text-gray-600 hover:bg-gray-50 rounded-lg">Propiedades</a>
                <a href="#" class="block p-3 text-gray-600 hover:bg-gray-50 rounded-lg">Propietarios</a>
            </nav>
        </aside>

        <!-- Contenido -->
        <main class="main-content flex-1 flex flex-col overflow-y-auto">
            <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8">
                <h2 class="text-lg font-semibold text-gray-700">Resumen</h2>
                <div class="flex items-center gap-4">
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700">
                        Nueva Gestión
                    </button>
                </div>
            </header>

            <div class="p-8">
                <div id="app-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Aquí se inyectan las tarjetas dinámicamente -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // Simulación de carga de datos para evitar errores de renderizado
        const data = [1, 2, 3, 4, 5, 6];
        const container = document.getElementById('app-container');
        
        container.innerHTML = data.map(i => `
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                <div class="h-40 bg-gray-100 rounded-lg mb-4 flex items-center justify-center text-gray-400">
                    Imagen ${i}
                </div>
                <h3 class="font-bold text-gray-800">Propiedad #${i}</h3>
                <p class="text-sm text-gray-500">Ubicación y detalles básicos</p>
            </div>
        `).join('');
    </script>
</body>
</html>
