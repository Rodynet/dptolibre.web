<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DptoLibre Admin Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const data = [
            { id: 1, address: "Belgrano 880, 2A", owner: "Ana Silva", tenant: "Juan Pérez", status: "Alquilada", progress: "80%", desde: "01/01/2026", hasta: "01/01/2027", features: ["Cochera", "Pileta"], lat: -31.4201, lng: -64.1888 },
            { id: 2, address: "Caseros 1230, 4B", owner: "Carlos Paz", tenant: "Lucía M.", status: "Reservado", progress: "40%", desde: "15/05/2026", hasta: "15/05/2027", features: ["Cochera"], lat: -31.4170, lng: -64.1850 },
            { id: 3, address: "Av. Colón 450", owner: "Carlos Paz", tenant: "N/A", status: "Disponible", progress: "0%", desde: "Actual", hasta: null, features: ["Balcón"], lat: -31.4150, lng: -64.1900 },
            { id: 4, address: "San Luis 789", owner: "Marta Gomez", tenant: "Pedro S.", status: "Disponible", progress: "10%", desde: "Actual", hasta: null, features: ["Pileta", "Patio"], lat: -31.4250, lng: -64.1800 }
        ];

        const statusColors = {
            "Alquilada": "bg-emerald-100 text-emerald-800 border-emerald-200",
            "Reservado": "bg-amber-100 text-amber-800 border-amber-200",
            "Disponible": "bg-blue-100 text-blue-800 border-blue-200"
        };

        function App() {
            const [view, setView] = useState('grid');
            const [selectedId, setSelectedId] = useState(null);
            const [editOwner, setEditOwner] = useState('');

            const getSelected = () => data.find(i => i.id === selectedId);

            return (
                <div className="flex h-screen bg-slate-50">
                    <aside className="w-64 bg-slate-900 text-white p-6">
                        <div className="font-bold text-xl mb-10 text-emerald-400">DptoLibre</div>
                        <nav className="space-y-4 text-slate-300">
                            <p className="text-xs uppercase font-bold text-slate-500">Gestión</p>
                            <div className="bg-slate-800 p-2 rounded-lg text-white cursor-pointer">Propiedades</div>
                            <div className="cursor-pointer hover:text-white">Contratos</div>
                            <p className="text-xs uppercase font-bold text-slate-500 pt-6">Admin</p>
                            <div className="cursor-pointer hover:text-white">Propietarios</div>
                        </nav>
                    </aside>

                    <main className="flex-1 p-8 overflow-y-auto">
                        {!selectedId ? (
                            <>
                                <div className="flex justify-between items-center mb-8">
                                    <h1 className="text-2xl font-bold">Propiedades</h1>
                                    <button className="bg-emerald-600 text-white px-5 py-2 rounded-xl font-bold hover:bg-emerald-700">+ Nuevo</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {data.map(p => (
                                        <div key={p.id} onClick={() => setSelectedId(p.id)} className="bg-white p-4 rounded-2xl border shadow-sm hover:shadow-md transition cursor-pointer flex gap-4">
                                            <div className="w-20 h-20 bg-slate-200 rounded-lg shrink-0"></div>
                                            <div className="flex-1">
                                                <h3 className="font-bold">{p.address}</h3>
                                                <span className={`text-[10px] px-2 py-0.5 rounded-full border ${statusColors[p.status]}`}>{p.status}</span>
                                                <div className="text-xs text-slate-500 mt-2">
                                                    {p.status === 'Alquilada' || p.status === 'Reservado' ? `Desde: ${p.desde} | Hasta: ${p.hasta}` : `Desde: ${p.desde}`}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        ) : (
                            <div className="bg-white p-8 rounded-2xl border shadow-lg max-w-5xl mx-auto">
                                <button onClick={() => setSelectedId(null)} className="text-emerald-600 mb-6 font-bold">← Volver</button>
                                <div className="grid grid-cols-3 gap-8">
                                    <div className="col-span-2 space-y-6">
                                        <div className="bg-slate-200 h-64 rounded-xl flex items-center justify-center font-bold text-slate-500">
                                            [Mapa de ubicación: {getSelected().lat}, {getSelected().lng}]
                                        </div>
                                        <div>
                                            <h4 className="font-bold mb-2">Características</h4>
                                            <div className="flex gap-2">
                                                {getSelected().features.map(f => <span key={f} className="bg-slate-100 px-3 py-1 rounded-lg text-sm">{f}</span>)}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="space-y-4">
                                        <h2 className="text-xl font-bold">{getSelected().address}</h2>
                                        <label className="block text-sm font-semibold">Propietario (Buscar min 3 letras)</label>
                                        <input className="w-full p-2 border rounded-lg" placeholder="Nombre propietario..." />
                                        <div className="p-4 bg-slate-50 rounded-xl border">
                                            <p className="text-sm font-semibold">Inquilino (No editable)</p>
                                            <p className="text-lg">{getSelected().tenant}</p>
                                        </div>
                                        <button className="w-full bg-emerald-600 text-white py-2 rounded-xl font-bold">Guardar Cambios</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
