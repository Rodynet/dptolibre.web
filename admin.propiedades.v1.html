<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DptoLibre Admin Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const initialData = [
            { id: 1, address: "Belgrano 880, 2A", owner: "Ana Silva", tenant: "Juan Pérez", status: "Alquilada", progress: 80, desde: "01/01/2026", hasta: "01/01/2027", features: ["Cochera", "Pileta"], img: "https://images.unsplash.com/photo-1580587771525-78b9dba3b914?auto=format&fit=crop&w=300&q=80", lat: -31.4201, lng: -64.1888 },
            { id: 2, address: "Caseros 1230, 4B", owner: "Carlos Paz", tenant: "Lucía M.", status: "Reservado", progress: 40, desde: "15/05/2026", hasta: "15/05/2027", features: ["Cochera"], img: "https://images.unsplash.com/photo-1568605114967-8130f3a36994?auto=format&fit=crop&w=300&q=80", lat: -31.4170, lng: -64.1850 },
            { id: 3, address: "Av. Colón 450", owner: "Carlos Paz", tenant: "N/A", status: "Disponible", progress: 0, desde: "Actual", hasta: null, features: ["Balcón"], img: "https://images.unsplash.com/photo-1570129477492-45c003edd2be?auto=format&fit=crop&w=300&q=80", lat: -31.4150, lng: -64.1900 },
            { id: 4, address: "San Luis 789", owner: "Marta Gomez", tenant: "Pedro S.", status: "Disponible", progress: 0, desde: "Actual", hasta: null, features: ["Pileta", "Patio"], img: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=300&q=80", lat: -31.4250, lng: -64.1800 }
        ];

        function App() {
            const [data, setData] = useState(initialData);
            const [selectedId, setSelectedId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [filterStatus, setFilterStatus] = useState('Todos');

            const filteredData = useMemo(() => {
                return data.filter(p => 
                    (filterStatus === 'Todos' || p.status === filterStatus) &&
                    (p.address.toLowerCase().includes(searchTerm.toLowerCase()))
                );
            }, [searchTerm, filterStatus, data]);

            const selected = data.find(i => i.id === selectedId);

            return (
                <div className="flex h-screen bg-slate-50">
                    <aside className="w-64 bg-slate-900 text-white p-6">
                        <h1 className="font-bold text-xl mb-10 text-emerald-400">DptoLibre</h1>
                        <nav className="space-y-4 text-slate-300">
                            <div className="bg-slate-800 p-2 rounded-lg text-white">Propiedades</div>
                        </nav>
                    </aside>

                    <main className="flex-1 p-8 overflow-y-auto">
                        {!selectedId ? (
                            <>
                                <div className="flex gap-4 mb-8">
                                    <input placeholder="Buscar por dirección..." className="p-2 border rounded-xl w-64" onChange={(e) => setSearchTerm(e.target.value)} />
                                    <select className="p-2 border rounded-xl" onChange={(e) => setFilterStatus(e.target.value)}>
                                        <option>Todos</option><option>Alquilada</option><option>Reservado</option><option>Disponible</option>
                                    </select>
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    {filteredData.map(p => (
                                        <div key={p.id} onClick={() => setSelectedId(p.id)} className="bg-white p-4 rounded-2xl border shadow-sm hover:shadow-lg transition cursor-pointer flex gap-4">
                                            <img src={p.img} className="w-24 h-24 rounded-lg object-cover" alt="Propiedad" />
                                            <div className="flex-1">
                                                <h3 className="font-bold">{p.address}</h3>
                                                <span className={`text-[10px] px-2 py-0.5 rounded-full border ${p.status === 'Alquilada' ? 'bg-emerald-100 text-emerald-800' : p.status === 'Reservado' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'}`}>{p.status}</span>
                                                <p className="text-xs text-slate-500 mt-2">Desde: {p.desde} {p.hasta ? `| Hasta: ${p.hasta}` : ''}</p>
                                                {p.status === 'Alquilada' && (
                                                    <div className="w-full bg-slate-200 h-2 rounded-full mt-2 overflow-hidden"><div className="bg-emerald-500 h-full" style={{width: p.progress + '%'}}></div></div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        ) : (
                            <div className="bg-white p-8 rounded-2xl border shadow-lg max-w-4xl mx-auto">
                                <button onClick={() => setSelectedId(null)} className="text-emerald-600 font-bold mb-4">← Volver</button>
                                <div className="grid grid-cols-2 gap-8">
                                    <div>
                                        <div className="bg-slate-200 h-48 rounded-xl mb-4 flex items-center justify-center text-slate-500">[Mapa: {selected.lat}, {selected.lng}]</div>
                                        <h4 className="font-bold">Características</h4>
                                        <input className="w-full p-2 border rounded-lg mt-2" defaultValue={selected.features.join(', ')} />
                                    </div>
                                    <div className="space-y-4">
                                        <h2 className="text-xl font-bold">{selected.address}</h2>
                                        <label className="text-sm">Dueño</label>
                                        <input className="w-full p-2 border rounded-lg" defaultValue={selected.owner} placeholder="Escriba para buscar propietario (min 3 letras)..." />
                                        <div className="p-4 bg-slate-100 rounded-xl">
                                            <p className="text-xs font-bold text-slate-500">Inquilino (No editable)</p>
                                            <p>{selected.tenant}</p>
                                        </div>
                                        <button className="w-full bg-emerald-600 text-white py-2 rounded-xl">Guardar</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
