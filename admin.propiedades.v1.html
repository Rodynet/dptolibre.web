<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DptoLibre Admin Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const data = [
            { id: 1, address: "Belgrano 880, 2A", owner: "Ana Silva", status: "Alquilada" },
            { id: 2, address: "Caseros 1230, 4B", owner: "Carlos Paz", status: "Reservado" },
            { id: 3, address: "Av. Colón 450", owner: "Carlos Paz", status: "Disponible" },
            { id: 4, address: "San Luis 789", owner: "Marta Gomez", status: "Disponible" }
        ];

        function App() {
            const [view, setView] = useState('grid');
            const [search, setSearch] = useState('');
            const [filter, setFilter] = useState('Todos');
            const [selectedId, setSelectedId] = useState(null);

            const filteredData = data.filter(i => 
                (filter === 'Todos' || i.status === filter) &&
                (i.address.toLowerCase().includes(search.toLowerCase()))
            );

            return (
                <div className="flex h-screen bg-slate-50">
                    <aside className="w-20 bg-slate-900 flex flex-col items-center py-8 space-y-8">
                        <div className="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center font-bold text-white">DL</div>
                        <div className="text-slate-500 text-xs">Menu</div>
                    </aside>

                    <main className="flex-1 p-8 overflow-y-auto">
                        {!selectedId ? (
                            <>
                                <div className="flex justify-between items-center mb-8">
                                    <div className="flex gap-4 items-center w-full max-w-2xl">
                                        <input onChange={(e) => setSearch(e.target.value)} placeholder="Buscar propiedad..." className="p-3 border rounded-xl w-full shadow-sm outline-none focus:ring-2 ring-emerald-500" />
                                        <select onChange={(e) => setFilter(e.target.value)} className="p-3 border rounded-xl shadow-sm outline-none">
                                            {['Todos', 'Alquilada', 'Reservado', 'Disponible'].map(f => <option key={f}>{f}</option>)}
                                        </select>
                                    </div>
                                    <div className="flex gap-2 bg-white p-1 rounded-xl border shadow-sm">
                                        <button onClick={() => setView('grid')} className={`p-2 rounded-lg ${view === 'grid' ? 'bg-slate-100' : ''}`}>⊞</button>
                                        <button onClick={() => setView('list')} className={`p-2 rounded-lg ${view === 'list' ? 'bg-slate-100' : ''}`}>☰</button>
                                        <button className="bg-emerald-600 text-white px-4 py-2 rounded-lg ml-2 font-bold">+</button>
                                    </div>
                                </div>

                                <div className={view === 'grid' ? "grid grid-cols-1 md:grid-cols-3 gap-4" : "space-y-2"}>
                                    {filteredData.map(p => (
                                        <div key={p.id} onClick={() => setSelectedId(p.id)} className="bg-white p-4 rounded-xl border border-slate-200 hover:shadow-md cursor-pointer flex items-center gap-4">
                                            <div className="w-16 h-16 bg-slate-200 rounded-lg shrink-0"></div>
                                            <div>
                                                <h3 className="font-semibold">{p.address}</h3>
                                                <p className="text-xs text-slate-500">{p.status} • {p.owner}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        ) : (
                            <div className="bg-white p-8 rounded-2xl border shadow-lg max-w-4xl mx-auto">
                                <button onClick={() => setSelectedId(null)} className="text-slate-400 mb-6 font-semibold">← Volver al listado</button>
                                <div className="grid grid-cols-2 gap-8">
                                    <div>
                                        <div className="h-40 bg-slate-200 rounded-xl mb-4"></div>
                                        <div className="grid grid-cols-4 gap-2">{[1,2,3,4].map(i => <div key={i} className="h-12 bg-slate-100 rounded-lg"></div>)}</div>
                                    </div>
                                    <div className="space-y-4">
                                        <h2 className="text-2xl font-bold">{data.find(i=>i.id===selectedId).address}</h2>
                                        <div className="h-32 bg-slate-100 rounded-xl border border-dashed flex items-center justify-center text-slate-400">Mapa de Ubicación</div>
                                        <input className="w-full p-3 border rounded-xl" defaultValue={data.find(i=>i.id===selectedId).owner} />
                                        <button className="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold">Guardar Cambios</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
