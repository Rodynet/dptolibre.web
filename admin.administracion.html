<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DptoLibre Admin - Facturación ARCA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --brand-blue: #0055DD;
            --brand-cyan: #00D1FF;
            --bg-gray: #F4F7F9;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-gray);
            color: #1e293b;
            margin: 0;
            overflow: hidden;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { 
                if (window.lucide) window.lucide.createIcons(); 
            }, [name, size, className]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // --- DATOS MOCK ---
        const MOCK_LIQUIDACIONES = [
            {
                id: "LQ-2026-04-123",
                propiedad: "Caseros 1230, 4B",
                inquilino: { nombre: "Marcos Galperin", dni: "20.444.555", cuit: "20-20444555-9", condicionIva: "Consumidor Final" },
                propietario: { nombre: "Roberto Daer", cuit: "20-11222333-8", condicionIva: "Responsable Inscripto", ptoVenta: "0003" },
                estado: "PENDIENTE",
                periodo: "Abril 2026",
                conceptos: [
                    { tipo: "ALQUILER", desc: "Alquiler Mensual (Abril 2026)", monto: 450000, facturarPor: "PROPIETARIO" },
                    { tipo: "HONORARIOS", desc: "Comisión Administración (5%)", monto: 22500, facturarPor: "INMOBILIARIA" },
                    { tipo: "DESCUENTO", desc: "Arreglo Plomería Ticket #882", monto: -15000, facturarPor: "NA" }
                ],
                totalNetoDueño: 412500
            },
            {
                id: "LQ-2026-04-124",
                propiedad: "Av. Colón 450, 10C",
                inquilino: { nombre: "Lucía Martínez", dni: "35.111.222", cuit: "27-35111222-4", condicionIva: "Monotributista" },
                propietario: { nombre: "Ana Silva", cuit: "27-22333444-5", condicionIva: "Monotributista", ptoVenta: "0001" },
                estado: "FACTURADO",
                periodo: "Abril 2026",
                comprobantes: [
                    { nro: "0001-00000452", tipo: "Factura C", cae: "74123456789012" }, // Factura del dueño al inquilino
                    { nro: "0002-00008921", tipo: "Factura C", cae: "74987654321098" }  // Factura inmo al dueño
                ],
                conceptos: [
                    { tipo: "ALQUILER", desc: "Alquiler Mensual (Abril 2026)", monto: 320000, facturarPor: "PROPIETARIO" },
                    { tipo: "HONORARIOS", desc: "Comisión Administración (5%)", monto: 16000, facturarPor: "INMOBILIARIA" }
                ],
                totalNetoDueño: 304000
            }
        ];

        function FacturacionARCA() {
            const [view, setView] = useState('listado'); // listado, configuracion
            const [searchTerm, setSearchTerm] = useState('');
            const [filterStatus, setFilterStatus] = useState('TODOS'); // TODOS, PENDIENTE, FACTURADO
            const [selectedLiq, setSelectedLiq] = useState(null);

            // Filtros
            const filteredLiquidaciones = MOCK_LIQUIDACIONES.filter(liq => {
                const matchesSearch = liq.propiedad.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                      liq.inquilino.nombre.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                      liq.propietario.nombre.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesStatus = filterStatus === 'TODOS' || liq.estado === filterStatus;
                return matchesSearch && matchesStatus;
            });

            // --- COMPONENTES AUXILIARES ---
            const SidebarItem = ({ id, label, icon: IconComponent, active }) => (
                <button 
                    onClick={() => setView(id)}
                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition-all ${active ? 'bg-[#0055DD] text-white shadow-lg shadow-blue-500/20' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}
                >
                    <IconComponent size={18} /> {label}
                </button>
            );

            const StatusBadge = ({ status }) => {
                if (status === 'FACTURADO') return <span className="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest border border-emerald-200">Facturado</span>;
                if (status === 'PENDIENTE') return <span className="bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest border border-amber-200">Pendiente Emisión</span>;
                return null;
            };

            // --- VISTAS ---

            const ListadoView = () => (
                <div className="flex-1 overflow-y-auto custom-scrollbar p-8 animate-in">
                    <header className="flex justify-between items-end mb-8">
                        <div>
                            <h1 className="text-3xl font-black text-slate-800 tracking-tight">Facturación Electrónica (ARCA)</h1>
                            <p className="text-slate-500 font-medium mt-1">Emite comprobantes en nombre de tus dueños y de tu inmobiliaria.</p>
                        </div>
                        <div className="flex gap-3">
                            <button onClick={() => setView('configuracion')} className="bg-white border border-slate-200 px-5 py-2.5 rounded-xl font-black text-[10px] uppercase tracking-widest text-slate-600 flex items-center gap-2 hover:bg-slate-50 transition-colors">
                                <Icon name="settings" size={16} /> Configurar API ARCA
                            </button>
                            <button className="bg-[#0055DD] text-white px-6 py-2.5 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg shadow-blue-500/30 flex items-center gap-2 hover:bg-blue-700 transition-colors">
                                <Icon name="zap" size={16} /> Facturación Masiva Lote
                            </button>
                        </div>
                    </header>

                    {/* KPIs Rápidos */}
                    <div className="grid grid-cols-4 gap-6 mb-8">
                        <div className="glass-card p-6 rounded-3xl">
                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Recaudado (Mes)</p>
                            <h3 className="text-2xl font-black text-slate-800">$770.000</h3>
                        </div>
                        <div className="glass-card p-6 rounded-3xl">
                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">A Facturar por Dueños</p>
                            <h3 className="text-2xl font-black text-indigo-600">$770.000</h3>
                        </div>
                        <div className="glass-card p-6 rounded-3xl">
                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">A Facturar por Inmo</p>
                            <h3 className="text-2xl font-black text-emerald-600">$38.500</h3>
                        </div>
                        <div className="glass-card p-6 rounded-3xl border-l-4 border-amber-500 bg-amber-50/50">
                            <p className="text-[10px] font-black text-amber-600 uppercase tracking-widest mb-1">Pendientes Emisión</p>
                            <h3 className="text-2xl font-black text-amber-800">1 Operación</h3>
                        </div>
                    </div>

                    {/* Filtros y Buscador */}
                    <div className="flex justify-between items-center mb-6">
                        <div className="flex gap-2">
                            {['TODOS', 'PENDIENTE', 'FACTURADO'].map(f => (
                                <button 
                                    key={f} 
                                    onClick={() => setFilterStatus(f)}
                                    className={`px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest transition-colors ${filterStatus === f ? 'bg-slate-800 text-white' : 'bg-white border border-slate-200 text-slate-500 hover:bg-slate-50'}`}
                                >
                                    {f}
                                </button>
                            ))}
                        </div>
                        <div className="relative">
                            <Icon name="search" className="absolute left-3 top-2.5 text-slate-400" size={18} />
                            <input 
                                type="text" 
                                placeholder="Buscar propiedad, dueño..." 
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm w-72 focus:ring-2 focus:ring-[#0055DD] outline-none transition-all shadow-sm"
                            />
                        </div>
                    </div>

                    {/* Listado Principal */}
                    <div className="space-y-4">
                        {filteredLiquidaciones.map(liq => (
                            <div key={liq.id} className="glass-card rounded-[2rem] p-6 flex flex-col gap-4 border-l-4 border-l-transparent hover:border-l-[#0055DD] transition-all">
                                <div className="flex justify-between items-start">
                                    <div className="flex items-center gap-4">
                                        <div className="w-12 h-12 bg-indigo-50 text-[#0055DD] rounded-2xl flex items-center justify-center">
                                            <Icon name="building-2" size={24} />
                                        </div>
                                        <div>
                                            <h4 className="font-black text-slate-800 text-lg leading-tight">{liq.propiedad}</h4>
                                            <div className="flex items-center gap-3 mt-1">
                                                <p className="text-[10px] font-bold text-slate-500 uppercase flex items-center gap-1"><Icon name="user" size={12}/> Dueño: {liq.propietario.nombre}</p>
                                                <p className="text-[10px] font-bold text-slate-500 uppercase flex items-center gap-1"><Icon name="users" size={12}/> Inq: {liq.inquilino.nombre}</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="text-right flex flex-col items-end gap-2">
                                        <StatusBadge status={liq.estado} />
                                        <span className="text-xs font-bold text-slate-400">{liq.periodo}</span>
                                    </div>
                                </div>

                                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex justify-between items-center">
                                    <div className="flex gap-6">
                                        <div>
                                            <p className="text-[9px] font-black text-slate-400 uppercase">Cobro Bruto (Alquiler)</p>
                                            <p className="text-sm font-black text-slate-700">${liq.conceptos.find(c=>c.tipo==='ALQUILER')?.monto.toLocaleString()}</p>
                                        </div>
                                        <div>
                                            <p className="text-[9px] font-black text-slate-400 uppercase">A Facturar (Inmo)</p>
                                            <p className="text-sm font-black text-[#0055DD]">${liq.conceptos.find(c=>c.tipo==='HONORARIOS')?.monto.toLocaleString()}</p>
                                        </div>
                                        <div>
                                            <p className="text-[9px] font-black text-slate-400 uppercase">Descuentos</p>
                                            <p className="text-sm font-black text-red-500">{liq.conceptos.find(c=>c.tipo==='DESCUENTO')?.monto.toLocaleString() || "$0"}</p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setSelectedLiq(liq)}
                                        className="bg-[#0D1B4B] text-white px-5 py-2.5 rounded-xl font-black text-[10px] uppercase tracking-widest hover:bg-blue-900 transition-colors"
                                    >
                                        Ver Detalle / Emitir
                                    </button>
                                </div>
                            </div>
                        ))}
                        {filteredLiquidaciones.length === 0 && (
                            <div className="text-center py-20 opacity-50">
                                <Icon name="receipt" size={64} className="mx-auto mb-4 text-slate-400" />
                                <h3 className="text-lg font-black text-slate-600">No hay operaciones para este filtro</h3>
                            </div>
                        )}
                    </div>
                </div>
            );

            const ConfiguracionARCAView = () => (
                <div className="flex-1 overflow-y-auto custom-scrollbar p-8 animate-in">
                    <header className="flex items-center gap-4 mb-8">
                        <button onClick={() => setView('listado')} className="p-2 bg-white rounded-full shadow-sm hover:bg-slate-50"><Icon name="arrow-left" size={20}/></button>
                        <div>
                            <h2 className="text-2xl font-black text-slate-800">Configuración ARCA (ex AFIP)</h2>
                            <p className="text-sm text-slate-500 font-medium">Vincula tus certificados digitales para emitir facturas en lote.</p>
                        </div>
                    </header>

                    <div className="max-w-3xl space-y-6">
                        <div className="glass-card p-8 rounded-[2rem]">
                            <div className="flex items-center gap-4 mb-6">
                                <div className="w-12 h-12 bg-blue-50 text-[#0055DD] rounded-xl flex items-center justify-center"><Icon name="building" size={24}/></div>
                                <div><h3 className="font-black text-lg text-slate-800">Datos Fiscales Inmobiliaria</h3></div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="text-[10px] font-black uppercase text-slate-400 tracking-widest ml-1">Razón Social</label><input type="text" value="Inmobiliaria Raíces SRL" className="w-full mt-1 bg-slate-50 border border-slate-200 px-4 py-3 rounded-xl text-sm font-bold outline-none focus:border-[#0055DD]" readOnly /></div>
                                <div><label className="text-[10px] font-black uppercase text-slate-400 tracking-widest ml-1">CUIT</label><input type="text" value="30-71234567-8" className="w-full mt-1 bg-slate-50 border border-slate-200 px-4 py-3 rounded-xl text-sm font-bold outline-none focus:border-[#0055DD]" readOnly /></div>
                                <div><label className="text-[10px] font-black uppercase text-slate-400 tracking-widest ml-1">Punto de Venta por Defecto</label><input type="text" placeholder="Ej: 0001" className="w-full mt-1 bg-white border border-slate-200 px-4 py-3 rounded-xl text-sm font-bold outline-none focus:border-[#0055DD]" /></div>
                                <div><label className="text-[10px] font-black uppercase text-slate-400 tracking-widest ml-1">Condición Frente al IVA</label>
                                    <select className="w-full mt-1 bg-white border border-slate-200 px-4 py-3 rounded-xl text-sm font-bold outline-none focus:border-[#0055DD]">
                                        <option>Responsable Inscripto</option>
                                        <option>Monotributo</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div className="glass-card p-8 rounded-[2rem]">
                            <div className="flex items-center justify-between mb-6">
                                <div className="flex items-center gap-4">
                                    <div className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center"><Icon name="key" size={24}/></div>
                                    <div><h3 className="font-black text-lg text-slate-800">Credenciales Web Services</h3><p className="text-[10px] text-slate-500 uppercase font-bold">Certificado CRT y Key</p></div>
                                </div>
                                <span className="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-[10px] font-black uppercase">Conectado OK</span>
                            </div>
                            <div className="space-y-4">
                                <div className="p-4 border-2 border-dashed border-slate-200 rounded-xl flex items-center justify-between hover:bg-slate-50 cursor-pointer transition-colors">
                                    <div className="flex items-center gap-3"><Icon name="file-badge" className="text-slate-400"/><span className="text-sm font-bold text-slate-700">Certificado Digital (.crt)</span></div>
                                    <button className="text-[10px] font-black bg-slate-100 px-3 py-1.5 rounded-lg uppercase">Reemplazar</button>
                                </div>
                                <div className="p-4 border-2 border-dashed border-slate-200 rounded-xl flex items-center justify-between hover:bg-slate-50 cursor-pointer transition-colors">
                                    <div className="flex items-center gap-3"><Icon name="file-key" className="text-slate-400"/><span className="text-sm font-bold text-slate-700">Llave Privada (.key)</span></div>
                                    <button className="text-[10px] font-black bg-slate-100 px-3 py-1.5 rounded-lg uppercase">Reemplazar</button>
                                </div>
                            </div>
                            <div className="mt-6 bg-blue-50 p-4 rounded-xl border border-blue-100 flex gap-3">
                                <Icon name="info" className="text-[#0055DD] shrink-0" size={18}/>
                                <p className="text-[10px] text-blue-800 font-medium">Estos certificados permiten a DptoLibre generar el Token y Sign necesarios para conectarse al WSFEV1 de ARCA automáticamente.</p>
                            </div>
                        </div>
                    </div>
                </div>
            );

            // --- MODAL EMISIÓN ---
            const ModalEmision = () => {
                if (!selectedLiq) return null;
                const liq = selectedLiq;
                
                return (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex justify-end">
                        <div className="bg-white w-[600px] h-full shadow-2xl flex flex-col animate-in slide-in-from-right duration-300">
                            
                            <header className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                <div>
                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Detalle de Operación</p>
                                    <h2 className="text-xl font-black text-slate-800 leading-none">{liq.propiedad}</h2>
                                </div>
                                <button onClick={() => setSelectedLiq(null)} className="p-2 bg-white rounded-full text-slate-400 hover:bg-slate-100"><Icon name="x" size={20}/></button>
                            </header>

                            <div className="flex-1 overflow-y-auto p-8 space-y-8 custom-scrollbar">
                                
                                {/* Info Actores */}
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                        <p className="text-[9px] font-black text-slate-400 uppercase mb-2">Receptor (Inquilino)</p>
                                        <p className="font-bold text-slate-800 text-sm">{liq.inquilino.nombre}</p>
                                        <p className="text-xs text-slate-500 mt-1">CUIT/DNI: {liq.inquilino.cuit || liq.inquilino.dni}</p>
                                        <p className="text-[10px] bg-slate-200 text-slate-600 inline-block px-2 py-0.5 rounded mt-2 font-bold">{liq.inquilino.condicionIva}</p>
                                    </div>
                                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                        <p className="text-[9px] font-black text-slate-400 uppercase mb-2">Emisor (Dueño)</p>
                                        <p className="font-bold text-slate-800 text-sm">{liq.propietario.nombre}</p>
                                        <p className="text-xs text-slate-500 mt-1">CUIT: {liq.propietario.cuit}</p>
                                        <p className="text-[10px] bg-indigo-100 text-indigo-700 inline-block px-2 py-0.5 rounded mt-2 font-bold">{liq.propietario.condicionIva} • Pto.Vta: {liq.propietario.ptoVenta}</p>
                                    </div>
                                </div>

                                {/* Conceptos */}
                                <section>
                                    <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Comprobantes a Emitir</h3>
                                    
                                    {liq.estado === 'FACTURADO' ? (
                                        <div className="space-y-3">
                                            {liq.comprobantes.map((c, i) => (
                                                <div key={i} className="bg-emerald-50 border border-emerald-100 p-4 rounded-xl flex justify-between items-center">
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-lg flex items-center justify-center"><Icon name="check-circle-2" size={20}/></div>
                                                        <div><p className="text-sm font-bold text-emerald-900">{c.tipo} N° {c.nro}</p><p className="text-[10px] text-emerald-700 font-mono">CAE: {c.cae}</p></div>
                                                    </div>
                                                    <button className="text-[10px] font-black text-emerald-700 bg-white px-3 py-1.5 rounded-lg uppercase shadow-sm">Ver PDF</button>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="space-y-4">
                                            {/* Factura Alquiler (Dueño -> Inquilino) */}
                                            <div className="border border-slate-200 rounded-2xl p-5">
                                                <div className="flex justify-between items-center mb-3">
                                                    <span className="text-xs font-bold text-slate-800 flex items-center gap-2"><Icon name="file-text" size={16} className="text-[#0055DD]"/> Factura por Alquiler</span>
                                                    <span className="text-xs font-black">${liq.conceptos.find(c=>c.tipo==='ALQUILER')?.monto.toLocaleString()}</span>
                                                </div>
                                                <p className="text-[10px] text-slate-500 italic mb-3">Se emitirá a nombre de {liq.propietario.nombre} para {liq.inquilino.nombre}.</p>
                                                <div className="flex gap-2">
                                                    <select className="bg-slate-50 border border-slate-200 text-xs font-bold px-3 py-2 rounded-lg outline-none"><option>Factura C</option><option>Factura B</option></select>
                                                    <input type="text" placeholder="Concepto (Ej: Alquiler Abril)" defaultValue="Alquiler Mensual (Abril 2026)" className="flex-1 bg-slate-50 border border-slate-200 text-xs px-3 py-2 rounded-lg outline-none" />
                                                </div>
                                            </div>

                                            {/* Factura Honorarios (Inmo -> Dueño o Inquilino) */}
                                            <div className="border border-slate-200 rounded-2xl p-5">
                                                <div className="flex justify-between items-center mb-3">
                                                    <span className="text-xs font-bold text-slate-800 flex items-center gap-2"><Icon name="receipt" size={16} className="text-[#0055DD]"/> Factura Honorarios Inmo</span>
                                                    <span className="text-xs font-black">${liq.conceptos.find(c=>c.tipo==='HONORARIOS')?.monto.toLocaleString()}</span>
                                                </div>
                                                <p className="text-[10px] text-slate-500 italic mb-3">Se emitirá a nombre de Inmobiliaria Raíces SRL para {liq.propietario.nombre}.</p>
                                            </div>
                                            
                                            {/* Descuentos (Informativo) */}
                                            {liq.conceptos.find(c=>c.tipo==='DESCUENTO') && (
                                                <div className="bg-amber-50 border border-amber-100 rounded-2xl p-4 flex justify-between items-center">
                                                    <div className="flex items-center gap-2 text-amber-800"><Icon name="alert-circle" size={16}/><span className="text-xs font-bold">Descuento aplicado: Arreglo Plomería</span></div>
                                                    <span className="text-xs font-black text-red-600">-${Math.abs(liq.conceptos.find(c=>c.tipo==='DESCUENTO').monto).toLocaleString()}</span>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </section>
                            </div>

                            <footer className="p-6 bg-slate-50 border-t border-slate-100">
                                {liq.estado === 'PENDIENTE' ? (
                                    <button 
                                        onClick={() => { alert("Conectando con WSFEV1 de ARCA. Generando CAE y PDFs..."); setSelectedLiq(null); }}
                                        className="w-full bg-[#0D1B4B] text-white py-4 rounded-xl font-black text-xs uppercase tracking-widest shadow-xl flex justify-center items-center gap-2 hover:bg-blue-900 active:scale-95 transition-all"
                                    >
                                        <Icon name="zap" size={16} /> Emitir y Autorizar en ARCA
                                    </button>
                                ) : (
                                    <button className="w-full bg-white border border-slate-200 text-slate-600 py-4 rounded-xl font-black text-xs uppercase tracking-widest hover:bg-slate-100 transition-colors">
                                        Enviar Comprobantes por Email
                                    </button>
                                )}
                            </footer>
                        </div>
                    </div>
                );
            };

            // --- RENDER LAYOUT PRINCIPAL ---
            return (
                <div className="flex h-screen w-full font-sans bg-slate-50">
                    {/* SIDEBAR GLOBAL ADMINISTRADOR */}
                    <aside className="w-64 bg-[#0A142F] text-white flex flex-col border-r border-slate-800 z-20">
                        <div className="p-6 pb-8 border-b border-white/5 flex items-center gap-3">
                            <div className="w-10 h-10 bg-[#0055DD] rounded-xl flex items-center justify-center text-white font-black text-xl shadow-lg">d</div>
                            <span className="font-black text-xl tracking-tighter leading-none italic">DptoLibre</span>
                        </div>
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto custom-scrollbar mt-4">
                            <p className="px-3 pb-2 text-[10px] font-black uppercase text-slate-500 tracking-widest">Gestión Operativa</p>
                            <SidebarItem id="inicio" label="Dashboard" icon={Icon} active={false} />
                            <SidebarItem id="contratos" label="Contratos" icon={Icon} active={false} />
                            <SidebarItem id="propiedades" label="Propiedades" icon={Icon} active={false} />
                            <p className="px-3 pt-6 pb-2 text-[10px] font-black uppercase text-slate-500 tracking-widest">Finanzas y Legal</p>
                            <SidebarItem id="facturacion" label="Facturación (ARCA)" icon={() => <Icon name="receipt" size={18} />} active={true} />
                            <SidebarItem id="tesoreria" label="Tesorería" icon={() => <Icon name="wallet" size={18} />} active={false} />
                        </nav>
                    </aside>

                    {/* ÁREA CENTRAL */}
                    <div className="flex-1 flex flex-col relative overflow-hidden">
                        {view === 'listado' && <ListadoView />}
                        {view === 'configuracion' && <ConfiguracionARCAView />}
                    </div>

                    <ModalEmision />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FacturacionARCA />);
    </script>
</body>
</html>
